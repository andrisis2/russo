// ================= COMPONI LA FRASE =================
// Le parole della frase arrivano mescolate: si toccano nell'ordine giusto.
function paroleFrase(ru){
  return String(ru||'').split(/\s+/).map(w=>w.replace(/^[«"(]+|[.,!?;:»")…]+$/g,'')).filter(w=>/[а-яё0-9]/i.test(w));
}
function poolComponi(){
  const frasi = (DB.frasi||[]).map(f=>({id:f.id, ru:f.ru, it:f.it, translit:f.translit||''}));
  const dlg = (DB.dialoghi||[]).flatMap(d=>d.battute.map((b,k)=>({id:`d-${d.id}-${k}`, ru:b.ru, it:b.it, dlg:true})));
  return {frasi, dlg};
}
function runComponi(level, opts){
  opts = opts || {};
  const custom = opts.pool && opts.pool.length ? opts.pool : null;
  const {frasi, dlg} = poolComponi();
  const nW = f => paroleFrase(f.ru).length;
  const LIV = [
    ['brevi','🌱','Brevi','3–4 parole', frasi.filter(f=>nW(f)>=3 && nW(f)<=4)],
    ['medie','🌿','Medie','5–6 parole', frasi.filter(f=>nW(f)>=5 && nW(f)<=6)],
    ['lunghe','🌳','Lunghe','7 parole o più', frasi.filter(f=>nW(f)>=7 && nW(f)<=12)],
    ['dialoghi','🎭','Dai dialoghi','Battute delle scene di tutti i giorni', dlg.filter(f=>nW(f)>=3 && nW(f)<=9)],
  ];
  if(!custom && !level){
    const stage = header('Componi la frase');
    stage.appendChild($(`<p class="sg-intro">Leggi la frase in italiano e tocca le parole russe <b>nell'ordine giusto</b>. Un ottimo modo per fissare l'ordine delle parole e le desinenze.</p>`));
    const list = $(`<div class="list"></div>`);
    LIV.forEach(([k,e,t,dd,p])=>{
      const b = $(`<button class="tile wide" type="button"><div class="ico">${e}</div><div class="txt"><div class="t">${t}</div><div class="d">${dd} &middot; ${plur(p.length,'frase','frasi')}</div></div></button>`);
      b.onclick = ()=>navigateTo(()=>runComponi(k));
      list.appendChild(b);
    });
    stage.appendChild(list);
    const tot = extraStore().cmp || 0;
    if(tot) stage.appendChild($(`<p class="muted" style="margin:4px 0 0">Finora hai composto ${plur(tot,'frase','frasi')} giuste.</p>`));
    return;
  }
  const liv = LIV.find(l=>l[0]===level);
  const base = (custom || (liv ? liv[4] : [])).filter(f=>nW(f)>=2 && nW(f)<=12);
  if(!base.length){ const st = header('Componi la frase'); return emptyDone(st, '🧩', 'Nessuna frase adatta', 'Qui servono frasi di almeno due parole.'); }
  // prima le frasi da ripassare, poi le altre
  const deck = shuffle(shuffle(base).sort((a,b)=>(isDue(b.id)?1:0)-(isDue(a.id)?1:0)).slice(0, 8));
  const titolo = opts.titolo ? `Componi · ${opts.titolo}` : liv ? `Componi · ${liv[2]}` : 'Componi la frase';
  const stage = header(titolo, {narrow:true});
  const bar = progressBar(stage);
  const wrap = $(`<div class="list" style="gap:14px"></div>`); stage.appendChild(wrap);
  let i = 0, correct = 0, onKey = null;
  const stopKeys = ()=>{ if(onKey) document.removeEventListener('keydown', onKey); onKey = null; };
  onLeave(stopKeys);
  const restart = ()=>runComponi(level, opts);

  function show(){
    if(i>=deck.length){ stopKeys(); return finish(stage, `${correct} / ${deck.length}`, restart); }
    bar.style.width = (i/deck.length*100)+'%'; bar.setNum(i, deck.length);
    const f = deck[i];
    const giuste = paroleFrase(f.ru);
    // mescola finché l'ordine non è diverso da quello giusto
    let chips = giuste.map((w,k)=>({w,k}));
    for(let g=0; g<8; g++){ chips = shuffle(chips); if(chips.some((c,j)=>c.w!==giuste[j])) break; }
    const scelte = [];
    wrap.innerHTML = '';
    const card = $(`<div class="qcard"><div class="kick">Traduci in russo</div><div class="big-it"></div>
      <button class="btn soft sm listen-btn" type="button">${ic('vol')} Aiutino: ascolta</button></div>`);
    card.querySelector('.big-it').textContent = f.it;
    card.querySelector('.big-it').style.fontSize = Math.max(19, 27 - Math.max(0, f.it.length-24)*0.3) + 'px';
    card.querySelector('.listen-btn').onclick = ()=>speak(onlyCyrillic(f.ru));
    const line = $(`<div class="cmp-line"><span class="ph">Tocca le parole qui sotto</span></div>`);
    const bank = $(`<div class="cmp-bank"></div>`);
    const chk = $(`<button class="btn primary block" type="button" disabled>${ic('check')} Verifica</button>`);
    wrap.append(card, line, bank, chk);
    let answered = false;
    const bankBtns = chips.map((c, j)=>{
      const b = $(`<button class="chipw" type="button"></button>`);
      b.textContent = c.w;
      b.onclick = ()=>{ if(answered || b.classList.contains('used')) return; b.classList.add('used'); scelte.push(j); paint(); };
      bank.appendChild(b);
      return b;
    });
    function paint(){
      line.innerHTML = '';
      if(!scelte.length) line.appendChild($(`<span class="ph">Tocca le parole qui sotto</span>`));
      scelte.forEach((j, pos)=>{
        const b = $(`<button class="chipw" type="button"></button>`);
        b.textContent = chips[j].w;
        b.onclick = ()=>{ if(answered) return; scelte.splice(pos, 1); bankBtns[j].classList.remove('used'); paint(); };
        line.appendChild(b);
      });
      chk.disabled = scelte.length !== chips.length;
    }
    chk.onclick = ()=>{
      if(answered){ i++; return show(); }
      if(scelte.length !== chips.length) return;
      answered = true;
      const ok = scelte.every((j, pos)=>chips[j].w === giuste[pos]);
      if(ok) correct++;
      haptic(ok); contaExtra('cmp', ok);
      if(!ok) logErrore(f.ru, f.it, 'Componi');
      if(!f.dlg && /^f\d/.test(f.id)) grade(f.id, ok); else recordActivity(ok);
      line.classList.add(ok ? 'ok' : 'ko');
      bank.style.display = 'none';
      const sol = $(`<div class="cmp-sol"><div class="lab"></div><div class="ru"></div>${f.translit?'<div class="tr"></div>':''}</div>`);
      sol.querySelector('.lab').textContent = ok ? '✓ Perfetto!' : 'La frase giusta:';
      sol.querySelector('.lab').style.color = ok ? 'var(--good)' : 'var(--bad)';
      sol.querySelector('.ru').textContent = f.ru;
      if(f.translit) sol.querySelector('.tr').textContent = f.translit;
      sol.onclick = ()=>speak(onlyCyrillic(f.ru));
      wrap.insertBefore(sol, chk);
      wrap.insertBefore(azioniTesto(f.ru, f.it, {translit:f.translit}), chk);
      speak(onlyCyrillic(f.ru));
      chk.innerHTML = `${i+1<deck.length ? 'Continua' : 'Risultato'} →`;
      chk.disabled = false;
    };
    // tastiera: numeri per scegliere, Backspace per togliere, Invio per verificare
    stopKeys();
    onKey = e=>{
      if(e.key==='Enter'){ if(!chk.disabled){ e.preventDefault(); chk.click(); } return; }
      if(answered) return;
      if(e.key==='Backspace' && scelte.length){ e.preventDefault(); const j = scelte.pop(); bankBtns[j].classList.remove('used'); paint(); return; }
      const k = parseInt(e.key, 10);
      if(k>=1 && k<=9){ const free = bankBtns.filter(b=>!b.classList.contains('used')); if(free[k-1]) free[k-1].click(); }
    };
    document.addEventListener('keydown', onKey);
  }
  show();
}

// Una parola nuova al giorno in home (sempre la stessa fino a mezzanotte).
function parolaDelGiorno(){
  const voci = (DB.voci||[]).filter(v=>v.ru && v.it && !/\s/.test(v.ru.trim()) && v.ru.length>=3);
  if(!voci.length) return null;

  if(s.wotd && s.wotd.d===oggi){ const v = voci.find(x=>x.id===s.wotd.id); if(v) return v; }
  const storia = new Set(s.wotdStoria||[]);
  const cand = voci.filter(v=>box(v.id)<2 && !storia.has(v.id));
  const pool = cand.length ? cand : voci;
  const v = pool[Math.floor(Math.random()*pool.length)];
  updExtra(x=>{ x.wotd = {d:oggi, id:v.id}; x.wotdStoria = [...(x.wotdStoria||[]), v.id].slice(-500); });
  return v;
}
function makeWotd(){
  const v = parolaDelGiorno();

    <div class="wtxt"><div class="k">${ic('sparkle')} Parola del giorno</div>

  el.onclick = apri;
  el.onkeydown = e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); apri(); } };
  return el;
}
// Frasi (dal frasario e dai dialoghi) che contengono la parola
function frasiConParola(ru){
  const w = normSearch(ru);
  const radice = w.length>=5 ? w.slice(0, -2) : w.length>=4 ? w.slice(0, -1) : w;
  const tutte = [
    ...(DB.frasi||[]).map(f=>({ru:f.ru, it:f.it})),
    ...(DB.dialoghi||[]).flatMap(d=>d.battute.map(b=>({ru:b.ru, it:b.it}))),
    ...(DB.frasiGrammar||[]).map(f=>({ru:f.ru, it:f.it})),
  ];
  const esatte = [], simili = [];
  tutte.forEach(f=>{
    const ws = paroleFrase(f.ru).map(normSearch);
    if(ws.includes(w)) esatte.push(f);
    else if(radice.length>=3 && ws.some(x=>x.startsWith(radice))) simili.push(f);
  });
  const seen = new Set();
  return [...esatte, ...simili].filter(f=>!seen.has(f.ru) && seen.add(f.ru)).slice(0, 6);
}
function runParolaGiorno(v){
  const stage = header('Parola del giorno', {narrow:true});
  stage.appendChild(makeVocabCard(v.ru, v.it, {translit:v.translit, tipo:v.tipo, tags:v.tag, id:v.id}));

  if(mic) az.appendChild(mic);
  stage.appendChild(az);
  const es = frasiConParola(v.ru);
  if(es.length){
    stage.appendChild($(`<div class="sec-h">Nelle frasi</div>`));
    const list = $(`<div class="list" style="gap:8px"></div>`);
    es.forEach(f=>list.appendChild(fraseRow({id:'x', ru:f.ru, it:f.it}, 'Parola del giorno')));
    // qui il ＋ non serve: le frasi si salvano dal Frasario
    list.querySelectorAll('.mini-btn.add').forEach(b=>b.remove());
    stage.appendChild(list);
  }
  stage.appendChild($(`<p class="muted" style="margin:6px 0 0">Domani ne arriva un'altra. Tocca <b>＋ Esercizi</b> per non perderla di vista.</p>`));
}

// ================= PUNTI E LIVELLI =================
// 10 punti per ogni risposta giusta, 2 per quelle sbagliate (provarci conta),
// più i bonus: ripasso completato, dialogo recitato, lettura, tappe del percorso.
const LIVELLI_XP = [
  [0,'Новичок','Principiante'], [300,'Ученик','Apprendista'], [900,'Студент','Studente'],
  [2000,'Знаток','Conoscitore'], [4000,'Мастер','Maestro'], [7000,'Профессор','Professore'],
  [11000,'Академик','Accademico'], [16000,'Легенда','Leggenda'],
];
function xpTotale(){
  const s = extraStore();
  if(typeof s.xp === 'number') return s.xp;
  // la prima volta si contano le risposte già date
  let xp = 0;
  Object.values(activityLog()).forEach(d=>{ xp += (d.ok||0)*10 + Math.max(0,(d.r||0)-(d.ok||0))*2; });
  updExtra(x=>{ x.xp = xp; });
  return xp;
}
function livelloDi(xp){
  let i = 0;
  while(i+1 < LIVELLI_XP.length && xp >= LIVELLI_XP[i+1][0]) i++;
  const [da, ru, it] = LIVELLI_XP[i];
  const prossimo = LIVELLI_XP[i+1] ? LIVELLI_XP[i+1][0] : null;
  return {n:i+1, ru, it, da, prossimo, frac: prossimo ? (xp-da)/(prossimo-da) : 1};
}
function addXP(n){
  if(!n) return;
  const prima = xpTotale(), dopo = prima + n;
  updExtra(s=>{ s.xp = dopo; });
  // anche nel registro del giorno, per il riepilogo della settimana
  const log = activityLog(), t = todayStr();
  const d = log[t] || {r:0, ok:0};
  d.xp = (d.xp||0) + n; log[t] = d;
  try{ localStorage.setItem(ACTIVITY_KEY, JSON.stringify(log)); }catch(e){}
  const a = livelloDi(prima), b = livelloDi(dopo);
  if(b.n > a.n) setTimeout(()=>{ toast(`🎉 Livello ${b.n}: <b>${b.ru}</b> · ${b.it}`, 'gold'); haptic(true); }, 350);
}

// Ogni risposta sbagliata (in qualsiasi esercizio) finisce qui, con il russo
// giusto e la traduzione: si riallenano tutte insieme negli Esercizi.
const ERRORI_KEY = "russo_errori_v1";
function erroriStore(){ try{ const a = JSON.parse(localStorage.getItem(ERRORI_KEY)||"[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
function saveErrori(a){ try{ localStorage.setItem(ERRORI_KEY, JSON.stringify(a.slice(-150))); }catch(e){} }
function logErrore(ru, it, fonte){
  if(!ru) return;
  const a = erroriStore().filter(x=>x.ru!==ru);
  a.push({ru, it:it||'', fonte:fonte||'', t:Date.now()});
  saveErrori(a);
}
function togliErrore(ru){ const a = erroriStore(); const b = a.filter(x=>x.ru!==ru); if(b.length!==a.length) saveErrori(b); }
// Da un id dell'SRS alla coppia russo/italiano (parole, frasi, frasi salvate)
function voceDaId(id){
  if(!DB) return null;
  const v = (DB.voci||[]).find(x=>x.id===id);
  if(v) return {ru:v.ru, it:v.it, fonte:'Parole'};
  const f = (DB.frasi||[]).find(x=>x.id===id);
  if(f) return {ru:f.ru, it:f.it, fonte:'Frasi'};

// ================= PRONUNCIA: il microfono che ascolta =================
// Pulsante «Pronuncia» riutilizzabile: il telefono ascolta e confronta con il
// russo atteso, parola per parola (riconoscimento vocale del browser, nessuna chiave).
function makeMicBtn(getTarget, label){
  if(!SpeechRec) return null;
  label = label || 'Pronuncia';
  const box = $(`<div class="mic-box"><button class="btn soft sm mic-btn" type="button">${ic('mic')} ${label}</button><div class="mic-res"></div></div>`);
  const btn = box.querySelector('button'), res = box.querySelector('.mic-res');
  let rec = null;
  const reset = ()=>{ btn.classList.remove('rec'); btn.innerHTML = `${ic('mic')} ${label}`; };
  btn.onclick = e=>{
    e.stopPropagation();
    if(rec){ try{ rec.stop(); }catch(_){} return; }
    stopSpeech();
    btn.classList.add('rec'); btn.innerHTML = `${ic('stop')} Ascolto…`;
    res.textContent = '';
    rec = ascoltaRusso((testo, err)=>{
      rec = null; reset();
      if(!testo){
        res.innerHTML = `<span class="mr-no">${err==='not-allowed'||err==='service-not-allowed' ? 'Microfono non consentito.' : 'Non ho sentito: riprova.'}</span>`;
        return;
      }
      const c = confrontaDetto(testo, getTarget());
      const [cls, msg] = c.pct>=80 ? ['ok','Ottima pronuncia!'] : c.pct>=50 ? ['mid','Quasi!'] : ['ko','Riprova'];
      res.innerHTML = `<b class="${cls}">${msg}</b><span class="mr-heard"></span>`;
      res.querySelector('.mr-heard').textContent = ` Ho sentito: «${testo}»`;
      haptic(c.pct>=80);
    }, parz=>{ res.textContent = parz; });
  };
  onLeave(()=>{ if(rec){ try{ rec.abort(); }catch(_){} rec = null; } });
  return box;
}

// ================= IMMAGINE DA CONDIVIDERE =================
// Una card 1080×1350 (parola del giorno, proverbio, record) da mandare su
// WhatsApp & co. Dove il telefono non sa condividere file, si scarica.
function _righe(ctx, testo, maxW){
  const parole = String(testo).split(/\s+/), out = [];
  let r = '';
  parole.forEach(w=>{
    const prova = r ? r + ' ' + w : w;
    if(ctx.measureText(prova).width > maxW && r){ out.push(r); r = w; } else r = prova;
  });
  if(r) out.push(r);
  return out;
}
async function condividiCard(o){
  const W = 1080, H = 1350;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  try{ await Promise.all([document.fonts.load('800 120px Inter'), document.fonts.load('600 44px Inter'), document.fonts.load('italic 500 44px Inter')]); }catch(e){}
  const F = 'Inter, -apple-system, "Segoe UI", Roboto, sans-serif';
  const g = x.createLinearGradient(0, 0, W*.6, H);
  g.addColorStop(0, '#ef5064'); g.addColorStop(.55, '#c72a46'); g.addColorStop(1, '#5c1838');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(255,255,255,.08)';
  x.beginPath(); x.arc(W-120, 150, 330, 0, Math.PI*2); x.fill();
  x.beginPath(); x.arc(110, H-420, 210, 0, Math.PI*2); x.fill();
  // mura del Cremlino in fondo
  x.fillStyle = 'rgba(40,6,20,.42)';
  x.fillRect(0, H-110, W, 110);
  for(let i=-10; i<W; i+=72){
    x.beginPath(); x.moveTo(i+10, H-109); x.lineTo(i+10, H-176); x.lineTo(i+36, H-150); x.lineTo(i+62, H-176); x.lineTo(i+62, H-109); x.closePath(); x.fill();
  }
  x.textAlign = 'center'; x.fillStyle = '#fff';
  x.globalAlpha = .82; x.font = `800 38px ${F}`;
  x.fillText(String(o.kick||'').toUpperCase(), W/2, 250);
  x.globalAlpha = 1;
  // testo grande, rimpicciolito finché sta in al massimo 4 righe
  let size = o.bigSize || 150, righe;
  do { x.font = `800 ${size}px ${F}`; righe = _righe(x, o.big, W-160); size -= 6; } while((righe.length>4 || righe.some(r=>x.measureText(r).width>W-160)) && size>48);
  size += 6;
  const lh = size*1.14, y0 = 560 - (righe.length-1)*lh/2;
  righe.forEach((r,k)=>x.fillText(r, W/2, y0 + k*lh));
  let y = y0 + (righe.length-1)*lh + 110;
  if(o.sub){ x.globalAlpha = .85; x.font = `italic 500 46px ${F}`; _righe(x, o.sub, W-200).forEach(r=>{ x.fillText(r, W/2, y); y += 60; }); x.globalAlpha = 1; y += 20; }
  if(o.it){ x.font = `600 54px ${F}`; _righe(x, o.it, W-200).forEach(r=>{ x.fillText(r, W/2, y); y += 70; }); }
  x.globalAlpha = .9; x.font = `700 36px ${F}`;
  x.fillText('Русский · impara il russo', W/2, H-40);
  x.globalAlpha = 1;
  const blob = await new Promise(r=>c.toBlob(r, 'image/jpeg', .92));
  if(!blob) return;
  const file = new File([blob], o.file || 'russo.jpg', {type:'image/jpeg'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:o.kick||'Русский'}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = file.name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function shareBtn(dati, testo){
  const b = $(`<button class="btn soft sm" type="button">${ic('share')} ${testo||'Condividi'}</button>`);
  b.onclick = async e=>{ e.stopPropagation(); b.disabled = true; try{ await condividiCard(typeof dati==='function' ? dati() : dati); } finally { b.disabled = false; } };
  return b;
}

function glossarioDi(l){
  const m = new Map();
  Object.entries(DB.glossarioLetture||{}).forEach(([k,v])=>m.set(normYo(k.toLowerCase()), v));
  Object.entries(l.glossario||{}).forEach(([k,v])=>m.set(normYo(k.toLowerCase()), v));
  return m;
}
function traduciParola(w, gl){
  const k = normYo(String(w).toLowerCase());
  if(gl.has(k)) return {it: gl.get(k)};
  const v = (DB.voci||[]).find(x=>normYo((x.ru||'').toLowerCase())===k);
  if(v) return {it: v.it, voce: v};
  const vb = verbFormIndex().get(k);
  if(vb) return {it: `forma di «${vb.inf}»${vb.en ? ' — '+vb.en : ''}`, verbo: vb};
  if(/^[А-ЯЁ]/.test(w)) return {it: 'nome proprio (di persona o di luogo)', nome: true};
  return null;
}
function runLettura(l){
  const stage = header(l.titolo, {narrow:true});
  const gl = glossarioDi(l);
  const hero = $(`<div class="dlg-hero"><div class="e">${l.icona||'📖'}</div>
    <div class="tx"><button class="ru" type="button" title="Ascolta"><span></span>${ic('vol')}</button><p></p></div></div>`);
  hero.querySelector('.ru span').textContent = l.titoloRu;
  hero.querySelector('p').textContent = `Livello ${l.livello||1} · tocca le parole per tradurle`;
  hero.querySelector('.ru').onclick = ()=>{ stopPlay(); speak(l.titoloRu); };
  stage.appendChild(hero);

  const bar = $(`<div class="dlg-bar"></div>`);
  const playBtn = $(`<button class="btn blue sm" type="button"></button>`);
  const trBtn = $(`<button class="btn soft sm" type="button"></button>`);
  bar.append(playBtn, trBtn);
  stage.appendChild(bar);

  const testo = $(`<div class="lt-text"></div>`);
  const righe = l.frasi.map((f,k)=>{
    const r = $(`<div class="lt-s"><button class="lt-play" type="button" aria-label="Ascolta la frase">${ic('vol')}</button><div class="lt-body"><div class="lt-ru"></div><div class="lt-it"></div></div></div>`);
    const lente = lensBtn(f.ru, f.it, {glossario:gl, tema:`Lettura: ${l.titolo}`});
    lente.classList.add('lt-lens');
    r.appendChild(lente);
    const ruEl = r.querySelector('.lt-ru');
    // ogni parola è toccabile; la punteggiatura resta testo semplice
    f.ru.split(/(\s+)/).forEach(tok=>{
      if(/^\s+$/.test(tok)){ ruEl.appendChild(document.createTextNode(' ')); return; }
      const m = tok.match(/^([«"(—–-]*)(.*?)([.,!?;:»")…]*)$/);
      const [, pre, core, post] = m || ['', '', tok, ''];
      if(pre) ruEl.appendChild(document.createTextNode(pre));
      if(core && /[а-яё]/i.test(core)){
        const w = $(`<span class="lt-w" role="button" tabindex="0"></span>`);
        w.textContent = core;
        w.onclick = e=>{ e.stopPropagation(); popParola(w, core); };
        ruEl.appendChild(w);
      } else if(core) ruEl.appendChild(document.createTextNode(core));
      if(post) ruEl.appendChild(document.createTextNode(post));
    });
    r.querySelector('.lt-it').textContent = f.it;
    r.querySelector('.lt-play').onclick = ()=>{ stopPlay(); mark(k); speakAs(f.ru, 'A', ()=>mark(-1)); };
    testo.appendChild(r);
    return r;
  });
  stage.appendChild(testo);

  function popParola(el, parola){
    document.querySelectorAll('.vika-pop').forEach(p=>p.remove());
    document.querySelectorAll('.lt-w.on').forEach(p=>p.classList.remove('on'));
    el.classList.add('on');
    const tr = traduciParola(parola, gl);
    const pop = $(`<div class="vika-pop lt-pop"><b></b><div class="vika-it"></div><div class="pop-row"></div></div>`);
    pop.querySelector('b').textContent = parola;
    pop.querySelector('.vika-it').textContent = tr ? tr.it : 'Non è nel glossario: guarda la traduzione della frase.';
    const row = pop.querySelector('.pop-row');
    const sp = $(`<button type="button">🔊 Ascolta</button>`);
    sp.onclick = e=>{ e.stopPropagation(); speak(parola); };
    row.appendChild(sp);
    const sg = $(`<button type="button">🔍 Spiega</button>`);
    sg.onclick = e=>{ e.stopPropagation(); pop.remove(); el.classList.remove('on'); sheetApri('La parola', ()=>pagParola(parola, tr && !tr.nome ? tr.it : '', {glossario:gl})); };
    row.appendChild(sg);
    if(tr && !tr.nome){
      const id = tr.voce ? tr.voce.id : 'lt_' + normYo(parola.toLowerCase());
      const gia = isEsesVoce(id);
      const add = $(`<button type="button"></button>`);
      add.textContent = gia ? '✓ Salvata' : '＋ Esercizi';
      add.disabled = gia;
      add.onclick = e=>{
        e.stopPropagation();
        const v = tr.voce;
        addEsesVoce(id, v ? v.ru : parola.toLowerCase(), v ? v.it : tr.it, v ? v.translit : '', v ? v.tipo : (tr.verbo ? 'verbo' : ''), v ? v.tag : ['letture']);
        add.textContent = '✓ Salvata'; add.disabled = true; haptic(true);
      };
      row.appendChild(add);
    }
    document.body.appendChild(pop);
    const rc = el.getBoundingClientRect();
    const pw = Math.min(300, window.innerWidth - 24);
    pop.style.maxWidth = pw + 'px';
    const left = Math.max(12, Math.min(window.innerWidth - pw - 12, rc.left + window.scrollX + rc.width/2 - pw/2));
    pop.style.left = left + 'px';
    pop.style.top = (rc.bottom + window.scrollY + 8) + 'px';
    speak(parola);
    const chiudi = ev=>{ if(!pop.contains(ev.target) && ev.target!==el){ pop.remove(); el.classList.remove('on'); document.removeEventListener('pointerdown', chiudi, true); } };
    setTimeout(()=>document.addEventListener('pointerdown', chiudi, true), 0);
    onLeave(()=>document.removeEventListener('pointerdown', chiudi, true));
  }

  let showIt = !!settings().ltIt;
  function paintTr(){ testo.classList.toggle('show-it', showIt); trBtn.innerHTML = `${ic('eye')} ${showIt ? 'Nascondi traduzione' : 'Mostra traduzione'}`; }
  trBtn.onclick = ()=>{ showIt = !showIt; setSetting('ltIt', showIt); paintTr(); };
  paintTr();

  let tok = 0, playing = false;
  function mark(k){ righe.forEach((r,i)=>r.classList.toggle('playing', i===k)); }
  function paintPlay(){ playBtn.innerHTML = playing ? `${ic('stop')} Ferma` : `${ic('play')} Ascolta tutto`; }
  function stopPlay(){ tok++; playing = false; mark(-1); paintPlay(); }
  playBtn.onclick = ()=>{
    if(playing){ stopPlay(); stopSpeech(); return; }
    const my = ++tok; playing = true; paintPlay();
    let k = 0;
    const step = ()=>{
      if(my!==tok) return;
      if(k>=l.frasi.length){ stopPlay(); return; }
      mark(k); righe[k].scrollIntoView({block:'nearest', behavior:'smooth'});
      speakAs(l.frasi[k].ru, 'A', ()=>{ if(my!==tok) return; k++; setTimeout(step, 450); });
    };
    step();
  };
  paintPlay();
  onLeave(()=>{ tok++; stopSpeech(); });

  // glossario completo, chiuso
  const voci = Object.entries(l.glossario||{});
  if(voci.length){
    const det = $(`<details class="pcard lt-gloss"><summary>${ic('book')} Glossario <span class="pill">${voci.length}</span></summary><div class="kw-list"></div></details>`);
    voci.forEach(([ru, it])=>det.querySelector('.kw-list').appendChild(kwRow(ru, it, {glossario:gl, tag:['letture']})));
    stage.appendChild(det);
  }

  const q = $(`<button class="btn primary block" type="button">${ic('quiz')} Domande di comprensione (${l.domande.length})</button>`);
  q.onclick = ()=>{ stopPlay(); stopSpeech(); navigateTo(()=>runLetturaQuiz(l)); };
  stage.appendChild(q);
}
function runLetturaQuiz(l){
  const qs = l.domande.map(d=>({q:d.q, sub:d.it, correct:d.ok, opts:shuffle([d.ok, ...d.opts]), speak:d.q, frase:{ru:d.q, it:d.it},
                                err:{ru:`${d.q} — ${d.ok}`, it:d.it, fonte:'Letture'}}));
  runMCQ(shuffle(qs), `Domande · ${l.titolo}`, ()=>runLetturaQuiz(l), {
    onAnswer:(Q, ok)=>recordActivity(ok),
    onEnd:(giuste, tot)=>{
      if(giuste/tot >= .6){
        const prima = !!letteStato()[l.id];
        updExtra(s=>{ s.letture = s.letture || {}; s.letture[l.id] = true; });
        if(!prima) addXP(40);
      }
    }
  });
}

function runQuizTrappola(){
  const falsi = DB.falsiAmici || [], gem = DB.paroleGemelle || [];
  const breve = s => String(s).replace(/\s*\(.*\)\s*$/, '');
  const qs = [...sample(falsi, 6).map(f=>({ru:f.ru, ok:breve(f.it), trappola:f.sembra})), ...sample(gem, 4).map(g=>({ru:g.ru, ok:breve(g.it)}))]
    .map(x=>{
      const altri = sample([...falsi.map(f=>breve(f.it)), ...gem.map(g=>breve(g.it))].filter(t=>t!==x.ok && t!==x.trappola), x.trappola ? 2 : 3);
      const opts = shuffle([x.ok, ...(x.trappola ? [x.trappola] : []), ...altri]);
      return {q:x.ru, sub:'Cosa vuol dire?', correct:x.ok, opts, speak:x.ru,
              after: x.trappola ? `Falso amico: sembra «${x.trappola}», ma non lo è!` : 'Parola gemella: si capisce al volo.',
              err:{ru:x.ru, it:x.ok, fonte:'Parole trappola'}};
    });
  runMCQ(shuffle(qs), 'Amico o nemico?', runQuizTrappola, {onAnswer:(Q, ok)=>recordActivity(ok)});
}

// ================= SFIDA LAMPO =================
// 60 secondi: quante parole riesci a tradurre? Il record resta sul telefono.
function runLampo(){
  const stage = header('Sfida lampo', {narrow:true});
  const rec = extraStore().lampo || 0;
  const pool = (DB.voci||[]).filter(v=>v.ru && v.it && !/\s/.test(v.ru.trim()) && (v.difficolta||1)<=2 && v.it.length<=26);
  const start = $(`<div class="done lampo-start"><div class="big">⚡</div><h2>60 secondi</h2>
    <p class="muted" style="margin:0">Leggi la parola russa e tocca la traduzione giusta, il più in fretta possibile.<br>${rec ? `Il tuo record: <b>${rec}</b> parole.` : 'Ancora nessun record: fissalo tu!'}</p></div>`);
  const via = $(`<button class="btn primary block" type="button">${ic('play')} Via!</button>`);
  stage.append(start, via);
  via.onclick = ()=>gioca();
  function gioca(){
    stage.innerHTML = '';
    const top = $(`<div class="lampo-top"><div class="lampo-time"><i></i></div><div class="lampo-score"><b>0</b> parole</div></div>`);
    const wrap = $(`<div class="list" style="gap:12px"></div>`);
    stage.append(top, wrap);
    const fill = top.querySelector('.lampo-time i'), scoreEl = top.querySelector('.lampo-score b');
    const DURATA = 60000, t0 = Date.now();
    let punti = 0, sbagli = 0, fine = false, timer = null, onKey = null;
    const usate = new Set(), viste = [];
    const stopKeys = ()=>{ if(onKey) document.removeEventListener('keydown', onKey); onKey = null; };
    const tick = ()=>{
      const rest = Math.max(0, DURATA - (Date.now()-t0));
      fill.style.width = (rest/DURATA*100) + '%';
      fill.classList.toggle('poco', rest < 10000);
      if(rest<=0) return termina();
      timer = requestAnimationFrame(tick);
    };
    onLeave(()=>{ fine = true; cancelAnimationFrame(timer); stopKeys(); });
    function domanda(){
      if(fine) return;
      let v, g = 0;
      do { v = pool[Math.floor(Math.random()*pool.length)]; } while(usate.has(v.id) && g++<30);
      usate.add(v.id);
      const altri = [];
      while(altri.length<3){ const x = pool[Math.floor(Math.random()*pool.length)]; if(x.it!==v.it && !altri.includes(x.it)) altri.push(x.it); }
      const opts = shuffle([v.it, ...altri]);
      wrap.innerHTML = '';
      const card = $(`<div class="qcard lampo-q"><div class="q"></div></div>`);
      card.querySelector('.q').textContent = v.ru;
      card.querySelector('.q').style.fontSize = fitSize(v.ru, 38, 24) + 'px';
      const box = $(`<div class="options lampo-opts"></div>`);
      let risposto = false;
      opts.forEach((o,k)=>{
        const b = $(`<button class="opt" type="button"><span class="kn">${k+1}</span></button>`);
        b.appendChild(document.createTextNode(o));
        b.onclick = ()=>{
          if(risposto || fine) return;
          risposto = true;
          const ok = o===v.it;
          b.classList.add(ok ? 'correct' : 'wrong');
          viste.push(Object.assign({sbagliata:!ok}, v));
          haptic(ok); recordActivity(ok);
          if(ok){ punti++; scoreEl.textContent = punti; setTimeout(domanda, 160); }
          else {
            sbagli++; logErrore(v.ru, v.it, 'Sfida lampo');
            [...box.children].find(c=>c.lastChild.textContent===v.it).classList.add('correct');
            setTimeout(domanda, 650);
          }
        };
        box.appendChild(b);
      });
      wrap.append(card, box);
    }
    onKey = e=>{ const k = parseInt(e.key,10); const box = wrap.querySelector('.options'); if(box && k>=1 && k<=4) box.children[k-1].click(); };
    document.addEventListener('keydown', onKey);
    function termina(){
      if(fine) return;
      fine = true; stopKeys();
      const prima = extraStore().lampo || 0;
      const record = punti > prima;
      if(record){ updExtra(s=>{ s.lampo = punti; }); addXP(20); }
      finish(stage, record ? `${punti} parole` : `${punti} parole`, runLampo, {
        titolo: record ? `Nuovo record: ${punti}! ⚡` : `${punti} ${punti===1?'parola':'parole'} in 60 secondi`,
        testo: `${sbagli ? `${plur(sbagli,'errore','errori')}, finiti tra gli errori da ripassare. ` : 'Nessun errore! '}${record ? '' : `Record: ${prima}.`}`
      });
      if(record) confetti(stage.querySelector('.done'));
      if(punti) stage.appendChild(shareBtn({kick:'Sfida lampo', big:`${punti} parole`, sub:'in 60 secondi', it:'Riesci a battermi?', bigSize:170, file:'sfida-lampo.jpg'}, 'Condividi il risultato'));
      if(viste.length) stage.appendChild(listaParole('Le parole della sfida', viste.slice().sort((a,b)=>b.sbagliata-a.sbagliata)));
    }
    domanda();
    timer = requestAnimationFrame(tick);
  }
}

// ================= DETTATO DI FRASI =================
// Si sente una frase intera e la si scrive: ascolto + ortografia insieme.
function runDettatoFrasi(){
  const pool = (DB.frasi||[]).filter(f=>{ const n = paroleFrase(f.ru).length; return n>=2 && n<=7; });
  const deck = shuffle(pool.slice()).sort((a,b)=>(isDue(b.id)?1:0)-(isDue(a.id)?1:0)).slice(0, 8);
  const stage = header('Dettato di frasi', {narrow:true});
  const bar = progressBar(stage);
  const wrap = $(`<div class="list" style="gap:12px"></div>`); stage.appendChild(wrap);
  let i = 0, correct = 0, onKey = null;
  const stopKeys = ()=>{ if(onKey) document.removeEventListener('keydown', onKey); onKey = null; };
  onLeave(()=>{ stopKeys(); stopSpeech(); });
  function show(){
    if(i>=deck.length){ stopKeys(); return finish(stage, `${correct} / ${deck.length}`, runDettatoFrasi); }
    bar.style.width = (i/deck.length*100)+'%'; bar.setNum(i, deck.length);
    const f = deck[i], sol = f.ru, solW = paroleFrase(sol);
    wrap.innerHTML = '';
    const card = $(`<div class="qcard"><div class="kick">Scrivi quello che senti</div>
      <div class="row" style="justify-content:center;gap:10px"><button class="big-play" type="button" aria-label="Ascolta">${ic('vol')}</button>
      <button class="slow-play" type="button" aria-label="Ascolta piano">🐢</button></div>
      <div class="qsub">${plur(solW.length,'parola','parole')} · tocca per riascoltare</div></div>`);
    const dire = rate=>{
      if(!('speechSynthesis' in window)) return;
      _ttsGen++; speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(sol); u.lang = 'ru-RU'; if(ruVoice) u.voice = ruVoice; u.rate = rate; speechSynthesis.speak(u);
    };
    card.querySelector('.big-play').onclick = ()=>dire(settings().ttsRate);
    card.querySelector('.slow-play').onclick = ()=>dire(0.55);
    wrap.appendChild(card);
    const inp = $(`<input class="vocab-input plain dt-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Scrivi in cirillico…">`);
    const chk = $(`<button class="btn primary block" type="button">${ic('check')} Verifica</button>`);
    const res = $(`<div class="dt-res" style="display:none"></div>`);
    wrap.append(inp, res, chk);
    let answered = false;
    const useKbd = settings().kbd;
    let kbd = null;
    if(useKbd){ inp.readOnly = true; inp.inputMode = 'none'; kbd = makeCyrKeyboard(inp, ()=>{}, ()=>answered); wrap.appendChild(kbd); }
    chk.onclick = ()=>{
      if(answered){ i++; return show(); }
      if(!inp.value.trim()){ if(!useKbd) inp.focus(); return; }
      answered = true;
      const scritte = normWrite(inp.value).split(' ').filter(Boolean);
      const giuste = solW.map(w=>normWrite(w));
      const ok = scritte.join(' ') === giuste.join(' ');
      if(ok) correct++;
      haptic(ok); grade(f.id, ok);
      if(!ok) logErrore(f.ru, f.it, 'Dettato di frasi');
      // parola per parola: verde se giusta nella stessa posizione
      res.innerHTML = `<div class="dt-cmp">${solW.map((w,k)=>`<span class="${scritte[k]===giuste[k]?'ok':'no'}">${esc(w)}</span>`).join(' ')}</div>
        <div class="dt-it"></div>${f.translit?'<div class="dt-tr"></div>':''}`;
      res.querySelector('.dt-it').textContent = f.it;
      if(f.translit) res.querySelector('.dt-tr').textContent = f.translit;
      res.style.display = '';
      res.appendChild(azioniTesto(f.ru, f.it, {translit:f.translit}));
      inp.classList.add(ok ? 'ok' : 'ko');
      if(kbd) kbd.style.display = 'none';
      chk.innerHTML = `${ok ? '✓ Giusto! ' : ''}${i+1<deck.length ? 'Continua' : 'Risultato'} →`;
      dire(settings().ttsRate);
    };
    stopKeys();
    onKey = e=>{ if(e.key==='Enter'){ e.preventDefault(); chk.click(); } };
    document.addEventListener('keydown', onKey);
    setTimeout(()=>dire(settings().ttsRate), 300);
    if(!useKbd) setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} }, 80);
  }
  if(!deck.length) return emptyDone(stage, '🎧', 'Nessuna frase', 'Non ci sono frasi adatte al dettato.');
  show();
}

function runErrori(){
  let deck = shuffle(erroriStore().slice());
  const tot = deck.length;
  const stage = header('Ripasso degli errori', {narrow:true});
  if(!tot) return emptyDone(stage, '🎯', 'Nessun errore da rivedere', 'Quando sbagli una risposta, la ritrovi qui.');
  const bar = progressBar(stage);
  const wrap = $(`<div class="list" style="gap:12px"></div>`); stage.appendChild(wrap);
  let fatti = 0, sbagli = 0, onKey = null;
  const stopKeys = ()=>{ if(onKey) document.removeEventListener('keydown', onKey); onKey = null; };
  onLeave(stopKeys);
  function show(){
    if(!deck.length){ stopKeys(); return finish(stage, `${fatti} / ${fatti+sbagli}`, runErrori, {titolo:'Errori ripassati!', testo:`${plur(fatti,'errore sistemato','errori sistemati')}.`}); }
    bar.style.width = (fatti/tot*100)+'%'; bar.setNum(fatti, tot);
    const e = deck[0];
    wrap.innerHTML = '';
    const card = $(`<div class="qcard"><div class="kick"></div><div class="big-it"></div><div class="er-ru" style="display:none"></div></div>`);
    card.querySelector('.kick').textContent = e.fonte || 'Errore';
    card.querySelector('.big-it').textContent = e.it || '—';
    card.querySelector('.big-it').style.fontSize = Math.max(19, 27 - Math.max(0, (e.it||'').length-24)*0.3) + 'px';
    card.querySelector('.er-ru').textContent = e.ru;
    const rev = $(`<button class="btn block" type="button">${ic('eye')} Mostra il russo</button>`);
    const grade2 = $(`<div class="grade-row hidden"><button class="btn bad" type="button">${ic('x')} Ancora</button><button class="btn good" type="button">${ic('check')} La so</button></div>`);
    const acts = azioniTesto(e.ru, e.it);
    acts.classList.add('hidden');
    wrap.append(card, rev, grade2, acts);
    let aperta = false;
    const apri = ()=>{ if(aperta) return; aperta = true; card.querySelector('.er-ru').style.display = ''; rev.classList.add('hidden'); grade2.classList.remove('hidden'); acts.classList.remove('hidden'); speak(onlyCyrillic(e.ru)); };
    const vota = ok=>{
      if(!aperta) return;
      aperta = false;
      haptic(ok); recordActivity(ok);
      deck.shift();
      if(ok){ fatti++; togliErrore(e.ru); } else { sbagli++; deck.push(e); }
      show();
    };
    rev.onclick = apri; card.onclick = apri;
    grade2.children[0].onclick = ()=>vota(false);
    grade2.children[1].onclick = ()=>vota(true);
    stopKeys();
    onKey = ev=>{ if(ev.key===' '||ev.key==='Enter'){ ev.preventDefault(); apri(); } else if(ev.key==='1') vota(false); else if(ev.key==='2') vota(true); };
    document.addEventListener('keydown', onKey);
  }
  show();
}

// ================= PERCORSO A1 =================
// Tappe in fila: ogni tappa è fatta di passi che rimandano agli esercizi
// dell'app. Finita una tappa si sblocca la successiva.
let _passoAttivo = null;       // {tappa, i, soglia, depth}: il passo in corso
function percorsoStato(){ return extraStore().percorso || {}; }
function passiFatti(t){ return new Set(percorsoStato()[t.id] || []); }
function tappaCompleta(t){ const f = passiFatti(t); return t.passi.every((p,i)=>f.has(i)); }
function tappaSbloccata(k){ const P = DB.percorso || []; return k===0 || (P[k-1] && tappaCompleta(P[k-1])); }
function tappaCorrente(){ const P = DB.percorso || []; const k = P.findIndex(t=>!tappaCompleta(t)); return k<0 ? P.length : k; }
function segnaPasso(t, i){
  let nuovo = false;
  updExtra(s=>{ s.percorso = s.percorso || {}; const a = s.percorso[t.id] || []; if(!a.includes(i)){ a.push(i); nuovo = true; } s.percorso[t.id] = a; });
  return nuovo;
}
const PASSO_TIPI = {
  cyr:['🔤','Quiz'], flash:['🃏','Flashcard'], frasi:['🎧','Frasi & ascolto'], componi:['🧩','Componi'], recita:['🎭','Dialogo'],
  dlgquiz:['💡','Cosa rispondi?'], lettura:['📖','Lettura'], numLeggi:['🔢','Numeri'], numDettato:['🎧','Dettato di numeri'],
  ore:['🕒','Che ore sono?'], prezzi:['💸','Prezzi'], casi:['🧠','Casi'], moto:['🚶','Verbi di moto'],
};
function lanciaPasso(p){
  const frasiTag = tags => (DB.frasi||[]).filter(f=>(f.tag||[]).some(t=>tags.includes(t)));
  switch(p.t){
    case 'cyr': return runCyrQuiz();
    case 'flash': {
      const pool = (DB.voci||[]).filter(v=>(v.tag||[]).some(t=>(p.tags||[]).includes(t)));
      return runFlash(pool, p.titolo, {ignoreDue:true, limit:p.n||12, restart:()=>lanciaPasso(p)});
    }
    case 'frasi': return runPhrase(0, {pool:sample(frasiTag(p.tags||[]), 8), titolo:p.titolo});
    case 'componi': return runComponi(null, {pool:frasiTag(p.tags||[]).map(f=>({id:f.id, ru:f.ru, it:f.it, translit:f.translit||''})), titolo:p.titolo});
    case 'recita': { const d = (DB.dialoghi||[]).find(x=>x.id===p.id); return d ? runRecita(d, dlgMio(d)) : runPercorso(); }
    case 'dlgquiz': { const d = (DB.dialoghi||[]).find(x=>x.id===p.id); return d ? runDlgQuiz(d) : runPercorso(); }
    case 'lettura': { const l = (DB.letture||[]).find(x=>x.id===p.id); return l ? runLettura(l) : runPercorso(); }
    case 'numLeggi': return runNumLeggi(p.range);
    case 'numDettato': return runNumDettato(p.range);
    case 'ore': return runOre();
    case 'prezzi': return runPrezzi();
    case 'casi': return runCasi(p.caso || null);
    case 'moto': return runMotoQuiz();
  }
  return runPercorso();
}
function avviaPasso(t, i){
  const p = t.passi[i];
  const soglia = ['flash','recita'].includes(p.t) ? 0 : 60;
  navigateTo(()=>{
    _passoAttivo = {tappa:t, i, soglia, depth:_navStack.length};
    lanciaPasso(p);
  });
}
// Chiamata dalla schermata di fine: se c'era un passo del percorso in corso
// (anche da una schermata più in fondo, come le domande di una lettura), lo segna.
function passoCompletato(pct){
  const pa = _passoAttivo;
  if(!pa || _navStack.length < pa.depth) return null;
  if(pct!==null && pct < pa.soglia) return {pa, fallito:true};
  const eraFinita = tappaCompleta(pa.tappa);
  const nuovo = segnaPasso(pa.tappa, pa.i);
  const finita = tappaCompleta(pa.tappa);
  if(nuovo){ addXP(30); if(finita && !eraFinita) addXP(100); }
  return {pa, nuovo, tappaFinita: finita && !eraFinita};
}
function passoBox(r){
  const p = r.pa.tappa.passi[r.pa.i];
  const indietro = ()=>history.go(-(_navStack.length - r.pa.depth + 1));
  if(r.fallito){
    const b = $(`<div class="pcard passo-box ko"><b>🗺️ Percorso</b><p>Per completare «${esc(p.titolo)}» serve almeno il ${r.pa.soglia}% di risposte giuste. Riprova con «Ancora»!</p></div>`);
    return b;
  }
  const P = DB.percorso || [];
  const k = P.indexOf(r.pa.tappa);
  const b = $(`<div class="pcard passo-box ok"><b></b><p></p><button class="btn blue block" type="button">${ic('map')} Torna al percorso</button></div>`);
  b.querySelector('b').textContent = r.tappaFinita ? `🎉 Tappa «${r.pa.tappa.titolo}» completata!` : `✓ Passo completato: ${p.titolo}`;
  b.querySelector('p').textContent = r.tappaFinita
    ? (P[k+1] ? `Si sblocca la tappa ${k+2}: ${P[k+1].icona} ${P[k+1].titolo}. +100 punti` : 'Hai finito tutto il Percorso A1. Molodéc!')
    : `${r.nuovo ? '+30 punti · ' : ''}${passiFatti(r.pa.tappa).size} di ${r.pa.tappa.passi.length} passi fatti in questa tappa.`;
  b.querySelector('button').onclick = indietro;
  return b;
}
function runPercorso(){
  _passoAttivo = null;
  const stage = header('Percorso A1');
  const P = DB.percorso || [];
  const cur = tappaCorrente();
  const tot = P.reduce((n,t)=>n+t.passi.length, 0), fatti = P.reduce((n,t)=>n+passiFatti(t).size, 0);
  stage.appendChild($(`<p class="sg-intro">${P.length} tappe, dall'alfabeto alle feste. Ogni tappa mescola parole, frasi, dialoghi e letture: finita una, si apre la successiva.</p>`));
  stage.appendChild($(`<div class="pcard dlg-prog"><div><b>${fatti} / ${tot}</b> <span>passi completati</span></div><div class="pbar"><i style="width:${tot?fatti/tot*100:0}%;background:var(--grad-prog)"></i></div></div>`));
  const path = $(`<div class="path"></div>`);
  P.forEach((t,k)=>{
    const f = passiFatti(t).size, n = t.passi.length;
    const stato = tappaCompleta(t) ? 'done' : tappaSbloccata(k) ? (k===cur ? 'cur' : 'open') : 'lock';
    const node = $(`<button class="pnode p-${stato}" type="button"><div class="pn-dot">${stato==='done' ? ic('check') : stato==='lock' ? ic('lock') : t.icona}</div>
      <div class="pn-txt"><div class="pn-k">Tappa ${k+1}${stato==='cur'?' · <b>adesso</b>':''}</div><div class="pn-t"></div><div class="pn-d"></div>
      <div class="pn-bar"><i style="width:${f/n*100}%"></i></div></div></button>`);
    node.querySelector('.pn-t').textContent = `${t.icona} ${t.titolo}`;
    node.querySelector('.pn-d').textContent = `${t.desc} · ${f}/${n}`;
    node.onclick = ()=>{
      if(stato==='lock'){ haptic(false); toast(`🔒 Prima completa la tappa ${k}: ${P[k-1].titolo}`); return; }
      navigateTo(()=>runTappa(t));
    };
    path.appendChild(node);
  });
  stage.appendChild(path);
  requestAnimationFrame(()=>{ const c = path.querySelector('.pnode.p-cur'); if(c && cur>2) c.scrollIntoView({block:'center'}); });
}
function runTappa(t){
  _passoAttivo = null;
  const P = DB.percorso || [];
  const k = P.indexOf(t);
  const stage = header(`Tappa ${k+1} · ${t.titolo}`);
  const f = passiFatti(t);
  stage.appendChild($(`<div class="pill-hero"><div class="e">${t.icona}</div><h2></h2><p class="muted" style="margin:0"></p></div>`));
  stage.querySelector('.pill-hero h2').textContent = t.titolo;
  stage.querySelector('.pill-hero p').textContent = `${t.desc} · ${f.size} di ${t.passi.length} passi`;
  const list = $(`<div class="list"></div>`);
  let prossimo = t.passi.findIndex((p,i)=>!f.has(i));
  t.passi.forEach((p,i)=>{
    const [e, tipo] = PASSO_TIPI[p.t] || ['•', ''];
    const done = f.has(i);
    const b = $(`<button class="tile wide passo${done?' p-fatto':''}${i===prossimo?' p-next':''}" type="button"><div class="ico">${done ? '✅' : e}</div>
      <div class="txt"><div class="t"></div><div class="d"></div></div></button>`);
    b.querySelector('.t').textContent = p.titolo;
    b.querySelector('.d').textContent = done ? `${tipo} · fatto ✓ (puoi rifarlo)` : `${tipo}${['flash','recita'].includes(p.t) ? '' : ' · serve il 60%'}`;
    b.onclick = ()=>avviaPasso(t, i);
    list.appendChild(b);
  });
  stage.appendChild(list);
  if(tappaCompleta(t)){
    stage.appendChild($(`<div class="nota-box">🎉<div>Tappa completata! ${P[k+1] ? `Ora si passa a <b>${esc(P[k+1].titolo)}</b>.` : 'Hai finito tutto il percorso.'}</div></div>`));
    if(P[k+1]){ const nx = $(`<button class="btn primary block" type="button">Vai alla tappa ${k+2}: ${esc(P[k+1].titolo)} ›</button>`); nx.onclick = ()=>runTappa(P[k+1]); stage.appendChild(nx); }
  } else if(prossimo>=0){
    const go = $(`<button class="btn primary block" type="button">${ic('play')} Continua: ${esc(t.passi[prossimo].titolo)}</button>`);
    go.onclick = ()=>avviaPasso(t, prossimo);
    stage.appendChild(go);
  }
}

// ================= PROMEMORIA NEL CALENDARIO =================
// Le notifiche vere richiederebbero un server: un evento ricorrente nel
// calendario del telefono fa lo stesso lavoro.
function scaricaPromemoria(ora){
  const [hh, mm] = (ora || '19:00').split(':').map(n=>parseInt(n,10)||0);
  const d = new Date(); d.setHours(hh, mm, 0, 0);
  if(d < new Date()) d.setDate(d.getDate()+1);
  const p2 = n=>String(n).padStart(2,'0');
  const dt = x=>`${x.getFullYear()}${p2(x.getMonth()+1)}${p2(x.getDate())}T${p2(x.getHours())}${p2(x.getMinutes())}00`;
  const now = new Date();
  const stamp = `${now.getUTCFullYear()}${p2(now.getUTCMonth()+1)}${p2(now.getUTCDate())}T${p2(now.getUTCHours())}${p2(now.getUTCMinutes())}00Z`;
  const url = location.origin + location.pathname.replace(/index\.html$/, '');
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Russo//Promemoria//IT','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:promemoria-russo-'+Date.now()+'@russo','DTSTAMP:'+stamp,'DTSTART:'+dt(d),'DURATION:PT10M','RRULE:FREQ=DAILY',
    'SUMMARY:🇷🇺 Russo: 10 minuti','DESCRIPTION:Ripasso del giorno. Apri l\'app: '+url,'URL:'+url,
    'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Russo: 10 minuti di ripasso','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob = new Blob([ics], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'promemoria-russo.ics';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

// ================= PROGRESSI: livello e settimana =================
function statsSettimana(offset){
  const log = activityLog();
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const lun = new Date(oggi); lun.setDate(oggi.getDate() - ((oggi.getDay()+6)%7) - 7*offset);
  let r = 0, ok = 0, xp = 0, giorni = 0;
  for(let g=0; g<7; g++){
    const d = new Date(lun); d.setDate(lun.getDate()+g);
    if(d > oggi) break;
    const x = log[dateStr(d)];
    if(x && x.r){ giorni++; r += x.r; ok += x.ok||0; }
    if(x) xp += x.xp || (x.ok||0)*10 + Math.max(0,(x.r||0)-(x.ok||0))*2;
  }
  return {r, ok, xp, giorni};
}

let _formeIdx = null;
function _addForma(m, forma, an){
  const k = normW(forma);
  if(!k || /\s/.test(k)) return;
  const arr = m.get(k) || [];
  // stessa parola, stessa categoria: le note si uniscono (es. «genitivo / accusativo»)
  const gemello = arr.find(x=>x.lemma===an.lemma && x.cat===an.cat);
  if(gemello){ if(an.nota && !gemello.note.includes(an.nota)) gemello.note.push(an.nota); }
  else { const x = Object.assign({}, an, {note: an.nota ? [an.nota] : []}); delete x.nota; arr.push(x); }
  m.set(k, arr);
}
function indiceForme(){
  if(_formeIdx) return _formeIdx;
  const m = new Map();
  Object.entries(PAROLE_FUNZIONE).forEach(([w, [it, nota]])=>_addForma(m, w, {lemma:w, it, cat:'funz', nota}));
  Object.entries(NUMERALI).forEach(([lemma, [it, forme]])=>Object.entries(forme).forEach(([f, nota])=>_addForma(m, f, {lemma, it, cat:'num', nota:`numerale, ${nota}`})));
  Object.entries(PREP_INFO).forEach(([p, info])=>{
    if(!/\s/.test(p)) _addForma(m, p, {lemma:p, it:PREP_IT[p]||'', cat:'prep', nota:`preposizione: regge il ${info.caso}`});
  });
  Object.entries(PRONOUN_DECL).forEach(([lemma, forms])=>{
    Object.entries(forms).forEach(([c, f])=>{ if(f && f!=='—') _addForma(m, f, {lemma, it:PRON_IT[lemma]||'', cat:'pron', nota:CASO_IT[c]}); });
  });
  Object.entries(ADJLIKE_PRON).forEach(([lemma, g])=>{
    ['m','f','n','pl'].forEach(gg=>Object.entries(g[gg]).forEach(([c, f])=>{
      _addForma(m, f, {lemma, it:ADJPRON_IT[lemma]||'', cat:'apron', nota:`${GEN_IT[gg]}, ${CASO_IT[c.replace(/_.*/,'')]}`});
    }));
  });
  (DB.verbi||[]).forEach(v=>{
    const base = {lemma:v.inf, it:v.en||'', cat:'verbo', verbo:v};
    _addForma(m, v.inf, Object.assign({}, base, {nota:'infinito'}));
    const cj = v.coniugazioni || {};
    (cj.pres||[]).forEach((f,i)=>_addForma(m, f, Object.assign({}, base, {nota:`presente, ${PERS_IT[i]}`})));
    (cj.fut||[]).forEach((f,i)=>_addForma(m, f, Object.assign({}, base, {nota:`futuro, ${PERS_IT[i]}`})));
    (cj.past||[]).forEach((f,i)=>_addForma(m, f, Object.assign({}, base, {nota:`passato, ${PAST_IT[i]}`})));
    (cj.imp||[]).forEach((f,i)=>_addForma(m, f, Object.assign({}, base, {nota:`imperativo (${i ? 'вы' : 'ты'})`})));
  });
  (DB.voci||[]).forEach(v=>{
    const ru = (v.ru||'').trim();
    if(!ru || /\s/.test(ru)) return;
    const tipo = (v.tipo||'').toLowerCase();
    if(/sostantiv/.test(tipo)){
      const d = declineNoun(ru, v.tipo, v.tag);
      if(d){
        const gen = GENDER_INFO[d.gender] ? GENDER_INFO[d.gender][1] : '';
        ['sg','pl'].forEach(n=>Object.entries(d[n]||{}).forEach(([c, f])=>{
          if(f && f!=='—') _addForma(m, f, {lemma:ru, it:v.it, cat:'nome', voce:v, gen, nota:`${CASO_IT[c]} ${n==='sg' ? 'singolare' : 'plurale'}`});
        }));
        return;
      }
    }
    // aggettivi (anche quelli registrati come «vocabolo»: красивый, большой…)
    if(tipo==='aggettivo' || (!/verbo|sostantiv|numero/.test(tipo) && /(ый|ий|ой)$/.test(ru.toLowerCase()) && ru.length>4 && !ADJLIKE_PRON[ru.toLowerCase()])){
      const d = declineAdj(ru);
      if(d){
        ['m','f','n','pl'].forEach(gg=>Object.entries(d[gg]||{}).forEach(([c, f])=>{
          if(f) _addForma(m, f, {lemma:ru, it:v.it, cat:'agg', voce:v, nota:`${GEN_IT[gg]}, ${CASO_IT[c.replace(/_.*/,'')]}`});
        }));
        return;
      }
    }
    _addForma(m, ru, {lemma:ru, it:v.it, cat:'voce', voce:v, nota:''});
  });
  // parole frequenti dei racconti (congiunzioni, avverbi…) per ciò che manca
  Object.entries(DB.glossarioLetture||{}).forEach(([k, it])=>{ if(!m.has(normW(k))) _addForma(m, k, {lemma:k, it, cat:'gloss', nota:''}); });
  _formeIdx = m;
  return m;
}
const CAT_ORD = {funz:0, prep:0, num:1, pron:1, apron:1, verbo:2, nome:2, agg:2, voce:3, gloss:4};
const CAT_NOME = {prep:'preposizione', pron:'pronome', apron:'pronome', verbo:'verbo', agg:'aggettivo', gloss:'', voce:''};
// Analisi di una parola nel suo contesto (la parola prima decide il caso,
// per esempio dopo «в» o dopo un numero)
function analizzaParola(tok, prev, gloss){
  const k = normW(tok);
  let an = (indiceForme().get(k) || []).map(a=>Object.assign({}, a, {note:a.note.slice()}));
  // la stessa parola già spiegata con la grammatica non si ripete come voce semplice
  const gramm = an.filter(a=>!['voce','gloss'].includes(a.cat));
  if(gramm.length) an = gramm.concat(an.filter(a=>['voce','gloss'].includes(a.cat) && !gramm.some(b=>normW(b.lemma)===normW(a.lemma) || normW(b.lemma)===k)));
  an.sort((a,b)=>(CAT_ORD[a.cat]??5) - (CAT_ORD[b.cat]??5) || (normW(b.lemma)===k) - (normW(a.lemma)===k));
  let perche = '';
  const pk = prev ? normW(prev) : '';
  const regola = PREP_INFO[pk] ? PREP_INFO[pk].caso.split(/\s*\/\s*/) : DOPO_234.has(pk) ? ['genitivo singolare'] : DOPO_5.has(pk) ? ['genitivo plurale'] : null;
  if(regola && an.length){
    an.forEach(a=>{ const n = a.note.filter(x=>regola.some(r=>x.startsWith(r) || x.includes(', '+r))); a.match = n.length ? n : null; });
    const ok = an.filter(a=>a.match);
    if(ok.length){ ok.forEach(a=>a.note = a.match); an = ok; perche = `dopo «${prev}»`; }
  }
  const g = gloss && gloss.get ? gloss.get(k) : null;
  if(!an.length && g) an = [{lemma:tok, it:g, cat:'gloss', note:[]}];
  // maiuscola in mezzo alla frase e sconosciuta: quasi sempre un nome proprio
  if(!an.length && prev !== undefined && /^[А-ЯЁ]/.test(tok)) an = [{lemma:tok, it:'nome proprio (di persona o di luogo)', cat:'nomep', note:[]}];
  // nel racconto il glossario dà la traduzione giusta per il contesto
  if(an.length && g && an[0].cat!=='prep') an[0] = Object.assign({}, an[0], {itCtx:g});
  return {parola:tok, an, perche};
}
// «presente, io / presente, tu / …» uguali per tutte le persone → una riga sola
function sintesiNote(note){
  if(note.length>=4){ const pre = note.map(n=>n.split(',')[0]); if(pre.every(p=>p===pre[0])) return [`${pre[0]}, uguale per tutte le persone`]; }
  return note;
}
function descriviAnalisi(a, perche){
  if(!a) return '';
  const pezzi = [];
  if(a.cat==='nome') pezzi.push(`nome ${a.gen||''} «${a.lemma}»`.replace(/\s+/g,' '));
  else if(a.cat==='verbo') pezzi.push(`verbo «${a.lemma}»`);
  else if(a.cat==='agg') pezzi.push(`aggettivo «${a.lemma}»`);
  else if(a.cat==='pron' || a.cat==='apron') pezzi.push(`pronome «${a.lemma}»`);
  else if(a.voce && a.voce.tipo && a.voce.tipo!=='vocabolo') pezzi.push(a.voce.tipo);
  const note = sintesiNote(a.note.filter(Boolean));
  if(note.length && a.cat!=='prep') pezzi.push(a.cat==='num' ? `«${a.lemma}» · ${note.join(' / ')}` : note.join(' / '));
  if(a.cat==='prep') pezzi.push(note[0] || 'preposizione');
  if(a.cat==='pron' && PRON_EXTRA[normW(a.form||'')]) pezzi.push(PRON_EXTRA[normW(a.form)]);
  if(perche) pezzi.push(perche);
  return pezzi.join(' · ');
}

const normFr = s => normW(s).replace(/[^а-яa-z0-9\s-]/g,' ').replace(/\s+/g,' ').trim();
function hashStr(s){ let h = 5381; for(let i=0; i<s.length; i++) h = ((h<<5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); }
function fraseSalvata(ru){ const k = normFr(ru); return esesStore().frasi.some(f=>normFr(f.ru)===k); }
function salvaFrase(ru, it, extra){
  extra = extra || {};
  if(fraseSalvata(ru)) return false;
  const df = (DB.frasi||[]).find(f=>normFr(f.ru)===normFr(ru));
  const base = df ? {id:df.id, ru:df.ru, it:df.it, translit:df.translit||''}
                  : {id:'x'+hashStr(normFr(ru)), ru, it:it||'', translit:extra.translit||''};
  return addEsesFrase(Object.assign(base, {tema:extra.tema||''}));
}
function parolaSalvata(ru){ const k = normW(ru); return esesStore().voci.some(v=>normW(v.ru)===k); }
function salvaParola(ru, it, extra){
  extra = extra || {};
  if(parolaSalvata(ru)) return false;
  const v = (DB.voci||[]).find(x=>normW(x.ru)===normW(ru));
  if(v) return addEsesVoce(v.id, v.ru, v.it, v.translit, v.tipo, v.tag);
  return addEsesVoce('x_'+normW(ru), ru, it||'', extra.translit||'', extra.tipo||'', extra.tag||[]);
}

// ---------- Il pannello «Spiega» ----------
function sheetChiudi(){ const ov = document.querySelector('.sheet-ov'); if(ov){ ov.classList.add('out'); setTimeout(()=>ov.remove(), 180); } }
function sheetApri(titolo, build){
  let ov = document.querySelector('.sheet-ov');
  if(!ov){
    ov = $(`<div class="sheet-ov" role="dialog" aria-modal="true"><div class="sheet">
      <div class="sh-head"><button class="sh-back" type="button" aria-label="Indietro">${ic('back')}</button><div class="sh-title"></div>
      <button class="sh-close" type="button" aria-label="Chiudi">${ic('x')}</button></div><div class="sh-body"></div></div></div>`);
    ov._stack = [];
    ov.addEventListener('click', e=>{ if(e.target===ov) sheetChiudi(); });
    ov.querySelector('.sh-close').onclick = sheetChiudi;
    ov.querySelector('.sh-back').onclick = ()=>{ ov._stack.pop(); disegna(); };
    ov._key = e=>{ if(e.key==='Escape'){ e.stopPropagation(); sheetChiudi(); } };
    document.addEventListener('keydown', ov._key, true);
    const obs = new MutationObserver(()=>{ if(!document.body.contains(ov)){ document.removeEventListener('keydown', ov._key, true); obs.disconnect(); } });
    obs.observe(document.body, {childList:true});
    document.body.appendChild(ov);
  }
  function disegna(){
    const top = ov._stack[ov._stack.length-1];
    if(!top){ sheetChiudi(); return; }
    ov.querySelector('.sh-title').textContent = top.titolo;
    ov.querySelector('.sh-back').style.visibility = ov._stack.length>1 ? 'visible' : 'hidden';
    const body = ov.querySelector('.sh-body');
    body.innerHTML = '';
    body.appendChild(top.build());
    body.scrollTop = 0;
  }
  ov._stack.push({titolo, build});
  disegna();
}
// Apre la spiegazione giusta: una parola sola o una frase intera

  opts = opts || {};

  if(!testo) return;
  if(paroleFrase(testo).length <= 1) sheetApri('La parola', ()=>pagParola(paroleFrase(testo)[0] || testo, it, opts));
  else sheetApri('Parola per parola', ()=>pagFrase(testo, it, opts));
}

function pagParola(w, it, opts){
  opts = opts || {};
  const box = $(`<div class="sh-page"></div>`);
  const r = analizzaParola(w, opts.prev, opts.glossario);
  const a = r.an[0];
  const lemma = a && a.cat!=='nomep' ? a.lemma : w;
  const tr = it || (a ? (a.itCtx || a.it) : '');
  const voce = a && a.voce;
  const hero = $(`<div class="sh-hero"><div class="ru" role="button" tabindex="0"></div><div class="tr"></div><div class="it"></div><div class="an"></div><div class="act-bar"></div></div>`);

  hero.querySelector('.ru').onclick = ()=>speak(w);
  const trl = voce && normW(voce.ru)===normW(w) ? voce.translit : '';
  if(trl) hero.querySelector('.tr').textContent = trl; else hero.querySelector('.tr').remove();
  hero.querySelector('.it').textContent = tr || 'Non è nel dizionario dell\'app.';
  const desc = descriviAnalisi(a && Object.assign({form:w}, a), r.perche);
  if(desc) hero.querySelector('.an').textContent = desc; else hero.querySelector('.an').remove();
  const bar = hero.querySelector('.act-bar');
  const sp = $(`<button class="act" type="button">${ic('vol')} Ascolta</button>`);
  sp.onclick = ()=>speak(w);
  bar.appendChild(sp);
  if(a && a.cat==='verbo') bar.appendChild(saveBtnSheet('Salva il verbo', ()=>isEsesVerbo(a.verbo.id) && parolaSalvata(a.verbo.inf), ()=>{ salvaParola(a.verbo.inf, a.verbo.en, {tipo:'verbo'}); addEsesVerbo(a.verbo.id); }));
  else if(a && a.cat!=='nomep') bar.appendChild(saveBtnSheet(normW(lemma)!==normW(w) ? `Salva «${lemma}»` : 'Salva la parola', ()=>parolaSalvata(lemma), ()=>salvaParola(lemma, a.it || tr, {tipo: voce ? voce.tipo : ''})));
  else bar.appendChild(saveBtnSheet('Salva la parola', ()=>parolaSalvata(w), ()=>salvaParola(w, tr)));
  const mic = micParts(()=>w);
  if(mic){ bar.appendChild(mic.btn); hero.appendChild(mic.res); }
  box.appendChild(hero);
  if(r.an.length>1){
    const alt = $(`<div class="pcard sh-alt"><b>Può essere anche</b></div>`);
    r.an.slice(1,4).forEach(x=>{ const d = $(`<div></div>`); d.textContent = `${x.it} — ${descriviAnalisi(Object.assign({form:w}, x), '')}`; alt.appendChild(d); });
    box.appendChild(alt);
  }
  // forme: coniugazione, declinazione, caso retto dalla preposizione
  let forme = null;

  else if(a && a.cat==='nome') forme = openDecl(makeDeclensionBlock(a.lemma, voce && voce.tipo, voce && voce.tag));
  else if(a && a.cat==='agg') forme = openDecl(makeAdjDeclensionBlock(a.lemma));
  else if(a && a.cat==='apron') forme = openDecl(makeAdjDeclensionBlock(a.lemma));
  else if(a && a.cat==='pron') forme = openDecl(makePronounDeclensionBlock(a.lemma));
  else if(a && a.cat==='prep') forme = makePrepInfoBlock(a.lemma);
  if(forme){ const c = $(`<div class="pcard sh-forme"></div>`); c.appendChild(forme); box.appendChild(c); }
  if(a && a.cat==='verbo'){
    const l = $(`<button class="textbtn" type="button" style="align-self:flex-start">${ic('zap')} Scheda completa del verbo</button>`);
    l.onclick = ()=>{ sheetChiudi(); navigateTo(()=>runVerboDetail(a.verbo)); };
    box.appendChild(l);
  }
  // la parola nelle frasi dell'app
  const es = frasiConParola(lemma);
  if(es.length){
    box.appendChild($(`<div class="sec-h" style="margin:4px 2px 0">Nelle frasi</div>`));
    const list = $(`<div class="list" style="gap:6px"></div>`);

      const row = $(`<div class="sh-es" role="button" tabindex="0"><div class="txt"><div class="ru"></div><div class="it"></div></div><span class="mini-btn lens">${ic('textsearch')}</span></div>`);
      row.querySelector('.ru').textContent = f.ru; row.querySelector('.it').textContent = f.it;
      row.onclick = ()=>sheetApri('Parola per parola', ()=>pagFrase(f.ru, f.it, {}));
      list.appendChild(row);
    });
    box.appendChild(list);
  }
  return box;
}

// Microfono: pulsante + riga del risultato (la usano Pronuncia e le barre azioni)
function micParts(getTarget, label){
  if(!SpeechRec) return null;
  label = label || 'Pronuncia';
  const btn = $(`<button class="act mic-act" type="button">${ic('mic')} ${label}</button>`);
  const res = $(`<div class="mic-res"></div>`);
  let rec = null;
  const reset = ()=>{ btn.classList.remove('rec'); btn.innerHTML = `${ic('mic')} ${label}`; };
  btn.onclick = e=>{
    e.stopPropagation();
    if(rec){ try{ rec.stop(); }catch(_){} return; }
    stopSpeech();
    btn.classList.add('rec'); btn.innerHTML = `${ic('stop')} Ascolto…`;
    res.textContent = '';
    rec = ascoltaRusso((testo, err)=>{
      rec = null; reset();
      if(!testo){ res.innerHTML = `<span class="mr-no">${err==='not-allowed'||err==='service-not-allowed' ? 'Microfono non consentito.' : 'Non ho sentito: riprova.'}</span>`; return; }
      const c = confrontaDetto(testo, getTarget());
      const [cls, msg] = c.pct>=80 ? ['ok','Ottima pronuncia!'] : c.pct>=50 ? ['mid','Quasi!'] : ['ko','Riprova'];
      res.innerHTML = `<b class="${cls}">${msg}</b><span class="mr-heard"></span>`;
      res.querySelector('.mr-heard').textContent = ` Ho sentito: «${testo}»`;
      haptic(c.pct>=80);
    }, parz=>{ res.textContent = parz; });
  };
  onLeave(()=>{ if(rec){ try{ rec.abort(); }catch(_){} rec = null; } });
  return {btn, res};
}

  return wrap;
}
