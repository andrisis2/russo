      row.querySelector('.it').textContent = e.it || '';
      row.querySelector('.sg-tema').textContent = e.fonte || 'Errore';
      row.prepend(spkBtn(onlyCyrillic(e.ru)));
      row.append(lensBtn(e.ru, e.it), delBtn(()=>togliErrore(e.ru)));
      list.appendChild(row);
    });
    body.appendChild(list);
  }

  // ---- Scheda Verbi ----
  function buildVerbi(body){
    const s = esesStore();
    const allVerbi = DB.verbi || [];
    const savedVerbi = (s.verbi||[]).map(id=>allVerbi.find(v=>v.id===id)).filter(Boolean);
    if(!savedVerbi.length){
      body.appendChild($(`<div class="empty"><div class="big">⚡</div>Nessun verbo salvato.<small>Salva un verbo da <b>Verbi</b>, dal <b>Vocabolario</b> o da <b>Frasi &amp; grammatica</b>:<br>se ne conosciamo la coniugazione arriva qui, con tutte le sue forme.</small></div>`));
      return;
    }
    const trainBtn = $(`<button class="btn primary block" type="button">${ic('zap')} Allenati: coniugazione (${plur(savedVerbi.length,'verbo','verbi')})</button>`);
    trainBtn.onclick = ()=>navigateTo(()=>runConjugation(CONJ_TENSES_RU.map(t=>t.key), savedVerbi));
    body.appendChild(trainBtn);
    const list = $(`<div class="list" style="margin-top:12px"></div>`);
    savedVerbi.slice().reverse().forEach(v=>{
      const row = $(`<div class="ese-item col"><div class="top"><div class="txt"><div class="ru"></div><div class="it"></div></div></div></div>`);
      const top = row.querySelector('.top');
      row.querySelector('.ru').textContent = v.inf;
      row.querySelector('.it').textContent = v.en || '';
      top.prepend(spkBtn(v.inf));
      // Allenamento mirato: tutte le forme di questo solo verbo.
      const drill = $(`<button class="mini-btn go" type="button" title="Allenati su questo verbo" aria-label="Allenati su questo verbo">${ic('zap')}</button>`);
      drill.onclick = ()=>navigateTo(()=>runConjugation(CONJ_TENSES_RU.map(t=>t.key), [v]));
      top.appendChild(drill);
      top.appendChild(delBtn(()=>removeEsesVerbo(v.id)));
      const conj = makeVerbConjBlock(v, true);
      conj.style.padding = '0 10px 10px';
      row.appendChild(conj);
      list.appendChild(row);
    });
    body.appendChild(list);
  }

  function renderTab(tab, dir){
    activeTab = tab;
    localStorage.setItem('russo_ese_tab', tab);
    tabsDiv.querySelectorAll('.home-tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
    paintCounts();
    const panel = $(`<div class="list" style="gap:12px"></div>`);
    if(dir) panel.classList.add(dir==='left' ? 'slide-left' : 'slide-right');
    if(tab==='flash') buildFlash(panel);
    else if(tab==='frasi') buildFrasi(panel);
    else if(tab==='errori') buildErrori(panel);
    else buildVerbi(panel);
    wrapOuter.innerHTML='';
    wrapOuter.appendChild(panel);
    const s0 = esesStore();
    resetBtn.style.display = tab!=='errori' && (s0.voci.length || s0.frasi.length || s0.verbi.length) ? '' : 'none';
  }

  tabsDiv.querySelectorAll('.home-tab').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.tab===activeTab) return;
      const dir = TABS.indexOf(b.dataset.tab) > TABS.indexOf(activeTab) ? 'left' : 'right';
      renderTab(b.dataset.tab, dir);
    };
  });
  onSwipe(wrapOuter, dir=>{
    const cur = TABS.indexOf(activeTab);
    if(dir==='left'  && cur < TABS.length-1) renderTab(TABS[cur+1], 'left');
    if(dir==='right' && cur > 0)             renderTab(TABS[cur-1], 'right');
  });

  // Svuota tutto: in fondo, lontano dal pollice
  const resetBtn = $(`<button class="textbtn" type="button" style="align-self:center;color:var(--bad);margin-top:6px">${ic('trash')} Svuota tutti gli esercizi</button>`);
  resetBtn.onclick = ()=>{
    if(!confirm('Eliminare tutte le parole, le frasi e i verbi salvati negli esercizi?')) return;
    saveEses({voci:[],frasi:[],verbi:[]});
    renderTab(activeTab);
  };
  stage.appendChild(resetBtn);
  renderTab(activeTab);
}

// Arricchisce le voci salvate con tipo/tag dal dizionario, così le
// declinazioni compaiono anche per parole salvate senza metadati completi.
function enrichVoci(voci){
  const dic = DB.voci || [];
  return (voci||[]).map(w=>{
    if(w.tipo) return w;
    const hit = dic.find(v=>v.ru===w.ru);
    return hit ? {...w, tipo:hit.tipo||w.tipo||'', tag:(w.tag&&w.tag.length)?w.tag:(hit.tag||[])} : w;
  });
}

// ---------- 0. REGOLE GRAMMATICALI (consultazione) ----------
const onlyCyrillic = s => (s.match(/[а-яёА-ЯЁ\s]+/g)||[]).join(" ").replace(/\s+/g," ").trim();
const hasCyrillic = s => /[а-яё]/i.test(s);

function runReference(scrollToId){
  const stage = header('Regole grammaticali');
  const secs = DB.riferimento || [];
  const breve = $(`<button class="textbtn" type="button" style="align-self:flex-start;margin:-4px 0 -6px -8px">${ic('quiz')} Regole in breve e quiz</button>`);
  breve.onclick = ()=>navigateTo(()=>runGram());
  stage.appendChild(breve);

  // navigazione a chip (resta in alto mentre si scorre) per saltare alle sezioni
  const nav = $(`<div class="ref-nav"></div>`);
  const chips = {};
  secs.forEach(s=>{
    const chip = $(`<button class="ref-chip" type="button">${s.icona||""} ${s.categoria}</button>`);
    chip.onclick = ()=>document.getElementById("sec-"+s.id).scrollIntoView({behavior:"smooth",block:"start"});
    nav.appendChild(chip);
    chips[s.id] = chip;
  });
  stage.appendChild(nav);

  secs.forEach(s=>{
    const sec = $(`<section class="ref-sec" id="sec-${s.id}"></section>`);
    sec.appendChild($(`
      <div class="head">
        <span class="ico">${s.icona||"📌"}</span>
        <h3>${s.categoria}</h3>
      </div>`));
    if(s.sottotitolo) sec.appendChild($(`<p class="sub">${s.sottotitolo}</p>`));

    (s.blocchi||[]).forEach(b=>{
      if(b.tipo==="testo"){
        sec.appendChild($(`<p class="txt">${b.testo}</p>`));
      } else if(b.tipo==="nota"){
        sec.appendChild($(`<div class="ref-note">💡 ${b.testo}</div>`));
      } else if(b.tipo==="tabella"){
        const wrap = $(`<div class="tbl-wrap"></div>`);
        const t = $(`<table class="ref"></table>`);
        const thead = $(`<thead></thead>`);
        const trh = $(`<tr></tr>`);
        b.intestazioni.forEach(h=>trh.appendChild($(`<th>${h}</th>`)));
        thead.appendChild(trh); t.appendChild(thead);
        const tbody = $(`<tbody></tbody>`);
        b.righe.forEach(r=>{
          const tr = $(`<tr></tr>`);
          r.forEach((cell,ci)=>{
            const cy = ci>0 && hasCyrillic(cell);   // 1ª colonna = etichetta italiana
            const td = $(`<td class="${cy?'ru tap':''}">${cell}</td>`);
            if(cy){ const say=onlyCyrillic(cell); td.onclick=()=>speak(say); }
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        t.appendChild(tbody); wrap.appendChild(t); sec.appendChild(wrap);
      }
    });
    stage.appendChild(sec);
  });

  const up = $(`<button class="btn" type="button">↑ Torna all'inizio</button>`);
  up.onclick = ()=>window.scrollTo({top:0, behavior:"smooth"});
  stage.appendChild(up);

  // la chip della sezione che si sta leggendo si accende (e scorre in vista)
  if('IntersectionObserver' in window){
    let cur = null;
    const io = new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        if(!en.isIntersecting) return;
        const id = en.target.id.replace('sec-','');
        if(id===cur) return;
        cur = id;
        Object.entries(chips).forEach(([k,c])=>c.classList.toggle('on', k===id));
        const c = chips[id];
        if(c) nav.scrollTo({left: c.offsetLeft - nav.clientWidth/2 + c.offsetWidth/2, behavior:'smooth'});
      });
    }, {rootMargin:'-130px 0px -65% 0px'});
    stage.querySelectorAll('.ref-sec').forEach(s=>io.observe(s));
    onLeave(()=>io.disconnect());
  }

  if(scrollToId){
    requestAnimationFrame(()=>{
      const el = document.getElementById("sec-"+scrollToId);
      if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
    });
  }
}

// Cerca nel dizionario locale una voce che corrisponda a una parola di "Frasi & grammatica"
// (confronto case-insensitive, perché nelle frasi la parola può iniziare per maiuscola).
function findDictVoce(ru){
  const key = (ru||'').trim().toLowerCase();
  if(!key) return null;
  return (DB.voci||[]).find(v=>(v.ru||'').trim().toLowerCase()===key) || null;
}
// Id stabile per parole/espressioni senza voce nel dizionario (per salvarle negli esercizi
// senza duplicati se la stessa parola compare in più frasi).
function slugRu(s){
  return 'fg_' + (s||'').trim().toLowerCase().replace(/[^\wа-яё]+/gi,'-').replace(/^-+|-+$/g,'');
}
const LINK_TIPO_GRAMM = {verbo:'verbo', nome:'sostantivo', aggettivo:'aggettivo', pronome:'pronome', preposizione:'preposizione'};

// ---------- Frasi & grammatica: frasi semplici spiegate parola per parola ----------

      if(hasCyrillic(p.ru)){
        const dict = findDictVoce(p.ru);
        const wordId = dict ? dict.id : slugRu(p.ru);
        const wordRu = dict ? dict.ru : p.ru.trim();
        const wordIt = dict ? dict.it : (p.it||'');
        const wordTipo = dict ? (dict.tipo||'') : (link ? (LINK_TIPO_GRAMM[link.tipo]||'') : '');

        const addBtn = $(`<button class="sg-word-link" type="button"></button>`);

          addBtn.disabled = saved;
        }
        // Se dietro la parola c'è un verbo con coniugazione nota, il salvataggio
        // porta negli esercizi anche la coniugazione: lo diciamo qui sotto.
        const verboParola = findVerboForWord(wordRu, wordTipo);
        function notaConjParola(){
          if(!verboParola || row.querySelector('.conj-ese-note')) return;
          const nota = makeConjEseNote(verboParola);
          nota.style.marginTop = '8px';
          row.querySelector('.sg-word-txt').appendChild(nota);
        }
        paintAdd();
        addBtn.onclick = (e)=>{
          e.stopPropagation();
          addEsesVoce(wordId, wordRu, wordIt, dict?(dict.translit||''):'', wordTipo, wordTag);
          paintAdd();
          notaConjParola();
          haptic(true);
        };
        actions.appendChild(addBtn);
        if(isEsesVoce(wordId) && verboParola && isEsesVerbo(verboParola.id)) setTimeout(notaConjParola, 0);
      }

      if(actions.children.length) row.querySelector(".sg-word-txt").appendChild(actions);
      words.appendChild(row);
    });
    words.appendChild(addFull);
    body.firstChild.appendChild(words);

    head.onclick = ()=>card.classList.toggle("open");

    card.appendChild(head);
    card.appendChild(body);
    list.appendChild(card);
    cards.push({card, key: normSearch([f.ru, f.it, f.tema, (f.parole||[]).map(p=>p.ru+' '+p.it).join(' ')].join(' ').replace(/<[^>]+>/g,''))});
  });

  function applyFilter(){
    const q = normSearch(inp.value);
    let n = 0;
    cards.forEach(c=>{ const ok = !q || c.key.includes(q); c.card.style.display = ok ? '' : 'none'; if(ok) n++; });
    countEl.textContent = q ? (n ? plur(n,'frase trovata','frasi trovate') : 'Nessuna frase: prova un\'altra parola') : `${items.length} frasi`;
  }
  inp.addEventListener('input', applyFilter);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') inp.blur(); if(e.key==='Escape'){ inp.value=''; applyFilter(); } });
  applyFilter();
}

function pickFlashTopic(){
  const stage = header('Flashcard');
  const allPool = DB.voci||[];
  const dueOf = pool => pool.filter(x=>isDue(x.id)).length;

  // Riga argomento + pulsante rapido "15 carte"
  function mkRow(ico, label, desc, pool){
    const due = dueOf(pool);
    const btn = $(`<button class="tile wide" type="button"><div class="ico">${ico}</div>
      <div class="txt"><div class="t">${label}</div><div class="d">${desc} &middot; <span class="due">${due} da ripassare</span></div></div></button>`);
    btn.onclick = ()=>navigateTo(()=>startTopicFlash(pool, label));
    const wrap = $(`<div class="rowpair"></div>`);
    wrap.appendChild(btn);
    if(pool.length > 15){
      const q = $(`<button class="qbtn" type="button" title="Ripassa 15 carte" aria-label="Ripassa 15 carte di ${label}">${ic('zap')}<b>15</b>carte</button>`);
      q.onclick = ()=>navigateTo(()=>startQuick15(pool, label));
      wrap.appendChild(q);
    }
    return wrap;
  }

  // ----- Per livello -----
  stage.appendChild($(`<div class="sec-h" style="margin-top:0">Per livello</div>`));
  const levels = [
    [1,'🌱','Facile','Parole di base'],
    [2,'🌿','Medio','Vocabolario quotidiano'],
    [3,'🌳','Difficile','Parole avanzate'],
    [0,'🎲','Mix','Tutti i livelli insieme'],
  ];
  const levelList = $(`<div class="list"></div>`);
  levels.forEach(([lvl,ico,label,desc])=>{
    const words = lvl===0 ? allPool : allPool.filter(e=>e.difficolta===lvl);
    if(!words.length) return;
    levelList.appendChild(mkRow(ico, label, `${desc} &middot; ${words.length}`, words));

  // ----- Per argomento -----
  stage.appendChild($(`<div class="sec-h">Per argomento</div>`));

  topicList(allPool).forEach(([tag, label, words])=>{
    list.appendChild(mkRow(TOPIC_ICONS[tag]||'📚', label, plur(words.length,'parola','parole'), words));
  });
  stage.appendChild(list);
}

// Studio per argomento: mostra solo le carte in scadenza.
function startTopicFlash(pool, label){
  runFlash(pool, label, { restart: ()=>startTopicFlash(pool, label) });
}
function startQuick15(pool, label){
  runFlash(pool, label + ' · 15 carte', { limit: 15, restart: ()=>startQuick15(pool, label) });
}

function runFlash(pool, topicLabel, opts){
  opts = opts || {};
  // Mostra solo le carte "in scadenza" (mai viste o con intervallo scaduto),
  // le più urgenti per prime. "La sapevo" pianifica la carta più avanti nel tempo
  // (1 giorno → 3 → 7 → … ) e quindi sparisce dalla sessione; "Da
  // ripassare" la riazzera e la rimette in fondo alla coda, così torna entro la sessione.
  // opts.ignoreDue: ripasso volontario (es. "parole ostiche"), anche se non scadute
  // opts.fallbackAll: se nulla è in scadenza si ripassano comunque tutte (esercizi salvati)
  let deck = opts.ignoreDue ? (pool||[]).slice() : (pool||[]).filter(c=>isDue(c.id));
  if(!deck.length && opts.fallbackAll) deck = shuffle((pool||[]).slice());
  deck = deck.sort((a,b)=>dueScore(b.id)-dueScore(a.id));
  if(opts.limit) deck = deck.slice(0, opts.limit);
  const total = deck.length;       // carte da padroneggiare in questa sessione
  let queue = deck.slice();        // coda di lavoro
  let mastered = 0;                // carte completate ("La sapevo") in questa sessione
  let sbagli = 0;                  // quante volte "Da ripassare" (per il punteggio finale)
  let dir = localStorage.getItem('flashDirRu')==='it-ru' ? 'it-ru' : 'ru-it';
  const stage = header(topicLabel || 'Flashcard', {narrow:true});

  // Nessuna carta in scadenza: tutto ripassato.
  if(!total){
    emptyDone(stage, '✅', 'Tutto ripassato!', "Nessuna carta in scadenza qui per ora. Torna quando l'intervallo sarà scaduto, oppure scegli un altro argomento.");
    return;
  }

  const top = $(`<div class="ex-top"></div>`);
  const seg = $(`<div class="seg sm center"><button type="button" data-d="ru-it">Russo → Italiano</button><button type="button" data-d="it-ru">Italiano → Russo</button></div>`);
  function paintDir(){ seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.d===dir)); }
  seg.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      if(dir===b.dataset.d) return;
      dir = b.dataset.d;
      localStorage.setItem('flashDirRu', dir);
      paintDir();
      show();
    };
  });
  paintDir();
  top.appendChild(seg);
  stage.appendChild(top);
  const bar = progressBar(top);

  const cardWrap = $(`<div class="list" style="gap:12px"></div>`); stage.appendChild(cardWrap);

  let c = null, flipped = false, flipFn = null, gradeFn = null;
  // Prende la prossima carta dalla coda (o chiude la sessione). show() ridisegna
  // solo la carta corrente, così il cambio di direzione non la fa saltare.
  function advance(){
    if(!queue.length){
      flipFn = gradeFn = null;       // finita: i tasti non toccano più l'ultima carta
      if(opts.onComplete) opts.onComplete();
      return finish(stage, `${mastered} / ${total + sbagli}`, opts.restart||(()=>runFlash(pool, topicLabel, opts)), {
        titolo: 'Flashcard completate!',
        testo: sbagli ? `${plur(total,'carta','carte')} ripassate, ${sbagli===1?'una è tornata':sbagli+' sono tornate'} in coda.` : `${plur(total,'carta','carte')}, tutte giuste al primo colpo.`
      });
    }
    c = queue.shift();
    show();
  }
  function show(){
    bar.style.width = (mastered/total*100)+"%"; bar.setNum(mastered, total);
    flipped = false;
    const ruFront = dir==='ru-it';
    const frontWord = ruFront ? c.ru : c.it;
    const backTrans = ruFront ? c.it : c.ru;
    cardWrap.innerHTML="";
    const gtag = genderBadgeHTML(c.ru, c.tipo, c.tag);   // scritta M/F/N per i sostantivi
    const spk = `<button class="speak" type="button" title="Ascolta" aria-label="Ascolta">${ic('vol')}</button>`;
    const sz = (t, max, min)=>`style="font-size:${fitSize(t, max, min)}px"`;
    const flip = $(`
      <div class="flip" role="button" tabindex="0" aria-label="Gira la carta">
        <div class="flash">
          <div class="face front">
            ${gtag}
            ${ruFront ? spk : ""}
            <div class="${ruFront?'ru':'it'}" ${ruFront?sz(frontWord,44,26):sz(frontWord,30,20)}>${esc(frontWord)}</div>
            ${ruFront && c.translit ? `<div class="translit">${esc(c.translit)}</div>` : ""}
            <div class="hint">${ic('rotate')} tocca per girare</div>
          </div>
          <div class="face back">
            ${gtag}
            ${!ruFront ? spk : ""}
            <div class="${ruFront?'it':'ru'}" ${ruFront?sz(backTrans,30,20):sz(backTrans,44,26)}>${esc(backTrans)}</div>
            ${!ruFront && c.translit ? `<div class="translit">${esc(c.translit)}</div>` : ""}
            <div class="small">${esc(frontWord)}</div>
          </div>
        </div>
      </div>`);
    flip.querySelector(".speak").onclick = (e)=>{e.stopPropagation(); speak(c.ru);};
    // Declinazioni del nome (visibili dopo aver girato la carta, per non svelare la risposta)
    const decl = makeDeclensionBlock(c.ru, c.tipo, c.tag);
    const reveal = $(`<button class="btn block" type="button">${ic('rotate')} Mostra la risposta <span class="kbd-hint">spazio</span></button>`);
    const controls = $(`
      <div class="grade-row hidden">
        <button class="btn bad" type="button">${ic('x')} Da ripassare <span class="kbd-hint">1</span></button>
        <button class="btn good" type="button">${ic('check')} La sapevo <span class="kbd-hint">2</span></button>
      </div>`);
    const acts = azioniTesto(c.ru, c.it, {translit:c.translit, tipo:c.tipo, tag:c.tag});
    acts.classList.add('hidden');
    flipFn = ()=>{
      if(flipped) return;
      flipped=true;
      flip.classList.add("flipped");
      reveal.classList.add("hidden");
      controls.classList.remove("hidden");
      acts.classList.remove("hidden");
      if(decl) decl.style.display='';
      if(!ruFront && 'speechSynthesis' in window) setTimeout(()=>speak(c.ru), 200);
    };
    flip.onclick = flipFn;
    reveal.onclick = flipFn;
    gradeFn = (ok)=>{
      if(!flipped) return;
      flipped = false;             // niente doppio voto sulla stessa carta
      haptic(ok); grade(c.id, ok);
      if(ok) mastered++; else { sbagli++; queue.push(c); }   // sbagliata: torna in fondo alla coda
      advance();
    };
    controls.children[0].onclick = ()=>gradeFn(false);
    controls.children[1].onclick = ()=>gradeFn(true);
    cardWrap.appendChild(flip);
    cardWrap.appendChild(reveal);
    cardWrap.appendChild(controls);
    cardWrap.appendChild(acts);
    if(decl){ decl.style.display = ruFront ? '' : 'none'; cardWrap.appendChild(decl); }
    if(ruFront && 'speechSynthesis' in window) setTimeout(()=>speak(c.ru), 150);
  }
  // Tastiera fisica: spazio/invio gira, 1 o ← = da ripassare, 2 o → = la sapevo
  const onKey = e=>{
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key===' ' || e.key==='Enter'){ if(!flipped && flipFn){ e.preventDefault(); flipFn(); } return; }
    if(!flipped || !gradeFn) return;
    if(e.key==='1' || e.key==='ArrowLeft') gradeFn(false);
    else if(e.key==='2' || e.key==='ArrowRight') gradeFn(true);
  };
  document.addEventListener('keydown', onKey);
  onLeave(()=>document.removeEventListener('keydown', onKey));
  advance();
}

function runDaily(){

// ---------- MEMORY (abbinamento RU <-> IT a tempo) ----------
const MEM_BEST_KEY = "russo_memory_best_v1";
function memBest(){ try{ return JSON.parse(localStorage.getItem(MEM_BEST_KEY)||"{}"); }catch(e){ return {}; } }
function fmtTime(s){ const m=Math.floor(s/60); return m+":"+String(s%60).padStart(2,"0"); }
const MEM_LEVELS = [[6,"Facile","6 coppie · 12 carte","🌱"],[8,"Medio","8 coppie · 16 carte","🌿"],[10,"Difficile","10 coppie · 20 carte","🌳"]];

function runMemory(){
  const stage = header('Memory');
  stage.appendChild($(`<p class="sg-intro">Gira le carte e abbina ogni parola russa alla sua traduzione. Ogni coppia trovata conta come ripasso.</p>`));
  const best = memBest();
  const list = $(`<div class="list"></div>`);
  MEM_LEVELS.forEach(([n,label,desc,ico])=>{
    const rec = best[n] ? `<span class="right pill gold">${ic('trophy')} ${fmtTime(best[n])}</span>` : '';
    const btn = $(`<button class="tile wide" type="button">
      <div class="ico">${ico}</div>
      <div class="txt"><div class="t">${label}</div><div class="d">${desc}</div></div>${rec}
    </button>`);
    btn.onclick = ()=>navigateTo(()=>playMemory(n));
    list.appendChild(btn);
  });
  stage.appendChild(list);
}

function playMemory(pairs){
  // parole corte: sulle carte piccole le traduzioni lunghe non si leggono
  let pool = (DB.voci||[]).filter(w=>w.it && w.ru && w.it.length<=22 && w.ru.length<=14);
  if(pool.length < pairs) pool = (DB.voci||[]).filter(w=>w.it && w.ru);
  const label = (MEM_LEVELS.find(l=>l[0]===pairs)||[])[1] || '';
  if(pool.length < pairs){
    const stage = header('Memory');
    emptyDone(stage, '🧠', 'Parole insufficienti', 'Non ci sono abbastanza parole per giocare.');
    return;
  }
  // Una carta russa + una italiana per ogni parola; condividono la stessa chiave (id).
  // Niente due parole con la stessa traduzione: renderebbero ambiguo l'abbinamento.
  const scelte = [], visti = new Set();
  for(const w of shuffle(pool)){
    const k = w.it.toLowerCase(), r = w.ru.toLowerCase();
    if(visti.has(k) || visti.has(r)) continue;
    visti.add(k); visti.add(r); scelte.push(w);
    if(scelte.length===pairs) break;
  }
  let cards = [];
  scelte.forEach(w=>{
    cards.push({key:w.id, lang:"RU", text:w.ru, say:w.ru});
    cards.push({key:w.id, lang:"IT", text:w.it});
  });
  cards = shuffle(cards);

  const stage = header(`Memory · ${label}`, {narrow:true});
  const statsEl = $(`<div class="mem-stats">
    <span>${ic('clock')} <b class="memTime">0:00</b></span>
    <span>Mosse <b class="memMoves">0</b></span>
    <span>Trovate <b class="memFound">0</b>/${pairs}</span>
  </div>`);
  statsEl.querySelectorAll('.i').forEach(i=>{ i.style.width='14px'; i.style.height='14px'; i.style.marginTop='-2px'; });
  stage.appendChild(statsEl);
  const grid = $(`<div class="mem-grid ${pairs<=6?'c3':'c4'}"></div>`);
  stage.appendChild(grid);

  let first=null, lock=false, moves=0, found=0, startTime=null, timer=null;
  const setStat = (cls,v)=>{ const e=statsEl.querySelector(cls); if(e) e.textContent=v; };
  function tick(){ setStat(".memTime", fmtTime(Math.round((Date.now()-startTime)/1000))); }
  onLeave(()=>clearInterval(timer));   // schermata abbandonata: il cronometro si ferma

  cards.forEach(c=>{
    const el = $(`<button class="mem-card" type="button">
      <div class="mem-inner">
        <div class="mem-face mem-back"><span>?</span></div>
        <div class="mem-face mem-front" lang="${c.lang==='RU'?'ru':'it'}"><span class="mem-lang">${c.lang}</span></div>
      </div>
    </button>`);
    const front = el.querySelector('.mem-front');
    front.appendChild(document.createTextNode(c.text));
    // parole lunghe: carattere più piccolo e sillabazione, niente tagli a caso
    if(c.text.length > (pairs<=6 ? 11 : 8)) front.classList.add('long');
    el.onclick = ()=>flip(c, el);
    grid.appendChild(el);
  });

  function flip(c, el){
    if(lock || el.classList.contains("up") || el.classList.contains("done")) return;
    if(!startTime){ startTime=Date.now(); timer=setInterval(tick, 500); }
    el.classList.add("up");
    if(c.say && 'speechSynthesis' in window) speak(c.say);
    if(!first){ first={c, el}; return; }
    moves++; setStat(".memMoves", moves);
    const a = first; first = null;
    if(a.c.key===c.key){
      haptic(true);
      a.el.classList.add("done"); el.classList.add("done");
      grade(c.key, true);                 // un abbinamento giusto conta come ripasso SRS
      found++; setStat(".memFound", found);
      if(found===pairs) win();
    } else {
      haptic(false);
      lock = true;
      a.el.classList.add("miss"); el.classList.add("miss");
      setTimeout(()=>{
        a.el.classList.remove("up","miss"); el.classList.remove("up","miss");
        lock = false;
      }, 750);
    }
  }

  function win(){
    if(timer) clearInterval(timer);
    const secs = startTime ? Math.round((Date.now()-startTime)/1000) : 0;
    const best = memBest(), prev = best[pairs];
    const isBest = !prev || secs < prev;
    if(isBest){ best[pairs]=secs; localStorage.setItem(MEM_BEST_KEY, JSON.stringify(best)); }
    setTimeout(()=>{
      stage.innerHTML = `
        <div class="done">
          <div class="big">${isBest?"🏆":"🎉"}</div>
          <h2>${isBest?"Nuovo record!":"Completato!"}</h2>
          <p class="muted">Tempo ${fmtTime(secs)} &middot; ${moves} mosse${(!isBest&&prev)?`<br>Record: ${fmtTime(prev)}`:""}</p>
        </div>`;
      haptic(true);
      if(isBest) confetti(stage.querySelector('.done'));
      const row=$(`<div class="row"></div>`);
      const back=$(`<button class="btn" type="button">${ic('back')} Indietro</button>`); back.onclick=goBack;
      const again=$(`<button class="btn primary" type="button">${ic('refresh')} Ancora</button>`); again.onclick=()=>playMemory(pairs);
      row.appendChild(back); row.appendChild(again); stage.appendChild(row);
      stage.appendChild(listaParole('Le parole della partita', scelte));
    }, 500);
  }
}

// ---------- Tastiera cirillica a schermo (Scrittura, Coniugazione) ----------
// Evita di dover installare il layout russo sul telefono. locked() = true
// quando la risposta è già stata data e la tastiera non deve più scrivere.
function makeCyrKeyboard(inp, onInput, locked){
  const kbd = $(`<div class="kbd" role="group" aria-label="Tastiera cirillica"></div>`);
  const type = ch=>{ if(locked()) return; inp.value += ch; onInput(); try{ navigator.vibrate && navigator.vibrate(4); }catch(e){} };
  KBD_ROWS.forEach(row=>{
    const r = $(`<div class="krow"></div>`);
    row.forEach(ch=>{
      const b = $(`<button type="button">${ch}</button>`);
      b.onclick = ()=>type(ch);
      r.appendChild(b);
    });
    kbd.appendChild(r);
  });
  const last = $(`<div class="krow"></div>`);
  const sp = $(`<button type="button" class="wide">spazio</button>`);
  sp.onclick = ()=>type(" ");
  const dash = $(`<button type="button">-</button>`);
  dash.onclick = ()=>type("-");
  const del = $(`<button type="button" class="wide" aria-label="Cancella (tieni premuto per cancellare tutto)">${ic('backspace')}</button>`);
  del.onclick = ()=>{ if(locked()) return; inp.value = inp.value.slice(0,-1); onInput(); };
  del.oncontextmenu = e=>{ e.preventDefault(); if(locked()) return; inp.value=""; onInput(); };
  last.append(sp, dash, del);
  kbd.appendChild(last);
  return kbd;
}

// ---------- 2. CONIUGAZIONE ----------
function runConjugation(tenseFilter, verbiPool){
  const verbi = verbiPool || DB.verbi || [];
  if(!verbi.length){
    const stage = header('Coniugazione');
    emptyDone(stage, '📭', 'Nessun verbo', 'Non ci sono verbi da allenare.');
    return;
  }

  if(tenseFilter === undefined){
    const stage = header('Coniugazione');
    stage.appendChild($(`<p class="sg-intro">Vedi il significato e il pronome, scrivi tu la forma giusta del verbo. ${verbi.length} verbi, 12 domande per giro.</p>`));
    const list = $(`<div class="list"></div>`);
    const mixBtn = $(`<button class="tile wide" type="button"><div class="ico">🎲</div>
      <div class="txt"><div class="t">Mix</div><div class="d">Tutti i tempi insieme</div></div></button>`);
    mixBtn.onclick = ()=>navigateTo(()=>runConjugation(CONJ_TENSES_RU.map(t=>t.key)));
    list.appendChild(mixBtn);
    const ICO = {pres:'▶️', past:'⏪', fut:'⏩', imp:'❗'};
    CONJ_TENSES_RU.forEach(t=>{
      const btn = $(`<button class="tile wide" type="button"><div class="ico">${ICO[t.key]||'✏️'}</div>
        <div class="txt"><div class="t">${t.label}</div><div class="d">${t.modo}</div></div></button>`);
      btn.onclick = ()=>navigateTo(()=>runConjugation([t.key]));
      list.appendChild(btn);
    });
    stage.appendChild(list);
    return;
  }

  const tenseKeys = tenseFilter;
  const all = [];
  verbi.forEach(v=>tenseKeys.forEach(tk=>{
    const forms = v.coniugazioni && v.coniugazioni[tk];
    if(!forms || !forms.length) return;
    const pronouns = CONJ_PRONOUNS_RU[tk] || [];
    for(let p=0;p<forms.length;p++){
      all.push({verb:v, inf:v.inf, translit_inf:v.translit_inf||"", en:v.en, tk, p, answer:forms[p], pron:pronouns[p]||"", id:`conj:${v.inf}:${tk}:${p}`});
    }
  }));
  if(!all.length){ goBack(); return; }
  // Con i verbi salvati negli Esercizi si chiedono TUTTE le forme: se sono
  // troppe per un solo giro si parte da quelle più in ritardo secondo l'SRS,
  // così nei giri successivi escono comunque tutte.
  const maxDomande = verbiPool ? 20 : 12;
  const pool = all.length <= maxDomande
    ? all.slice()
    : all.sort((a,b)=>dueScore(b.id)-dueScore(a.id)).slice(0, Math.min(maxDomande*2, all.length));
  const deck = shuffle(pool).slice(0, Math.min(maxDomande, pool.length));

  let i=0, correct=0;
  const titolo = verbiPool
    ? (verbi.length===1 ? `Coniugazione · ${verbi[0].inf}` : 'Coniugazione · i tuoi verbi')
    : `Coniugazione · ${tenseKeys.length>1 ? 'Mix' : tenseLabelRu(tenseKeys[0])}`;
  const stage = header(titolo, {narrow:true});
  const bar = progressBar(stage);
  const wrap = $(`<div class="list" style="gap:12px"></div>`); stage.appendChild(wrap);

  function show(){
    if(i>=deck.length) return finish(stage, `${correct} / ${deck.length}`, ()=>runConjugation(tenseFilter, verbiPool));
    bar.style.width=(i/deck.length*100)+"%"; bar.setNum(i, deck.length);
    const q = deck[i];
    wrap.innerHTML = "";
    // Il verbo russo (infinito + traslitterazione) resta nascosto finché non si
    // risponde: mostriamo solo il significato, così non si indovina la forma.
    const card = $(`<div class="qcard">
        <div class="kick">${tenseLabelRu(q.tk)}</div>
        <div class="big-it"></div>
        <div class="qsub">Coniuga il verbo per questo pronome</div>
        <div class="blank"><span class="pron"></span><span class="line"></span></div>
      </div>`);
    card.querySelector('.big-it').textContent = q.en;
    card.querySelector('.pron').textContent = q.pron;
    wrap.appendChild(card);
    const useKbd = settings().kbd;
    const inp = $(`<input class="winput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        inputmode="${useKbd?"none":"text"}" lang="ru" placeholder="${useKbd?"scrivi con la tastiera qui sotto":"scrivi la forma in cirillico…"}" style="margin-top:0">`);
    wrap.appendChild(inp);
    const fb = $(`<div class="fb"></div>`);
    wrap.appendChild(fb);
    let answered = false;
    const kbd = useKbd ? makeCyrKeyboard(inp, ()=>{}, ()=>answered) : null;
    if(kbd) wrap.appendChild(kbd);
    const btn = $(`<button class="btn primary block" type="button">Controlla</button>`);
    wrap.appendChild(btn);

    function next(){ i++; show(); }
    function check(){
      const val = normConj(inp.value);
      if(!val) return;
      answered = true;
      const target = normConj(q.answer);
      const exact = val===target;
      const loose = normYo(val)===normYo(target);
      const ok = exact || loose;
      grade(q.id, ok); if(ok) correct++;
      haptic(ok);
      inp.readOnly = true;
      inp.classList.add(ok ? 'ok' : 'ko');
      if(exact){
        fb.className = 'fb ok'; fb.innerHTML = `${ic('check')} Corretto!`;
      } else if(loose){
        fb.className = 'fb near'; fb.innerHTML = `Quasi! Attenzione alla ё: <b>${esc(q.answer)}</b>`;
      } else {
        fb.className = 'fb no'; fb.innerHTML = `La risposta giusta è <b>${esc(q.answer)}</b>`;
      }
      speak(q.answer);
      if(kbd) kbd.style.display = 'none';

      // Reveal: infinito russo + traslitterazione + tabella coniugazioni completa
      const reveal = $(`<div class="reveal"><div class="reveal-head">
          <button class="speak" type="button" aria-label="Ascolta l'infinito">${ic('vol')}</button>
          <div style="flex:1;min-width:0"><div class="inf"></div>${q.translit_inf ? `<div class="tr"></div>` : ''}<div class="it"></div></div>
        </div></div>`);
      reveal.querySelector('.inf').textContent = q.inf;
      if(q.translit_inf) reveal.querySelector('.tr').textContent = q.translit_inf;
      reveal.querySelector('.it').textContent = q.en || '';
      reveal.querySelector('.speak').onclick = ()=>speak(q.inf);
      reveal.appendChild(makeVerbConjBlock(q.verb, true, q.tk));
      wrap.insertBefore(reveal, btn);
      wrap.insertBefore(azioniTesto(q.answer, `${q.en} — ${q.pron}`, {verbo:q.verb}), btn);

      btn.innerHTML = `${i+1<deck.length ? 'Avanti' : 'Risultato'} →`;
      btn.onclick = next;
    }
    btn.onclick = check;
    inp.addEventListener("keydown", e=>{
      if(e.key!=="Enter") return;
      e.preventDefault();
      answered ? next() : check();
    });
    setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} }, 60);
  }
  show();
}

// ---------- 4. CIRILLICO ----------
function runCyr(){
  const stage = header('Cirillico');
  stage.appendChild($(`<p class="sg-intro">33 lettere: tocca una lettera per sentirne la pronuncia. Quando ti senti pronto, mettiti alla prova col quiz.</p>`));
  const quiz = $(`<button class="btn blue block" type="button">${ic('quiz')} Quiz: riconosci le lettere</button>`);
  quiz.onclick = ()=>navigateTo(runCyrQuiz);
  stage.appendChild(quiz);

  const grid = $(`<div class="alpha-grid"></div>`);
  (DB.alfabeto||[]).forEach(l => {
    const upper = l.ru.split(" ")[0];
    const card = $(`
      <button class="alpha-card" type="button">
        <span class="alpha-letter">${l.ru}</span>
        <span class="alpha-translit">${l.translit}</span>
        <span class="alpha-sound">${l.suono}</span>
      </button>`);
    card.onclick = () => {
      speak(upper); haptic(true);
      grid.querySelectorAll('.playing').forEach(x=>x.classList.remove('playing'));
      card.classList.add('playing');
      setTimeout(()=>card.classList.remove('playing'), 900);
    };
    grid.appendChild(card);
  });
  stage.appendChild(grid);
}

// Quiz sull'alfabeto: dalla lettera al suono e dal suono alla lettera.
// I segni duro e molle (senza suono proprio) restano fuori.
function runCyrQuiz(){
  const lett = (DB.alfabeto||[]).filter(l=>/[a-zà-ž]/i.test(l.translit));
  const qs = sample(lett, Math.min(12, lett.length)).map((l,k)=>{
    const others = sample(lett.filter(x=>x!==l), 3);
    if(k % 2 === 0){
      return {q:l.ru, sub:'Come si legge questa lettera?', correct:l.translit,
              opts:shuffle([l.translit, ...others.map(o=>o.translit)]), speak:l.ru.split(' ')[0], speakAfter:true};
    }
    return {q:l.translit, sub:l.suono, correct:l.ru,
            opts:shuffle([l.ru, ...others.map(o=>o.ru)]), speak:l.ru.split(' ')[0], speakAfter:true};
  });
  runMCQ(qs, 'Quiz alfabeto', runCyrQuiz);
}

// Domande a scelta multipla dai drill di una o più regole
function gramQuestions(regole){
  const qs=[];
  regole.forEach(g=>{
    (g.drill||[]).forEach(d=>{
      const wrong = [...new Set(g.drill.filter(x=>x.risposta!==d.risposta).map(x=>x.risposta))];
      qs.push({ q:d.domanda, sub:g.titolo, correct:d.risposta, opts: shuffle([d.risposta, ...sample(wrong,3)]).slice(0,4) });
    });
  });
  return qs;
}
function runGram(scrollToId){
  const stage = header('Grammatica');
  const regole = DB.grammatica || [];
  const startAll = ()=>navigateTo(function quizAll(){ runMCQ(shuffle(gramQuestions(regole)).slice(0,10), "Quiz di grammatica", quizAll); });
  const top = $(`<button class="btn primary block" type="button">${ic('quiz')} Quiz su tutte le regole</button>`);
  top.onclick = startAll;
  stage.appendChild(top);
  // mostra le schede-regola, ognuna col suo quiz mirato
  regole.forEach((g,k)=>{
    const card = $(`<div class="gram-card" id="gc-${g.id}"><div class="gram-n">Regola ${k+1}</div><h3>${g.titolo}</h3><p>${g.spiegazione}</p></div>`);
    if((g.drill||[]).length >= 2){
      const b = $(`<button class="textbtn" type="button" style="margin:10px 0 -6px -10px">${ic('quiz')} Quiz su questa regola (${g.drill.length})</button>`);
      b.onclick = ()=>navigateTo(function quizOne(){ runMCQ(shuffle(gramQuestions([g])), g.titolo, quizOne); });
      card.appendChild(b);
    }
    stage.appendChild(card);
  });
  const bottom = $(`<button class="btn primary block" type="button">${ic('quiz')} Quiz su tutte le regole</button>`);

  if(scrollToId){

      if(el) el.scrollIntoView({behavior:"smooth",block:"start"});

  }
}

// ---------- 6. FRASI & ASCOLTO ----------
// opts.pool  → mazzo di frasi già scelto (es. le frasi salvate negli Esercizi):
//              si saltano picker e filtro per difficoltà.
// opts.titolo → titolo dell'esercizio.
function runPhrase(level, opts){
  const custom = opts && opts.pool && opts.pool.length ? opts.pool : null;
  const LIVELLI = [
    [1,'🌱','Facile','Frasi semplici, vocabolario di base'],
    [2,'🌿','Medio','Frasi di complessità media'],
    [3,'🌳','Difficile','Frasi avanzate'],
    [0,'🎲','Mix','Livelli misti, scelti a caso'],
  ];
  // Picker livello di difficoltà
  if(level === undefined && !custom){
    const stage = header('Frasi & ascolto');
    stage.appendChild($(`<p class="sg-intro">Ascolta la frase e scegli la parola che manca. Dopo la risposta vedi anche la pronuncia.</p>`));
    const list = $(`<div class="list"></div>`);
    LIVELLI.forEach(([lvl,ico,label,desc])=>{
      const n = lvl===0 ? (DB.frasi||[]).length : (DB.frasi||[]).filter(f=>f.difficolta===lvl).length;
      const btn=$(`<button class="tile wide" type="button"><div class="ico">${ico}</div>
        <div class="txt"><div class="t">${label}</div><div class="d">${desc} &middot; ${plur(n,'frase','frasi')}</div></div></button>`);
      btn.onclick=()=>navigateTo(()=>runPhrase(lvl));
      list.appendChild(btn);
    });
    stage.appendChild(list);
    return;
  }

  // Parole funzione russe: non vanno mascherate né usate come distrattori
  const SKIP = new Set(['и','в','во','не','на','я','что','с','со','а','то','он','она','оно','они','мы','ты','вы','так','его','её','но','да','к','у','же','за','по','от','о','об','из','до','для','это','этот','эта','эти','мой','моя','моё','твой','твоя','наш','ваш','как','где','кто','чем','уже','или','ни','был','была','было','были','есть','вот','там','здесь','тоже','очень','ещё','нет','бы','ли','тем','чем']);

  // Corpus di parole "piene" da frasi + voci per i distrattori
  const corpusWords = [...new Set([
    ...(DB.frasi||[]).flatMap(f=>(f.ru||'').replace(/[.!?,;:—]/g,'').split(' ').map(w=>w.trim())),
    ...(custom||[]).flatMap(f=>(f.ru||'').replace(/[.!?,;:—]/g,'').split(' ').map(w=>w.trim())),
    ...(DB.voci||[]).map(v=>(v.ru||'').replace(/[.,!?;:]/g,'').split(' ')[0])
  ].filter(w=>w.length>=3 && /[а-яё]/i.test(w) && !SKIP.has(w.toLowerCase())))];

  // Distrattori plausibili: stessa radice > parole del deck > stessa desinenza > lunghezza simile
  function pickDistractors(answer, exclude, deckWords){
    const lo = answer.toLowerCase();
    const excl = new Set([...exclude].map(w=>w.toLowerCase()));
    excl.add(lo);
    const ok = w => !excl.has(w.toLowerCase());

    // Tier 1: stessa radice (es. говорю → говоришь, говорит) — forma diversa della stessa parola
    const rootLen = Math.min(4, lo.length - 1);
    const root = lo.slice(0, rootLen);
    const t1 = corpusWords.filter(w => ok(w) && w.toLowerCase().startsWith(root));
    // Tier 2: parole dalle ALTRE frasi del deck corrente — contestualmente plausibili
    const t2 = (deckWords||[]).filter(ok);
    // Tier 3: stessa desinenza 3 char (stessa forma grammaticale)
    const e3 = lo.slice(-3);
    const t3 = corpusWords.filter(w => ok(w) && w.toLowerCase().slice(-3)===e3);
    // Tier 4: stessa desinenza 2 char
    const e2 = lo.slice(-2);
    const t4 = corpusWords.filter(w => ok(w) && w.toLowerCase().slice(-2)===e2);
    // Tier 5: lunghezza simile (±1)
    const t5 = corpusWords.filter(w => ok(w) && Math.abs(w.length-answer.length)<=1);

    const result = [];
    const picked = new Set();
    for(const tier of [t1, t2, t3, t4, t5, corpusWords]){
      for(const w of shuffle([...new Set(tier)])){
        if(result.length>=3) break;
        if(!picked.has(w.toLowerCase()) && ok(w)){
          result.push(w);
          picked.add(w.toLowerCase());
        }
      }
      if(result.length>=3) break;
    }
    return result;
  }

  const allFrasi = custom || DB.frasi || [];
  const filtered = custom || (level===0 ? allFrasi : allFrasi.filter(f=>f.difficolta===level));
  const pool = filtered.length ? filtered : allFrasi;
  // Il mazzo personalizzato si allena per intero; altrimenti 8 frasi a caso.
  const deck = custom ? shuffle([...pool]) : sample(pool, Math.min(8, pool.length));
  if(!deck.length) return;
  let i=0, correct=0;
  const livello = (LIVELLI.find(l=>l[0]===level)||[])[2];
  const stage = header((opts && opts.titolo) || (livello ? `Frasi & ascolto · ${livello}` : 'Frasi & ascolto'), {narrow:true});
  const bar = progressBar(stage);
  const wrap = $(`<div class="list" style="gap:12px"></div>`); stage.appendChild(wrap);

  let onKey = null;
  const stopKeys = ()=>{ if(onKey) document.removeEventListener('keydown', onKey); onKey = null; };
  function show(){
    if(i>=deck.length){ stopKeys(); return finish(stage, `${correct} / ${deck.length}`, ()=>runPhrase(level, opts)); }
    bar.style.width=(i/deck.length*100)+"%"; bar.setNum(i, deck.length);
    const f=deck[i];
    const sentence = f.ru || '';
    const rawWords = sentence.replace(/[.!?]/g,'').split(' ');
    const clean = rawWords.map(w=>w.replace(/[.,!?;:]/g,''));

    // Preferisci parole "piene" (lunghe ≥4, non parole funzione)
    const candidates = clean.map((w,idx)=>({w,idx}))
      .filter(({w})=>w.length>=4 && /[а-яё]/i.test(w) && !SKIP.has(w.toLowerCase()));
    // Se non c'è nessuna parola "piena" (frasi cortissime come «Это дом.»)
    // si nasconde comunque la parola russa più lunga, non la prima a caso.
    const fallback = clean.map((w,idx)=>({w,idx}))
      .filter(({w})=>/[а-яё]/i.test(w))
      .sort((a,b)=>(SKIP.has(a.w.toLowerCase())-SKIP.has(b.w.toLowerCase())) || (b.w.length-a.w.length))[0]
      || {w: clean[0], idx: 0};
    const {w: answer, idx: hideIdx} = candidates.length
      ? candidates[Math.floor(Math.random()*candidates.length)]
      : fallback;

    const masked = rawWords.map((w,idx)=>idx===hideIdx?"_____":esc(w)).join(" ");
    const deckWords = deck
      .filter(d=>d.id!==f.id)
      .flatMap(d=>(d.ru||'').replace(/[.!?,;:—]/g,'').split(' ').map(w=>w.replace(/[.,!?;:]/g,'')))
      .filter(w=>w.length>=4 && /[а-яё]/i.test(w) && !SKIP.has(w.toLowerCase()));
    const distract = pickDistractors(answer, new Set(clean), deckWords);
    const choices = shuffle([answer, ...distract]);

    wrap.innerHTML="";
    const card = $(`<div class="qcard">
        <div class="q">${masked}</div>
        <div class="qsub"></div>
        <button class="btn soft sm listen-btn" type="button" style="margin-top:6px">${ic('vol')} Ascolta la frase</button>
      </div>`);
    card.querySelector('.qsub').textContent = f.it || '';
    card.querySelector('.q').style.fontSize = Math.max(21, 30 - Math.max(0, sentence.length-16)*0.45) + 'px';
    card.querySelector('.listen-btn').onclick = ()=>speak(sentence);
    wrap.appendChild(card);
    const optBox=$(`<div class="options"></div>`);
    let answered = false;
    function pick(b, o){
      if(answered) return;
      answered = true;
      [...optBox.children].forEach(c=>c.disabled=true);
      const ok = o===answer;
      b.classList.add(ok?"correct":"wrong");
      if(!ok) [...optBox.children].find(c=>c.dataset.v===answer).classList.add("correct");
      if(ok) correct++;
      haptic(ok);
      grade(f.id, ok);
      speak(sentence);
      card.querySelector('.q').innerHTML = rawWords.map((w,idx)=>idx===hideIdx?`<span style="color:var(--good)">${esc(w)}</span>`:esc(w)).join(" ");
      // Rivela la traslitterazione completa solo dopo la risposta
      if(f.translit) card.appendChild($(`<div class="qsub" style="color:var(--accent2);font-style:italic">${esc(f.translit)}</div>`));
      card.appendChild(azioniTesto(sentence, f.it, {translit:f.translit}));
      const next=$(`<button class="btn primary block" type="button">${i+1<deck.length?'Continua':'Risultato'} →</button>`);
      next.onclick=()=>{i++; show();}; wrap.appendChild(next);
    }
    choices.forEach((o,k)=>{
      const b=$(`<button class="opt" type="button"><span class="kn">${k+1}</span></button>`);
      b.dataset.v = o;
      b.appendChild(document.createTextNode(o));
      b.onclick=()=>pick(b, o);
      optBox.appendChild(b);
    });
    wrap.appendChild(optBox);
    // tastiera: 1-4 sceglie, invio prosegue
    stopKeys();
    onKey = e=>{
      if(!answered){ const k = parseInt(e.key,10); if(k>=1 && k<=choices.length) optBox.children[k-1].click(); }
      else if(e.key==='Enter'){ const n = wrap.querySelector('.btn.primary'); if(n){ e.preventDefault(); n.click(); } }
    };
    document.addEventListener('keydown', onKey);
  }
  onLeave(stopKeys);
  show();
}

// ---------- motore quiz a scelta multipla ----------
// Domanda: {q | qHtml, sub, correct, opts, speak?, speakAfter?, listen?, after?, id?}
// listen = testo del pulsante «Ascolta» (se diverso da quello letto dopo la
// risposta); after = nota che compare dopo aver risposto.
// hooks.onAnswer(Q, ok) a ogni risposta, hooks.onEnd(giuste, totale) alla fine.
function runMCQ(questions, title, restart, hooks){
  hooks = hooks || {};
  let i=0, correct=0;
  const stage = header(title, {narrow:true});
  if(!questions.length) return emptyDone(stage, '🤷', 'Niente da chiedere', 'Qui non ci sono domande, per ora.');
  const bar = progressBar(stage);
  const wrap = $(`<div class="list" style="gap:12px"></div>`); stage.appendChild(wrap);
  let onKey = null;
  const stopKeys = ()=>{ if(onKey) document.removeEventListener('keydown', onKey); onKey = null; };
  function show(){
    if(i>=questions.length){
      stopKeys();
      if(hooks.onEnd) hooks.onEnd(correct, questions.length);
      return finish(stage, `${correct} / ${questions.length}`, restart);
    }
    bar.style.width=(i/questions.length*100)+"%"; bar.setNum(i, questions.length);
    const Q=questions[i];
    wrap.innerHTML="";
    const card = $(`<div class="qcard"><div class="q"></div><div class="qsub"></div></div>`);
    const qEl = card.querySelector('.q');
    if(Q.qHtml){ qEl.innerHTML = Q.qHtml; qEl.classList.add('q-html'); }
    else {
      qEl.textContent = Q.q;
      // le domande lunghe (frasi intere) si rimpiccioliscono un po'
      qEl.style.fontSize = Math.max(20, 30 - Math.max(0, String(Q.q).length-12)*0.8) + 'px';
    }
    card.querySelector('.qsub').textContent = Q.sub || '';
    const ascolta = Q.listen || (Q.speak && !Q.speakAfter ? Q.speak : null);
    if(ascolta){
      const sp=$(`<button class="btn soft sm listen-btn" type="button">${ic('vol')} Ascolta</button>`);
      sp.onclick=()=>speak(ascolta); card.appendChild(sp);
    }
    wrap.appendChild(card);
    const box=$(`<div class="options"></div>`);
    let answered = false;
    Q.opts.forEach((o,k)=>{
      const b=$(`<button class="opt${String(o).length>24?' long':''}" type="button"><span class="kn">${k+1}</span></button>`);
      b.dataset.v = o;
      b.appendChild(document.createTextNode(o));
      b.onclick=()=>{
        if(answered) return;
        answered = true;
        [...box.children].forEach(c=>c.disabled=true);
        const ok=o===Q.correct;
        b.classList.add(ok?"correct":"wrong");
        haptic(ok);
        if(ok) correct++;
        else [...box.children].find(c=>c.dataset.v===Q.correct).classList.add("correct");
        if(Q.id) grade(Q.id, ok);
        if(!ok && Q.err) logErrore(Q.err.ru, Q.err.it, Q.err.fonte);
        if(hooks.onAnswer) hooks.onAnswer(Q, ok);
        else if(!Q.id) recordActivity(ok);
        if(Q.speak) speak(Q.speak);
        if(Q.after){ const a = $(`<div class="qsub q-after"></div>`); a.textContent = Q.after; card.appendChild(a); }
        const fr = Q.frase===false ? null : (Q.frase || Q.err);
        if(fr && fr.ru) card.appendChild(azioniTesto(fr.ru, fr.it));
        const next=$(`<button class="btn primary block" type="button">${i+1<questions.length?"Avanti":"Risultato"} →</button>`);
        next.onclick=()=>{i++; show();}; wrap.appendChild(next);
      };
      box.appendChild(b);
    });
    wrap.appendChild(box);
    stopKeys();
    onKey = e=>{
      if(!answered){ const k = parseInt(e.key,10); if(k>=1 && k<=Q.opts.length) box.children[k-1].click(); }
      else if(e.key==='Enter'){ const n = wrap.querySelector('.btn.primary'); if(n){ e.preventDefault(); n.click(); } }
    };
    document.addEventListener('keydown', onKey);
  }
  onLeave(stopKeys);
  show();
}

// ---------- schermata fine ----------
// score: "x / y" (anello con la percentuale) oppure un testo libero.
// info.titolo / info.testo sostituiscono i testi automatici.
function finish(stage, score, restart, info){
  info = info || {};
  const m = String(score).match(/(\d+)\s*\/\s*(\d+)/);
  let topHtml = `<div class="big">🎉</div>`, pct = null;
  if(m){
    const got=+m[1], tot=+m[2];
    pct = tot ? Math.round(got/tot*100) : 0;
    const col = pct>=80 ? 'var(--good)' : pct>=50 ? 'var(--accent2)' : 'var(--accent)';
    topHtml = `<div class="ring" style="--col:${col};background:conic-gradient(${col} ${pct*3.6}deg,var(--card3) 0)"><span>${pct}%</span></div>`;
  }
  const titolo = info.titolo || (pct===null ? String(score)
    : pct>=90 ? 'Eccellente!' : pct>=70 ? 'Ottimo lavoro!' : pct>=50 ? 'Buon allenamento!' : 'Continua così!');
  const testo = info.testo || (m ? `${m[1]} risposte giuste su ${m[2]}.` : '');
  stage.innerHTML = `
    <div class="done">
      ${topHtml}
      <h2>${titolo}</h2>
      <p class="muted" style="margin:0">${testo}${testo?'<br>':''}I progressi sono salvati sul dispositivo.</p>
    </div>`;
  haptic(true);
  if(pct!==null && pct>=80) confetti(stage.querySelector('.done'));
  const row=$(`<div class="row"></div>`);
  const a=$(`<button class="btn" type="button">${ic('back')} Indietro</button>`); a.onclick=goBack;
  const b=$(`<button class="btn primary" type="button">${ic('refresh')} Ancora</button>`); b.onclick=restart;
  row.appendChild(a); row.appendChild(b); stage.appendChild(row);
  const passo = passoCompletato(pct);
  if(passo){ stage.appendChild(passoBox(passo)); if(passo.tappaFinita) confetti(stage.querySelector('.done')); }
  window.scrollTo({top:0, behavior:'smooth'});
}

// Dialoghi ascoltati/recitati, numeri e frasi composte, parola del giorno.
// Un solo oggetto in localStorage (entra nel backup: prefisso "russo_").
const EXTRA_KEY = "russo_extra_v1";
function extraStore(){
  try{ const s = JSON.parse(localStorage.getItem(EXTRA_KEY)||"{}"); return s && typeof s==="object" ? s : {}; }
  catch(e){ return {}; }
}
function updExtra(fn){
  const s = extraStore(); fn(s);
  try{ localStorage.setItem(EXTRA_KEY, JSON.stringify(s)); }catch(e){}
  return s;
}
const contaExtra = (campo, ok) => { if(ok) updExtra(s=>{ s[campo] = (s[campo]||0) + 1; }); };

// Le sezioni nuove hanno l'etichetta «Nuovo» in home finché non si aprono.
const NUOVE_SEZIONI = ["dialoghi","frasario","compose","numeri","percorso","letture","cultura","palestra","lampo"];
function sezioniViste(){ try{ return JSON.parse(localStorage.getItem("russo_sezioni_viste")||"[]"); }catch(e){ return []; } }
function segnaSezioneVista(mode){
  if(!NUOVE_SEZIONI.includes(mode)) return;
  const v = sezioniViste();
  if(!v.includes(mode)){ v.push(mode); try{ localStorage.setItem("russo_sezioni_viste", JSON.stringify(v)); }catch(e){} }
}

// ---------- Voci per i dialoghi ----------
// Ogni personaggio parla con una voce sua: se il telefono ha due voci russe
// le usa entrambe, altrimenti alza il tono della seconda.
function utterRu(text, who){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ru-RU"; u.rate = settings().ttsRate;
  const altra = who === "B" && ruVoices.length > 1 ? ruVoices.find(v=>v !== ruVoice) : null;
  if(altra) u.voice = altra;
  else { if(ruVoice) u.voice = ruVoice; if(who === "B") u.pitch = 1.3; }
  return u;
}
// Legge una battuta e poi chiama onDone. Una nuova lettura (anche da speak())
// annulla la callback di quella precedente; se il browser non avvisa della
// fine, un tempo massimo stimato fa andare avanti comunque.
function speakAs(text, who, onDone){
  const gen = ++_ttsGen;
  if(!("speechSynthesis" in window)){ if(onDone) setTimeout(()=>{ if(gen===_ttsGen) onDone(); }, 600); return; }
  speechSynthesis.cancel();
  const u = utterRu(text, who);
  let fatto = false, timer = null;
  const fine = ()=>{ if(fatto) return; fatto = true; clearTimeout(timer); if(gen===_ttsGen && onDone) onDone(); };
  timer = setTimeout(fine, 1800 + text.length * 120 / (u.rate || 1));
  u.onend = fine; u.onerror = fine;
  speechSynthesis.speak(u);
}
function stopSpeech(){ _ttsGen++; try{ speechSynthesis.cancel(); }catch(e){} }

// ---------- Riconoscimento vocale (dove c'è: Chrome, Safari) ----------
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
function ascoltaRusso(onFine, onParziale){
  const rec = new SpeechRec();
  rec.lang = "ru-RU"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let testo = "", errore = null;
  rec.onresult = e=>{
    testo = "";
    for(let i=0; i<e.results.length; i++) testo += e.results[i][0].transcript;
    if(onParziale) onParziale(testo);
  };
  rec.onerror = e=>{ errore = e.error || "errore"; };
  rec.onend = ()=>onFine(testo.trim(), errore);
  try{ rec.start(); }catch(e){ setTimeout(()=>onFine("", "start"), 0); }
  return rec;
}
// Confronta ciò che si è detto con la battuta: parola per parola, ignorando
// maiuscole, punteggiatura e ё/е. Le cifre del riconoscitore ("320")
// diventano parole ("триста двадцать").
function confrontaDetto(detto, atteso){
  const norm = s => normYo(String(s).toLowerCase())
    .replace(/\d+/g, n=>" "+numRu(+n)+" ")
    .replace(/[^а-я0-9\s-]/g," ").split(/\s+/).filter(Boolean);
  const detti = new Set(norm(detto));
  let ok = 0, tot = 0;
  const html = String(atteso).split(/\s+/).map(w=>{
    const n = norm(w);
    if(!n.length) return esc(w);
    tot++;
    const hit = n.every(x=>detti.has(x));
    if(hit) ok++;
    return `<span class="${hit?'ok':'no'}">${esc(w)}</span>`;
  }).join(" ");
  return {html, pct: tot ? Math.round(ok/tot*100) : 0};
}

// Scene di tutti i giorni (bar, albergo, stazione…): si ascoltano con due
// voci, si leggono con la traduzione e si recitano facendo una delle parti.
function dlgStato(id){ return ((extraStore().dlg)||{})[id] || {}; }
function segnaDialogo(id, campo){
  updExtra(s=>{ s.dlg = s.dlg || {}; const d = s.dlg[id] || {}; d[campo] = (d[campo]||0) + 1; s.dlg[id] = d; });
}
// La parte "mia": quella di «Вы»; se entrambi hanno un nome, la B (l'italiano).
function dlgMio(d){ const r = d.ruoli || {}; return r.A === "Вы" ? "A" : "B"; }
function nomeRuolo(d, r){ const n = (d.ruoli||{})[r] || r; return n === "Вы" ? "Tu" : n; }

  [[1,'Primi passi'],[2,'Un po\' più lunghi']].forEach(([lv, lab])=>{

                  : st.a ? `<span class="pill blue">Ascoltato</span>` : '';

        <div class="txt"><div class="t"><span></span> <span class="tru"></span></div><div class="d"></div></div>${badge?`<div class="right">${badge}</div>`:''}</button>`);

function runDialogo(d){
  const stage = header(d.titolo, {narrow:true});
  const mio = dlgMio(d);

  const hero = $(`<div class="dlg-hero"><div class="e">${d.icona||'💬'}</div>
    <div class="tx"><button class="ru" type="button" title="Ascolta"><span></span>${ic('vol')}</button><p></p></div></div>`);
  hero.querySelector('.ru span').textContent = d.titoloRu;
  hero.querySelector('p').textContent = d.scena || '';
  hero.querySelector('.ru').onclick = ()=>{ stopPlay(); speak(d.titoloRu); };
  stage.appendChild(hero);

  const bar = $(`<div class="dlg-bar"></div>`);
  const playBtn = $(`<button class="btn blue sm" type="button"></button>`);
  const trBtn = $(`<button class="btn soft sm" type="button"></button>`);
  bar.append(playBtn, trBtn);
  stage.appendChild(bar);

  const chat = $(`<div class="chat"></div>`);
  const bubs = d.battute.map((b,k)=>{
    const el = $(`<div class="bub${b.s===mio?' me':''}" role="button" tabindex="0"><div class="who"><span></span></div><div class="ru"></div><div class="it"></div></div>`);
    el.querySelector('.who span').textContent = nomeRuolo(d, b.s);
    el.querySelector('.who').appendChild(lensBtn(b.ru, b.it));
    el.querySelector('.ru').textContent = b.ru;
    el.querySelector('.it').textContent = b.it;
    el.style.animationDelay = Math.min(k*35, 400) + 'ms';
    el.onclick = ()=>{ stopPlay(); mark(k); speakAs(b.ru, b.s, ()=>mark(-1)); };
    el.onkeydown = e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); el.onclick(); } };
    chat.appendChild(el);
    return el;
  });
  stage.appendChild(chat);

  // Traduzione visibile o nascosta (la scelta resta per i dialoghi successivi)
  let showIt = settings().dlgIt !== false;
  function paintTr(){
    chat.classList.toggle('no-it', !showIt);
    trBtn.innerHTML = `${ic('eye')} ${showIt ? 'Nascondi traduzione' : 'Mostra traduzione'}`;
  }
  trBtn.onclick = ()=>{ showIt = !showIt; setSetting('dlgIt', showIt); paintTr(); };
  paintTr();

  // Ascolta tutto: una battuta dopo l'altra, evidenziata mentre parla
  let playTok = 0, playing = false;
  function mark(k){ bubs.forEach((b,i)=>b.classList.toggle('playing', i===k)); }
  function paintPlay(){ playBtn.innerHTML = playing ? `${ic('stop')} Ferma` : `${ic('play')} Ascolta tutto`; }
  function stopPlay(){ playTok++; playing = false; mark(-1); paintPlay(); }
  function playAll(){
    const tok = ++playTok; playing = true; paintPlay();
    let k = 0;
    const step = ()=>{
      if(tok!==playTok) return;
      if(k>=d.battute.length){ playing = false; mark(-1); paintPlay(); segnaDialogo(d.id, 'a'); return; }
      mark(k);
      bubs[k].scrollIntoView({block:'nearest', behavior:'smooth'});
      const b = d.battute[k];
      speakAs(b.ru, b.s, ()=>{ if(tok!==playTok) return; k++; setTimeout(step, 420); });
    };
    step();
  }
  playBtn.onclick = ()=>{ if(playing){ stopPlay(); stopSpeech(); } else playAll(); };
  paintPlay();
  onLeave(()=>{ playTok++; stopSpeech(); });

  // Frasi chiave e nota culturale
  if(d.parole && d.parole.length){
    const kw = $(`<div class="pcard"><h3>${ic('key')} Frasi chiave</h3><div class="kw-list"></div></div>`);
    d.parole.forEach(p=>kw.querySelector('.kw-list').appendChild(kwRow(p.ru, p.it, {tema:`Dialogo: ${d.titolo}`})));
    stage.appendChild(kw);
  }
  if(d.nota) stage.appendChild($(`<div class="nota-box">${ic('bulb')}<div>${esc(d.nota)}</div></div>`));

  // Mettiti alla prova
  stage.appendChild($(`<div class="sec-h">Mettiti alla prova</div>`));
  const list = $(`<div class="list"></div>`);
  [mio, mio==='A'?'B':'A'].forEach(r=>{
    const nome = nomeRuolo(d, r);
    const t = $(`<button class="tile wide" type="button"><div class="ico">${r===mio?'🎭':'🔁'}</div>
      <div class="txt"><div class="t"></div><div class="d"></div></div></button>`);
    t.querySelector('.t').textContent = nome==='Tu' ? 'Recita la tua parte' : `Recita la parte di ${nome}`;
    t.querySelector('.d').textContent = `L'altro parla, tu rispondi in russo${SpeechRec?' (anche a voce)':''}`;
    t.onclick = ()=>{ stopPlay(); stopSpeech(); navigateTo(()=>runRecita(d, r)); };
    list.appendChild(t);
  });
  const quiz = $(`<button class="tile wide" type="button"><div class="ico">💡</div>
    <div class="txt"><div class="t">Cosa rispondi?</div><div class="d">Scegli la battuta giusta per continuare il dialogo</div></div></button>`);
  quiz.onclick = ()=>{ stopPlay(); stopSpeech(); navigateTo(()=>runDlgQuiz(d)); };
  list.appendChild(quiz);
  stage.appendChild(list);

  // Le mie battute negli esercizi (scheda Frasi)
  const mie = d.battute.map((b,k)=>({b,k})).filter(({b})=>b.s===mio && b.ru.split(/\s+/).length>=2)
    .map(({b,k})=>({id:`d-${d.id}-${k}`, ru:b.ru, it:b.it, tema:`Dialogo: ${d.titolo}`}));
  if(mie.length){
    const save = $(`<button class="add-flash-btn" type="button" style="align-self:center"></button>`);
    const paint = ()=>{
      const tutte = mie.every(f=>isEsesFrase(fraseEseId(f)));
      save.innerHTML = tutte ? `${ic('check')} Le tue frasi sono negli esercizi` : `${ic('plus')} Salva le tue ${mie.length} frasi negli esercizi`;
      save.classList.toggle('added', tutte); save.disabled = tutte;
    };
    save.onclick = ()=>{ mie.forEach(f=>addEsesFrase(f)); paint(); haptic(true); };
    paint();
    stage.appendChild(save);
  }
}

// Recita: le battute dell'altro le legge il telefono, le tue le dici tu.
function runRecita(d, ruolo){
  const stage = header(`Recita · ${d.titolo}`, {narrow:true});
  const nome = nomeRuolo(d, ruolo);
  stage.appendChild($(`<p class="sg-intro">${nome==='Tu' ? 'Fai la tua parte' : `Sei <b>${esc(nome)}</b>`}: quando tocca a te leggi l'italiano e dillo in russo${SpeechRec ? ' — tocca <b>Parla</b> e il telefono ti ascolta' : ' ad alta voce'}. Poi controlla.</p>`));
  const bar = progressBar(stage);
  const chat = $(`<div class="chat"></div>`); stage.appendChild(chat);
  const ctrl = $(`<div class="rp-ctrl"></div>`); stage.appendChild(ctrl);
  const n = d.battute.length;
  let k = 0, tok = 0, rec = null, parlate = 0, capite = 0;
  const stopRec = ()=>{ if(rec){ try{ rec.abort(); }catch(e){} rec = null; } };
  onLeave(()=>{ tok++; stopSpeech(); stopRec(); });
  const scorri = el => requestAnimationFrame(()=>el.scrollIntoView({block:'center', behavior:'smooth'}));

  function bolla(b, mia){
    const el = $(`<div class="bub${mia?' me':''}"><div class="who"><span></span></div><div class="ru"></div><div class="it"></div></div>`);
    el.querySelector('.who span').textContent = nomeRuolo(d, b.s);
    el.querySelector('.who').appendChild(lensBtn(b.ru, b.it));
    el.querySelector('.ru').textContent = b.ru;
    el.querySelector('.it').textContent = b.it;
    return el;
  }
  function next(){
    const my = ++tok;
    bar.style.width = (k/n*100)+'%'; bar.setNum(Math.min(k, n-1), n);
    ctrl.innerHTML = '';
    if(k>=n) return fine();
    const b = d.battute[k];
    if(b.s !== ruolo){
      const el = bolla(b, false);
      el.classList.add('playing');
      chat.appendChild(el); scorri(el);
      const salta = $(`<button class="textbtn" type="button" style="align-self:center">Salta ›</button>`);
      salta.onclick = ()=>{ stopSpeech(); el.classList.remove('playing'); k++; next(); };
      ctrl.appendChild(salta);
      speakAs(b.ru, b.s, ()=>{ if(my!==tok) return; el.classList.remove('playing'); k++; setTimeout(()=>{ if(my===tok) next(); }, 380); });
      return;
    }
    // tocca a te
    const el = $(`<div class="bub me turn"><div class="who"></div><div class="hint"></div><div class="heard"></div></div>`);
    el.querySelector('.who').textContent = `${nomeRuolo(d, b.s)} · tocca a te`;
    el.querySelector('.hint').textContent = `«${b.it}»`;
    chat.appendChild(el); scorri(el);
    const row = $(`<div class="row"></div>`);
    const show = $(`<button class="btn" type="button">${ic('eye')} Mostra</button>`);
    show.onclick = ()=>rivela(null);
    if(SpeechRec){
      const mic = $(`<button class="btn blue" type="button">${ic('mic')} Parla</button>`);
      mic.onclick = ()=>{
        if(rec){ try{ rec.stop(); }catch(e){} return; }
        stopSpeech();
        mic.innerHTML = `${ic('stop')} Ascolto…`; mic.classList.add('rec');
        const heard = el.querySelector('.heard');
        rec = ascoltaRusso((testo, err)=>{
          rec = null;
          if(my!==tok) return;
          mic.innerHTML = `${ic('mic')} Parla`; mic.classList.remove('rec');
          if(testo) rivela(testo);
          else heard.textContent = err==='not-allowed' || err==='service-not-allowed'
            ? 'Microfono non consentito: usa «Mostra».' : 'Non ho sentito: riprova o tocca «Mostra».';
        }, parz=>{ heard.textContent = parz; });
      };
      row.append(mic, show);
    } else {
      show.classList.add('primary');
      row.append(show);
    }
    ctrl.appendChild(row);

    function rivela(detto){
      stopRec();
      el.classList.remove('turn');
      el.innerHTML = `<div class="who"><span></span></div><div class="ru"></div><div class="it"></div>`;
      el.querySelector('.who span').textContent = nomeRuolo(d, b.s);
      el.querySelector('.who').appendChild(lensBtn(b.ru, b.it));
      el.querySelector('.it').textContent = b.it;
      if(detto!=null){
        parlate++;
        const c = confrontaDetto(detto, b.ru);
        const ok = c.pct >= 70;
        if(ok) capite++; else logErrore(b.ru, b.it, 'Recita');
        haptic(ok);
        el.querySelector('.ru').innerHTML = c.html;
        el.classList.add(ok ? 'good' : 'meh');
        const res = $(`<div class="sr-res"></div>`);
        res.textContent = `${ok ? '✓ Bene!' : 'Quasi.'} Hai detto: «${detto}»`;
        el.appendChild(res);
      } else {
        el.querySelector('.ru').textContent = b.ru;
      }
      speakAs(b.ru, b.s);
      ctrl.innerHTML = '';
      const go = $(`<button class="btn primary block" type="button">${k+1<n?'Continua':'Fine'} →</button>`);
      go.onclick = ()=>{ k++; next(); };
      ctrl.appendChild(go);
    }
  }
  function fine(){
    segnaDialogo(d.id, 'r');
    addXP(40);
    recordActivity(true);
    const testo = parlate
      ? `Il telefono ha capito bene ${capite} ${capite===1?'battuta':'battute'} su ${parlate}.`
      : `Hai recitato tutte le battute di «${nomeRuolo(d, ruolo)}».`;
    finish(stage, 'Dialogo completato!', ()=>runRecita(d, ruolo), {titolo:'Dialogo completato! 🎭', testo});
    confetti(stage.querySelector('.done'));
    const altro = ruolo==='A' ? 'B' : 'A';
    const sw = $(`<button class="textbtn" type="button" style="align-self:center">${ic('users')} Ora fai la parte di ${esc(nomeRuolo(d, altro))}</button>`);
    sw.onclick = ()=>runRecita(d, altro);
    stage.appendChild(sw);
  }
  // Chi parla per primo? Se è l'altro, parte subito la sua battuta.
  next();
}

// «Cosa rispondi?»: la battuta dell'altro, poi quattro risposte possibili.
function runDlgQuiz(d){
  const mio = dlgMio(d);
  const mieAltrove = (DB.dialoghi||[]).filter(x=>x.id!==d.id)
    .flatMap(x=>x.battute.filter(b=>b.s===dlgMio(x)).map(b=>b.ru));
  const qs = [];
  d.battute.forEach((b,k)=>{
    if(k===0 || b.s!==mio || d.battute[k-1].s===mio) return;
    const prima = d.battute[k-1];
    const stesse = d.battute.filter((x,j)=>j!==k && x.s===mio && x.ru!==b.ru).map(x=>x.ru);
    const distr = [...new Set([...shuffle(stesse), ...shuffle(mieAltrove)])].filter(x=>x!==b.ru).slice(0,3);
    qs.push({q:prima.ru, sub:`«${prima.it}» — cosa rispondi?`, correct:b.ru, opts:shuffle([b.ru, ...distr]),
             listen:prima.ru, speak:b.ru, after:b.it, err:{ru:b.ru, it:b.it, fonte:'Dialoghi'}});
  });
  const restart = ()=>runDlgQuiz(d);
  runMCQ(qs, `Cosa rispondi? · ${d.titolo}`, restart, {
    onAnswer:(Q, ok)=>recordActivity(ok),
    onEnd:()=>segnaDialogo(d.id, 'q')
  });

// ================= NUMERI =================
const NUM_U = ['ноль','один','два','три','четыре','пять','шесть','семь','восемь','девять'];
const NUM_T = ['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];
const NUM_D = ['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
const NUM_H = ['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
// 1 / 2-4 / 5+ (11-14 fanno parte del terzo gruppo): рубль, рубля, рублей
function pluralRu(n, f){
  const a = Math.abs(n) % 100, b = a % 10;
  if(a>10 && a<20) return f[2];
  if(b===1) return f[0];
  if(b>=2 && b<=4) return f[1];
  return f[2];
}
function _num999(n, fem){
  const out = [], h = Math.floor(n/100), r = n % 100;
  if(h) out.push(NUM_H[h]);
  if(r>=10 && r<20) out.push(NUM_T[r-10]);
  else {
    const dd = Math.floor(r/10), u = r % 10;
    if(dd) out.push(NUM_D[dd]);
    if(u) out.push(fem && u===1 ? 'одна' : fem && u===2 ? 'две' : NUM_U[u]);
  }
  return out;
}
// Numero in lettere (fino a 999 999 999). fem: «одна/две» (минута, тысяча…)
function numRu(n, fem){
  n = Math.floor(Math.abs(+n || 0));
  if(n===0) return 'ноль';
  const mil = Math.floor(n/1e6) % 1000, th = Math.floor(n/1000) % 1000, rest = n % 1000;
  const p = [];
  if(mil) p.push(...(mil===1 ? [] : _num999(mil, false)), pluralRu(mil, ['миллион','миллиона','миллионов']));
  if(th)  p.push(...(th===1 ? [] : _num999(th, true)), pluralRu(th, ['тысяча','тысячи','тысяч']));
  if(rest) p.push(..._num999(rest, fem));
  return p.join(' ');
}
const RUBLI = ['рубль','рубля','рублей'];
const prezzoRu = n => `${numRu(n)} ${pluralRu(n, RUBLI)}`;
// Ore "ufficiali" (le più facili): три часа двадцать минут
function oraRu(h, m){
  const hh = h===1 ? 'час' : `${numRu(h)} ${pluralRu(h, ['час','часа','часов'])}`;
  return m ? `${hh} ${numRu(m, true)} ${pluralRu(m, ['минута','минуты','минут'])}` : hh;
}
// Ore "di tutti i giorni": половина четвёртого, без четверти четыре…
const ORD_GEN = ['','первого','второго','третьего','четвёртого','пятого','шестого','седьмого','восьмого','девятого','десятого','одиннадцатого','двенадцатого'];
const MIN_GEN = {5:'пяти',10:'десяти',15:'четверти',20:'двадцати',25:'двадцати пяти'};
function oraColloquiale(h, m){
  const dopo = h % 12 + 1;
  if(m===0) return null;
  if(m===30) return `половина ${ORD_GEN[dopo]}`;
  if(m===15) return `четверть ${ORD_GEN[dopo]}`;
  if(m<30) return `${numRu(m, true)} ${pluralRu(m, ['минута','минуты','минут'])} ${ORD_GEN[dopo]}`;
  const manca = MIN_GEN[60-m];
  return manca ? `без ${manca} ${dopo===1 ? 'час' : numRu(dopo)}` : null;
}
function clockSVG(h, m){
  const ma = m*6, ha = (h%12)*30 + m*0.5;
  let tk = '';
  for(let i=0; i<60; i++){
    const big = i%5===0, a = i*6*Math.PI/180, r1 = big ? 45 : 48.5, r2 = 52;
    tk += `<line class="${big?'tk':'tk2'}" x1="${(60+r1*Math.sin(a)).toFixed(1)}" y1="${(60-r1*Math.cos(a)).toFixed(1)}" x2="${(60+r2*Math.sin(a)).toFixed(1)}" y2="${(60-r2*Math.cos(a)).toFixed(1)}"/>`;
  }
  const nums = [[12,60,22],[3,98,60],[6,60,98],[9,22,60]].map(([t,x,y])=>`<text x="${x}" y="${y}">${t}</text>`).join('');
  return `<svg class="clock" viewBox="0 0 120 120" aria-label="Orologio: ${h}:${String(m).padStart(2,'0')}">
    <circle class="cf" cx="60" cy="60" r="56"/>${tk}${nums}
    <line class="hh" x1="60" y1="60" x2="60" y2="33" transform="rotate(${ha} 60 60)"/>
    <line class="mh" x1="60" y1="60" x2="60" y2="16" transform="rotate(${ma} 60 60)"/>
    <circle class="cc" cx="60" cy="60" r="4.5"/></svg>`;
}

const NUM_RANGES = [
  ['r20',  '0–20',       0, 20],
  ['r100', '21–100',     21, 100],
  ['r1000','100–1000',   100, 1000],
  ['r10k', '1000–10 000',1000, 10000],
];
function numRange(){ const r = NUM_RANGES.find(x=>x[0]===settings().numRange); return r || NUM_RANGES[1]; }
const rnd = (a, b) => a + Math.floor(Math.random()*(b-a+1));
// numeri "vicini" per i distrattori: stesse cifre scambiate, ±1, ±10, 12↔20…
function numeriVicini(n, lo, hi){
  const c = new Set();
  const s = String(n);
  if(s.length>1){ const r = s.split('').reverse().join(''); if(r[0]!=='0') c.add(+r); }
  [1,2,10,11,20,100].forEach(dd=>{ c.add(n+dd); c.add(n-dd); });
  if(n>=12 && n<=19) c.add((n-10)*10);
  if(n%10===0 && n>=20 && n<=90) c.add(n/10+10);
  c.add(rnd(lo, hi)); c.add(rnd(lo, hi));
  return shuffle([...c].filter(x=>x!==n && x>=0 && x>=lo-10 && x<=hi*1.1));
}

// Ascolta e scrivi: il numero si sente soltanto, si risponde in cifre.
function runNumDettato(rangeKey){
  const [, lab, lo, hi] = NUM_RANGES.find(x=>x[0]===rangeKey) || numRange();
  const N = 10;
  const nums = []; let guard = 0;
  while(nums.length<N && guard++<200){ const x = rnd(lo, hi); if(!nums.includes(x) || hi-lo<N) nums.push(x); }
  let i = 0, correct = 0;
  const stage = header(`Ascolta e scrivi · ${lab}`, {narrow:true});
  const bar = progressBar(stage);
  const wrap = $(`<div class="list" style="gap:12px"></div>`); stage.appendChild(wrap);
  let onKey = null;
  const stopKeys = ()=>{ if(onKey) document.removeEventListener('keydown', onKey); onKey = null; };
  onLeave(()=>{ stopKeys(); stopSpeech(); });
  function show(){
    if(i>=N){ stopKeys(); return finish(stage, `${correct} / ${N}`, ()=>runNumDettato(rangeKey)); }
    bar.style.width = (i/N*100)+'%'; bar.setNum(i, N);
    const n = nums[i], parole = numRu(n);
    wrap.innerHTML = '';
    const card = $(`<div class="qcard"><div class="kick">Che numero senti?</div>
      <button class="big-play" type="button" aria-label="Ascolta di nuovo">${ic('vol')}</button>
      <div class="qsub">Tocca per riascoltare</div></div>`);
    card.querySelector('.big-play').onclick = ()=>{ speak(parole); inp.focus(); };
    wrap.appendChild(card);
    const inp = $(`<input class="vocab-input plain num-input" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Scrivi in cifre">`);
    const chk = $(`<button class="btn primary block" type="button">${ic('check')} Verifica</button>`);
    wrap.append(inp, chk);
    let answered = false;
    inp.oninput = ()=>{ inp.value = inp.value.replace(/\D/g,''); };
    chk.onclick = ()=>{
      if(answered){ i++; return show(); }
      const v = inp.value.replace(/\D/g,'');
      if(!v){ inp.focus(); return; }
      answered = true;
      const ok = +v === n;
      if(ok) correct++;
      haptic(ok); recordActivity(ok); contaExtra('num', ok);
      if(!ok) logErrore(parole, n.toLocaleString('it-IT'), 'Numeri');
      inp.disabled = true;
      inp.classList.add(ok ? 'ok' : 'ko');
      const res = $(`<div class="qsub num-res"></div>`);
      res.innerHTML = ok ? `<b style="color:var(--good)">✓ ${n.toLocaleString('it-IT')}</b> — ${esc(parole)}`
                         : `<b style="color:var(--bad)">Era ${n.toLocaleString('it-IT')}</b> — ${esc(parole)}`;
      card.appendChild(res);
      card.appendChild(azioniTesto(parole, n.toLocaleString('it-IT'), {mic:true}));
      speak(parole);
      chk.innerHTML = `${i+1<N ? 'Continua' : 'Risultato'} →`;
    };
    stopKeys();
    onKey = e=>{ if(e.key==='Enter'){ e.preventDefault(); chk.click(); } };
    document.addEventListener('keydown', onKey);
    setTimeout(()=>speak(parole), 250);
    setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} }, 60);
  }
  show();
}

// Leggi il numero: parole russe → cifre (scelta multipla)
function runNumLeggi(rangeKey){
  const [, lab, lo, hi] = NUM_RANGES.find(x=>x[0]===rangeKey) || numRange();
  const qs = [];
  const usati = new Set();
  for(let k=0; k<10; k++){
    let n = rnd(lo, hi), g = 0;
    while(usati.has(n) && g++<20) n = rnd(lo, hi);
    usati.add(n);
    const opts = [n, ...numeriVicini(n, lo, hi).slice(0,3)].map(x=>x.toLocaleString('it-IT'));
    qs.push({q:numRu(n), sub:'Quale numero è?', correct:n.toLocaleString('it-IT'), opts:shuffle(opts), speak:numRu(n),
             err:{ru:numRu(n), it:n.toLocaleString('it-IT'), fonte:'Numeri'}});
  }
  runMCQ(qs, `Leggi il numero · ${lab}`, ()=>runNumLeggi(rangeKey), {onAnswer:(Q, ok)=>{ recordActivity(ok); contaExtra('num', ok); }});
}

// Che ore sono? Orologio → ora in russo
function runOre(){
  const qs = [];
  const usate = new Set();
  while(qs.length<8){
    const h = rnd(1, 12), m = rnd(0, 11)*5, key = h+':'+m;
    if(usate.has(key)) continue;
    usate.add(key);
    const giusta = oraRu(h, m);
    const cand = new Set();
    [[h, (m+5)%60],[h, (m+10)%60],[h%12+1, m],[(h+10)%12+1, m],[h, (m+30)%60],[m/5 || 12, h*5%60],[rnd(1,12), rnd(0,11)*5]]
      .forEach(([hh, mm])=>{ const s = oraRu(hh, mm); if(s!==giusta) cand.add(s); });
    const coll = oraColloquiale(h, m);
    qs.push({
      qHtml: clockSVG(h, m), sub:`Sono le ${h}:${String(m).padStart(2,'0')}`, correct:giusta,
      opts: shuffle([giusta, ...shuffle([...cand]).slice(0,3)]), speak:`Сейчас ${giusta}`, speakAfter:true,
      err:{ru:giusta, it:`${h}:${String(m).padStart(2,'0')}`, fonte:'Ore'},
      after: coll ? `Nel parlato: «${coll}»` : 'Esatta: si può aggiungere «ровно» (in punto).'
    });
  }
  runMCQ(qs, 'Che ore sono?', runOre, {onAnswer:(Q, ok)=>{ recordActivity(ok); contaExtra('num', ok); }});
}

// Quanto costa? Prezzo → frase in russo con рубль / рубля / рублей
const PREZZI = [
  ['☕','кофе',120,450,10],['🥐','круассан',60,250,5],['🍎','килограмм яблок',80,260,10],['🍞','хлеб',40,120,1],
  ['🎟️','билет в музей',250,900,50],['🚕','такси',300,1800,10],['🧥','куртка',2500,9000,100],['📕','книга',200,1200,10],
  ['🚆','билет на поезд',1500,6500,50],['💊','лекарство',90,900,1],['🍦','мороженое',51,99,1],['🎂','торт',400,2200,1],
];
function runPrezzi(){
  const qs = shuffle(PREZZI).slice(0,8).map(([e, cosa, lo, hi, step])=>{
    let n = Math.round(rnd(lo, hi)/step)*step;
    if(Math.random()<.4) n = n - n%10 + [1,2,3,4,1,2][rnd(0,5)];     // tanti numeri che finiscono in 1-4
    const giusta = prezzoRu(n);
    const cand = new Set();
    numeriVicini(n, lo, hi).slice(0,4).forEach(x=>{ if(x>0) cand.add(prezzoRu(x)); });
    // un distrattore con il numero giusto e la forma sbagliata di «рубль»
    const sbagliata = RUBLI.filter(f=>f!==pluralRu(n, RUBLI));
    const trappola = `${numRu(n)} ${sbagliata[rnd(0, sbagliata.length-1)]}`;
    const altri = shuffle([...cand].filter(x=>x!==giusta)).slice(0,2);
    return {
      qHtml:`<div class="price-q"><span class="e">${e}</span><b>${n.toLocaleString('it-IT')} ₽</b></div>`,
      sub:`${cosa} — сколько стоит?`, correct:giusta, opts:shuffle([giusta, trappola, ...altri]),
      err:{ru:giusta, it:`${n.toLocaleString('it-IT')} ₽`, fonte:'Prezzi'},
      speak:`Это стоит ${giusta}.`, speakAfter:true, after:`${n.toLocaleString('it-IT')} ₽: ${n%100>10 && n%100<20 ? 'finisce per 11–19 → sempre «рублей»' : n%10===1 ? 'finisce per 1 → «рубль»' : n%10>=2 && n%10<=4 ? 'finisce per 2, 3, 4 → «рубля»' : 'finisce per 5–9 o 0 → «рублей»'}`
    };
  });
  runMCQ(qs, 'Quanto costa?', runPrezzi, {onAnswer:(Q, ok)=>{ recordActivity(ok); contaExtra('num', ok); }});
}
