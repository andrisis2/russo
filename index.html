// ========== VIKA — Gemini Live + fallback REST ==========
const VIKA_KEY = "vika_gemini_key";
const VIKA_WS  = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent";
const VIKA_REST= "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent";

// Modelli Live API in ordine di preferenza: Google li rinomina spesso,
// quindi proviamo i candidati in sequenza prima di ripiegare sul REST.
// Aggiornato giugno 2026: il preview 12-2025 fallisce a metà turno (errore 1011)
// e i modelli 2.0-live / 09-2025 sono stati spenti da Google.
const VIKA_LIVE_MODELS = [
  "models/gemini-3.1-flash-live-preview",
  "models/gemini-live-2.5-flash-native-audio",
  "models/gemini-2.5-flash-native-audio-preview-12-2025",
];

// --- Helper: PCM float32 → file WAV 16-bit mono, e ArrayBuffer → base64 ---
function pcmToWav(chunks, rate){
  let len=0; for(const c of chunks) len+=c.length;
  const buf=new ArrayBuffer(44+len*2); const v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  ws(0,"RIFF"); v.setUint32(4,36+len*2,true); ws(8,"WAVE"); ws(12,"fmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  ws(36,"data"); v.setUint32(40,len*2,true);
  let o=44;
  for(const c of chunks) for(let i=0;i<c.length;i++){
    const s=Math.max(-1,Math.min(1,c[i])); v.setInt16(o,s*32767,true); o+=2;
  }
  return buf;
}
function bufToB64(buf){
  const u8=new Uint8Array(buf); let s="";
  for(let i=0;i<u8.length;i+=32768) s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));
  return btoa(s);
}

function vikaPrompt(lang, db, opts={}) {
  const vocab = (db.voci||[]).slice(0,60).map(v=>`${v.ru}=${v.it}`).join(", ");
  const frasi = (db.frasi||[]).slice(0,25).map(f=>`${f.ru}=${f.it}`).join("; ");
  const rule = lang==="ru+it"
    ? "Sei bilingue russo-italiano. Il russo è la lingua principale: rispondi sempre in russo. Puoi aggiungere spiegazioni brevi in italiano tra parentesi o dopo un trattino. Lo studente può parlarti sia in russo che in italiano: se ti parla in italiano, capiscilo e rispondi in russo con una breve nota in italiano. Correggi gli errori gentilmente."
    : "Parla SOLO in russo semplice. Anche le correzioni devono essere in russo.";
  const modeRule = {
    correction: "MODALITÀ CORREZIONE: dopo ogni risposta dello studente, correggi ogni errore grammaticale o lessicale e spiega brevemente il motivo. Poi rispondi al contenuto.",
    roleplay:   "MODALITÀ ROLE-PLAY: simula una situazione quotidiana (bar, negozio, stazione). Mantieni il personaggio. Usa solo vocaboli semplici.",
    free: ""
  }[opts.practiceMode||"free"] || "";
  const srsLine = (opts.srsStats && opts.srsStats.total > 0)
    ? `Lo studente ha consolidato ${opts.srsStats.known} parole su ${opts.srsStats.total} (SRS). Usa preferibilmente parole già studiate.`
    : "";
  const memLine = opts.lastSession
    ? `Contesto sessione precedente:\n${opts.lastSession}`
    : "";
  return [
    "Sei Vika, una tutor di russo paziente e incoraggiante.",
    "Lo studente impara da zero (livello A1) con il corso \"Russo Facile con Yula\".",
    rule, modeRule, srsLine, memLine,
    `Vocaboli già studiati: ${vocab}.`,
    `Frasi già studiate: ${frasi}.`,
    "Risposte brevi (2-3 frasi max).",
    "Rispondi SEMPRE e SOLO con un oggetto JSON con questi campi:",
    '- "trascrizione": le parole esatte dette dallo studente nel messaggio vocale (in cirillico se parla russo, in italiano se parla italiano); stringa vuota se il messaggio non è vocale.',
    '- "pronuncia": SOLO se nell\'audio senti errori di pronuncia evidenti (accento sulla sillaba sbagliata, suono storpiato), una nota brevissima in italiano (max 1 frase); altrimenti stringa vuota.',
    '- "risposta": quello che dici tu come Vika, seguendo le regole sopra.'
  ].filter(Boolean).join("\n");
}

class VikaSession {
  constructor({apiKey,lang,db,onMsg,onStatus,practiceMode,srsStats,lastSession}){
    this.apiKey=apiKey; this.lang=lang; this.db=db;
    this.onMsg=onMsg; this.onStatus=onStatus;
    this.practiceMode=practiceMode||"free";
    this.srsStats=srsStats||null;
    this.lastSession=lastSession||"";
    this.mode=null; this.active=false;
    this.ws=null; this.audioCtx=null; this.micStream=null;
    this.playCtx=null; this.nextPlayTime=0;
    this.recognition=null; this.vikaText="";
    this.gotSetup=false; this.fellBack=false;
    this.history=[];
    this.userInputLang="ru-RU";
    // Modalità audio diretto: il parlato va a Gemini come WAV (capisce molto
    // meglio il russo con accento italiano e valuta la pronuncia)
    this.audioMode=false; this.capturing=false; this._rec=null;
    // Sessione avviata da tastiera: niente microfono, si aspetta il testo scritto
    this.textOnly=false; this._busy=false;
  }

  _opts(){ return {practiceMode:this.practiceMode, srsStats:this.srsStats, lastSession:this.lastSession}; }

  setUserLang(l){
    this.userInputLang=l;
    if(this.mode==="rest"&&this.active){
      try{this.recognition?.stop();}catch(e){}
      this.recognition=null;
    }
    if(this.mode==="live"&&this.recognition){
      try{this.recognition.stop();}catch(e){}
      this.recognition=null;
      this._startSTT();
    }
  }

  async connect(){
    this.active=true;
    this.onStatus("connecting");
    // Modalità live disattivata (giugno 2026): i modelli Live API di Google
    // sono instabili, quindi si parte direttamente in modalità standard.
    // Per riattivare il tentativo live: sostituire le righe sotto con this._tryLive();
    this.fellBack=true;
    if(!this.textOnly){
      try{ await this._startMicVad(); this.audioMode=true; }
      catch(e){ this.audioMode=false; } // niente mic/worklet → riserva: SpeechRecognition
    }
    this._startRest();
  }

  // Invio di un messaggio scritto da tastiera (interrompe la cattura audio in corso)
  sendText(t){
    if(!this.active||this._busy) return;
    t=(t||"").trim(); if(!t) return;
    this.capturing=false;
    try{this.recognition?.stop();}catch(e){} this.recognition=null;
    speechSynthesis.cancel();
    this._chat({text:t});
  }

  _tryLive(modelIdx=0){
    const model=VIKA_LIVE_MODELS[modelIdx];
    if(!model){ // nessun modello rimasto da provare
      if(!this.fellBack){ this.fellBack=true; this._startRest(); }
      return;
    }
    const ws=new WebSocket(`${VIKA_WS}?key=${this.apiKey}`);
    this.ws=ws;
    let settled=false; // questo tentativo ha già deciso (setup ok / modello successivo / fallback)

    // Passa al modello successivo della lista; se è l'ultimo, ripiega sul REST.
    const nextModel=()=>{
      if(settled) return; settled=true;
      clearTimeout(timer);
      if(this.ws===ws){ this.ws=null; }
      try{ws.close();}catch(e){}
      if(modelIdx+1 < VIKA_LIVE_MODELS.length) this._tryLive(modelIdx+1);
      else fallback("⚠️ Live non disponibile — avvio modalità standard...");
    };

    const fallback=(note)=>{
      if(this.fellBack) return;
      this.fellBack=true;
      if(this.ws===ws){ this.ws=null; try{ws.close();}catch(e){} }
      if(note) this.onMsg({role:"vika",text:note,final:true});
      this._startRest();
    };

    const timer=setTimeout(()=>{ if(!this.gotSetup) nextModel(); },10000);

    ws.onopen=()=>{
      ws.send(JSON.stringify({
        setup:{
          model,
          generationConfig:{
            responseModalities:["AUDIO"],
            speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:"Kore"}}}
          },
          // I modelli native-audio restituiscono il testo solo se lo chiediamo
          outputAudioTranscription:{},
          systemInstruction:{parts:[{text:vikaPrompt(this.lang,this.db,this._opts())}]}
        }
      }));
    };

    ws.onmessage=async e=>{
      let d; try{d=JSON.parse(e.data);}catch(err){return;}
      if(d.setupComplete){
        settled=true;
        clearTimeout(timer);
        this.gotSetup=true; this.mode="live";
        this.onStatus("connected");
        await this._startMic(); this._startSTT();
      }
      if(d.serverContent){
        const sc=d.serverContent;
        // Testo: sia dalle parti modelTurn sia dalla trascrizione dell'audio native
        const tr=sc.outputTranscription?.text;
        if(tr){ this.vikaText+=tr; this.onMsg({role:"vika",text:this.vikaText,final:false}); }
        if(sc.modelTurn?.parts){
          this.onStatus("speaking");
          for(const p of sc.modelTurn.parts){
            if(p.text){this.vikaText+=p.text; this.onMsg({role:"vika",text:this.vikaText,final:false});}
            if(p.inlineData?.data) this._playChunk(p.inlineData.data);
          }
        }
        if(sc.turnComplete){
          if(this.vikaText){this.onMsg({role:"vika",text:this.vikaText,final:true}); this.vikaText="";}
          this.onStatus("listening");
        }
      }
      if(d.error){
        const msg=d.error.message||JSON.stringify(d.error);
        if(!this.gotSetup) nextModel();
        else{ clearTimeout(timer); this.onMsg({role:"vika",text:`⚠️ ${msg}`,final:true}); this.onStatus("error"); }
      }
    };

    ws.onerror=()=>{ if(!this.gotSetup) nextModel(); };

    ws.onclose=(ev)=>{
      if(this.ws===ws) this.ws=null;
      if(!this.gotSetup) nextModel();
      else if(this.mode==="live") this.onStatus(ev.wasClean?"disconnected":"dropped");
    };
  }

  async _startRest(){
    this.mode="rest";
    // Conversazione nuova: Vika saluta subito (tranne se l'avvio è da tastiera:
    // lì lo studente ha già scritto il primo messaggio).
    if(!this.history.length && !this.textOnly){ this._chat({}); return; }
    this._resumeInput();
  }

  // Rimette la sessione in ascolto: cattura audio diretta se disponibile,
  // riconoscimento vocale del browser, oppure (modalità tastiera) attende il testo.
  _resumeInput(){
    if(!this.active) return;
    this.onStatus("listening");
    if(this.textOnly) return;              // aspetta input scritto
    if(this.audioMode){
      this._rec={pre:[],preLen:0,buf:[],bufLen:0,speaking:false,silence:0,voiced:0,floor:0.004};
      this.capturing=true;
    } else {
      this._listen();
    }
  }

  // input: stringa (testo dal fallback SpeechRecognition) oppure {audio: base64 WAV}
  async _chat(input){
    if(!this.active||this._busy) return;
    this._busy=true;
    const o=typeof input==="string"?{text:input}:(input||{});
    this.capturing=false;
    const GREET={role:"user",parts:[{text:"Saluta lo studente in russo e chiedi come vuole esercitarsi."}]};
    if(o.text){
      this.history.push({role:"user",parts:[{text:o.text}]});
      this.onMsg({role:"user",text:o.text,final:true});
    }
    this.onStatus(o.audio?"thinking":"speaking");
    try{
      const contents=this.history.slice();
      if(o.audio){
        contents.push({role:"user",parts:[
          {inlineData:{mimeType:"audio/wav",data:o.audio}},
          {text:"Messaggio vocale dello studente: trascrivilo, valuta la pronuncia e rispondi."}
        ]});
      } else if(!o.text && !contents.length){
        contents.push(GREET);
      }
      const body={
        system_instruction:{parts:[{text:vikaPrompt(this.lang,this.db,this._opts())}]},
        contents,
        generationConfig:{
          maxOutputTokens:400,temperature:0.8,
          responseMimeType:"application/json",
          responseSchema:{type:"OBJECT",properties:{
            trascrizione:{type:"STRING"},pronuncia:{type:"STRING"},risposta:{type:"STRING"}
          },required:["risposta"]}
        }
      };
      const resp=await fetch(`${VIKA_REST}?key=${this.apiKey}`,
        {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(!resp.ok){const e=await resp.json().catch(()=>({})); throw new Error(e.error?.message||`HTTP ${resp.status}`);}
      const data=await resp.json();
      const raw=(data.candidates?.[0]?.content?.parts?.[0]?.text||"").trim();
      let out; try{out=JSON.parse(raw);}catch(e){out={risposta:raw};}
      const reply=(out.risposta||"").trim();
      const heard=(out.trascrizione||"").trim();
      const pron=(out.pronuncia||"").trim();
      if(o.audio){
        // Nella cronologia l'audio diventa testo: contesto leggero per i turni successivi
        this.onMsg({role:"user",text:heard||"(audio non chiaro)",final:true});
        this.history.push({role:"user",parts:[{text:heard||"(audio non comprensibile)"}]});
      } else if(!o.text && !this.history.length){
        this.history.push(GREET);
      }
      if(reply){
        this.history.push({role:"model",parts:[{text:reply}]});
        this.onMsg({role:"vika",text:pron?`🗣️ ${pron}\n\n${reply}`:reply,final:true});
        // La nota di pronuncia è in italiano: la legge solo in modalità bilingue
        await this._speak(pron&&this.lang==="ru+it"?`${pron}. ${reply}`:reply);
      }
    }catch(e){
      if(o.audio&&this.audioMode){
        // L'invio audio è fallito: si prosegue col riconoscimento vocale del browser
        this.audioMode=false;
        this.onMsg({role:"vika",text:"⚠️ Audio diretto non disponibile — continuo col riconoscimento vocale del browser.",final:true});
      } else {
        this.onMsg({role:"vika",text:`⚠️ Errore: ${e.message}`,final:true});
        this.onStatus("error"); this._busy=false; return;
      }
    }
    this._busy=false;
    if(this.active) this._resumeInput();
  }

  _listen(){
    if(!this.active) return;
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){this.onMsg({role:"vika",text:"⚠️ Riconoscimento vocale non supportato. Prova Chrome.",final:true}); return;}
    this.recognition=new SR();
    this.recognition.lang=this.userInputLang; this.recognition.continuous=false; this.recognition.interimResults=true;
    let interim=null;
    this.recognition.onresult=e=>{
      let t="",final=false;
      for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript; if(e.results[i].isFinal) final=true;}
      this.onMsg({role:"user",text:t,final:false});
      if(final&&t.trim()) interim=t.trim();
    };
    this.recognition.onerror=()=>{};
    this.recognition.onend=()=>{
      if(this.active&&interim){this._chat(interim); interim=null;}
      else if(this.active){this.onStatus("listening"); this._listen();}
    };
    this.recognition.start();
  }

  async _speak(text){
    return new Promise(resolve=>{
      speechSynthesis.cancel();
      if(this.lang==="ru+it"){
        const segs=this._splitByScript(text);
        let i=0;
        const next=()=>{
          if(i>=segs.length){resolve();return;}
          const {t,isRu}=segs[i++];
          const u=new SpeechSynthesisUtterance(t);
          if(isRu){u.lang="ru-RU"; if(ruVoice) u.voice=ruVoice;}
          else{u.lang="it-IT"; if(itVoice) u.voice=itVoice;}
          u.rate=0.88; u.pitch=1.3; u.onend=next; u.onerror=next;
          speechSynthesis.speak(u);
        };
        next();
      } else {
        const u=new SpeechSynthesisUtterance(text);
        u.lang="ru-RU"; if(ruVoice) u.voice=ruVoice; u.rate=0.88; u.pitch=1.3;
        u.onend=resolve; u.onerror=resolve;
        speechSynthesis.speak(u);
      }
    });
  }

  _splitByScript(text){
    const parts=text.split(/([.!?…\n]+)/);
    const segs=[];
    for(let i=0;i<parts.length;i+=2){
      const t=(parts[i]+(parts[i+1]||"")).trim();
      if(!t) continue;
      const cy=(t.match(/[Ѐ-ӿ]/g)||[]).length;
      const la=(t.match(/[a-zA-Z]/g)||[]).length;
      segs.push({t,isRu:cy>=la});
    }
    return segs.length?segs:[{t:text,isRu:true}];
  }

  // Cattura microfono per la modalità audio diretto: PCM 16 kHz dal worklet,
  // con rilevamento voce a soglia (parte quando parli, chiude dopo ~1.3 s di silenzio).
  async _startMicVad(){
    this.audioCtx=new AudioContext({sampleRate:16000});
    if(this.audioCtx.state==="suspended") await this.audioCtx.resume();
    this.micStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    const source=this.audioCtx.createMediaStreamSource(this.micStream);
    const code=`class P extends AudioWorkletProcessor{process(i){if(i[0]&&i[0][0])this.port.postMessage(i[0][0].slice());return true}}registerProcessor('pcm-vika-rec',P)`;
    const url=URL.createObjectURL(new Blob([code],{type:"application/javascript"}));
    await this.audioCtx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);
    const node=new AudioWorkletNode(this.audioCtx,"pcm-vika-rec");
    node.port.onmessage=({data})=>this._onAudioChunk(data);
    source.connect(node);
  }

  _onAudioChunk(f32){
    if(!this.capturing||!this.active) return;
    const rec=this._rec; if(!rec) return;
    const rate=this.audioCtx?this.audioCtx.sampleRate:16000;
    let sum=0; for(let i=0;i<f32.length;i++) sum+=f32[i]*f32[i];
    const rms=Math.sqrt(sum/f32.length);
    if(!rec.speaking){
      // Stima del rumore di fondo → soglie adattive
      rec.floor=Math.min(0.02,rec.floor*0.95+rms*0.05);
      rec.pre.push(f32); rec.preLen+=f32.length;
      while(rec.preLen>rate*0.4&&rec.pre.length>1){ rec.preLen-=rec.pre[0].length; rec.pre.shift(); }
      if(rms>Math.max(0.012,rec.floor*3)){
        rec.voiced+=f32.length;
        if(rec.voiced>rate*0.06){
          rec.speaking=true; rec.buf=rec.pre.slice(); rec.bufLen=rec.preLen; rec.silence=0;
          this.onStatus("recording");
        }
      } else rec.voiced=0;
    } else {
      rec.buf.push(f32); rec.bufLen+=f32.length;
      if(rms<Math.max(0.007,rec.floor*2)){
        rec.silence+=f32.length;
        if(rec.silence>rate*1.3) return this._endUtterance();
      } else rec.silence=0;
      if(rec.bufLen>rate*20) this._endUtterance(); // tetto: 20 secondi a turno
    }
  }

  _endUtterance(){
    const rec=this._rec; if(!rec||!rec.speaking) return;
    this.capturing=false;
    const rate=this.audioCtx?this.audioCtx.sampleRate:16000;
    if(rec.bufLen<rate*0.45){ this._resumeInput(); return; } // troppo corto: rumore
    const b64=bufToB64(pcmToWav(rec.buf,rate));
    this._rec=null;
    this._chat({audio:b64});
  }

  async _startMic(){
    this.audioCtx=new AudioContext({sampleRate:16000});
    this.micStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    const source=this.audioCtx.createMediaStreamSource(this.micStream);
    const code=`class P extends AudioWorkletProcessor{process(i){if(i[0]&&i[0][0])this.port.postMessage(i[0][0].slice());return true}}registerProcessor('pcm-vika',P)`;
    const url=URL.createObjectURL(new Blob([code],{type:"application/javascript"}));
    await this.audioCtx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);
    const node=new AudioWorkletNode(this.audioCtx,"pcm-vika");
    node.port.onmessage=({data})=>{
      if(!this.ws||this.ws.readyState!==WebSocket.OPEN) return;
      const i16=new Int16Array(data.length);
      for(let i=0;i<data.length;i++) i16[i]=Math.max(-32768,Math.min(32767,data[i]*32768));
      let b=""; const u8=new Uint8Array(i16.buffer);
      for(let i=0;i<u8.length;i++) b+=String.fromCharCode(u8[i]);
      this.ws.send(JSON.stringify({realtimeInput:{mediaChunks:[{mimeType:"audio/pcm;rate=16000",data:btoa(b)}]}}));
    };
    source.connect(node);
    this.onStatus("listening");
  }

  _startSTT(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR) return;
    this.recognition=new SR();
    this.recognition.lang=this.userInputLang; this.recognition.continuous=true; this.recognition.interimResults=true;
    this.recognition.onresult=e=>{
      let t="",final=false;
      for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript; if(e.results[i].isFinal) final=true;}
      this.onMsg({role:"user",text:t,final});
    };
    this.recognition.onerror=()=>{};
    this.recognition.onend=()=>{if(this.ws?.readyState===WebSocket.OPEN) try{this.recognition.start();}catch(e){}};
    this.recognition.start();
  }

  _playChunk(b64){
    if(!this.playCtx||this.playCtx.state==="closed"){
      this.playCtx=new AudioContext({sampleRate:24000}); this.nextPlayTime=0;
    }
    const bin=atob(b64); const u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const i16=new Int16Array(u8.buffer); const f32=new Float32Array(i16.length);
    for(let i=0;i<i16.length;i++) f32[i]=i16[i]/32768;
    const buf=this.playCtx.createBuffer(1,f32.length,24000);
    buf.getChannelData(0).set(f32);
    const src=this.playCtx.createBufferSource();
    src.buffer=buf; src.connect(this.playCtx.destination);
    const t=Math.max(this.nextPlayTime,this.playCtx.currentTime+0.02);
    src.start(t); this.nextPlayTime=t+buf.duration;
  }

  disconnect(){
    this.active=false; this.capturing=false; this._rec=null;
    try{this.recognition?.stop();}catch(e){} this.recognition=null;
    this.micStream?.getTracks().forEach(t=>t.stop());
    try{this.audioCtx?.close();}catch(e){}
    try{this.playCtx?.close();}catch(e){}
    if(this.ws){const ws=this.ws; this.ws=null; try{ws.close();}catch(e){}}
    speechSynthesis.cancel();
    this.onStatus("disconnected");
  }
}


function runVika(){
  const stage=header('Conversa con Vika');
  let session=null;
  let vikaEl=null, userEl=null;
  // lasciando la schermata la conversazione si chiude (microfono e voce compresi)
  onLeave(()=>{ if(session) session.disconnect(); });

  // Preferenze ricordate tra una visita e l'altra
  let currentLang = localStorage.getItem('vika_lang')==='ru+it' ? 'ru+it' : 'ru';
  let currentPracticeMode = ['free','correction','roleplay'].includes(localStorage.getItem('vika_mode')) ? localStorage.getItem('vika_mode') : 'free';
  let currentUserLang = "ru-RU";

  const controls = $(`<div class="vika-controls"></div>`);
  const segLang = $(`<div class="seg sm">
      <button type="button" data-v="ru">🇷🇺 Solo russo</button>
      <button type="button" data-v="ru+it">🇷🇺🇮🇹 Russo + italiano</button></div>`);
  // lingua in cui parla lo studente (solo in modalità bilingue)
  const segUser = $(`<div class="seg sm">
      <button type="button" data-v="ru-RU">🎤 Parlo russo</button>
      <button type="button" data-v="it-IT">🎤 Parlo italiano</button></div>`);
  const segMode = $(`<div class="seg sm">
      <button type="button" data-v="free">🗣️ Chiacchiera</button>
      <button type="button" data-v="correction">✏️ Correzioni</button>
      <button type="button" data-v="roleplay">🎭 Role-play</button></div>`);
  controls.append(segLang, segUser, segMode);
  stage.appendChild(controls);
  const paintSeg = (seg, v)=>seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));

  function setUserInputLang(l){
    currentUserLang=l;
    paintSeg(segUser, l);
    if(session) session.setUserLang(l);
  }
  function setLang(l){
    currentLang=l;
    localStorage.setItem('vika_lang', l);
    paintSeg(segLang, l);
    segUser.style.display = l==="ru+it" ? "" : "none";
    if(l==="ru") setUserInputLang("ru-RU");
    if(session) session.lang = l;           // vale già dal prossimo messaggio
  }
  function setPracticeMode(m){
    currentPracticeMode=m;
    localStorage.setItem('vika_mode', m);
    paintSeg(segMode, m);
    if(session) session.practiceMode = m;
  }
  segLang.querySelectorAll('button').forEach(b=>b.onclick=()=>setLang(b.dataset.v));
  segUser.querySelectorAll('button').forEach(b=>b.onclick=()=>setUserInputLang(b.dataset.v));
  segMode.querySelectorAll('button').forEach(b=>b.onclick=()=>setPracticeMode(b.dataset.v));
  setLang(currentLang);
  setUserInputLang("ru-RU");
  setPracticeMode(currentPracticeMode);

  // Stato della connessione
  const statusEl=$(`<div class="vika-status" aria-live="polite"></div>`);
  stage.appendChild(statusEl);

  // Chat (con un benvenuto finché è vuota)
  const chatEl=$(`<div class="vika-chat"></div>`);
  const emptyEl=$(`<div class="vika-empty"><div class="vika-av" role="img" aria-label="Vika"></div>
    <div><b style="color:var(--text)">Привет! Я Вика.</b><br>Premi il microfono e parla, oppure scrivi qui sotto.<br>Tocca una parola russa per ascoltarla o salvarla.</div></div>`);
  chatEl.appendChild(emptyEl);
  stage.appendChild(chatEl);

  function addBubble(role){
    if(emptyEl.parentNode) emptyEl.remove();
    let bub;
    if(role==="vika"){
      const row=$(`<div class="vika-msg-row"></div>`);
      const char=$(`<img src="vika.png" class="vika-char" alt="">`);
      bub=$(`<div class="vika-fumetto"></div>`);
      row.appendChild(char); row.appendChild(bub);
      chatEl.appendChild(row);
    } else {
      const wrap=$(`<div class="user-msg"><div class="who">Tu</div></div>`);
      bub=$(`<div class="user-bub"></div>`);
      wrap.appendChild(bub);
      chatEl.appendChild(wrap);
    }
    chatEl.scrollTop=chatEl.scrollHeight;
    return bub;
  }

  // Pronuncia di una frase a velocità variabile (per i pulsanti "ripeti" e "più lento")
  function speakBubble(text, rate){
    const clean=text.replace(/^🗣️[^\n]*\n+/,"").trim();
    if(!clean||!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    if(currentLang==="ru+it"){
      const parts=clean.split(/([.!?…\n]+)/), segs=[];
      for(let i=0;i<parts.length;i+=2){
        const t=(parts[i]+(parts[i+1]||"")).trim(); if(!t) continue;
        const cy=(t.match(/[Ѐ-ӿ]/g)||[]).length, la=(t.match(/[a-zA-Z]/g)||[]).length;
        segs.push({t,isRu:cy>=la});
      }
      let i=0; const next=()=>{
        if(i>=segs.length) return;
        const {t,isRu}=segs[i++];
        const u=new SpeechSynthesisUtterance(t);
        if(isRu){u.lang="ru-RU"; if(ruVoice) u.voice=ruVoice;} else {u.lang="it-IT"; if(itVoice) u.voice=itVoice;}
        u.rate=rate; u.pitch=1.3; u.onend=next; u.onerror=next; speechSynthesis.speak(u);
      };
      next();
    } else {
      const u=new SpeechSynthesisUtterance(clean);
      u.lang="ru-RU"; if(ruVoice) u.voice=ruVoice; u.rate=rate; u.pitch=1.3;
      speechSynthesis.speak(u);
    }
  }

  // Popover su una parola russa: ascolta + salva negli esercizi
  function openWordPopover(anchor, word){
    document.querySelectorAll(".vika-pop").forEach(p=>p.remove());
    if(!word) return;
    const key=localStorage.getItem(VIKA_KEY);
    const pop=$(`<div class="vika-pop"></div>`);
    const b=document.createElement('b'); b.textContent=word; pop.appendChild(b);
    const row=$(`<div class="pop-row"></div>`);
    const sp=$(`<button type="button">🔊 Ascolta</button>`);
    sp.onclick=()=>speak(word);
    row.appendChild(sp);
    if(key){
      const sv=$(`<button type="button"></button>`);
      const refresh=()=>{ const has=isUserVoce(word); sv.textContent=has?"✓ Salvata":"＋ Esercizi"; sv.disabled=has; };
      refresh();
      sv.onclick=async()=>{
        if(isUserVoce(word)) return;
        sv.disabled=true; sv.textContent="⏳";
        let it="";
        try{
          const rr=await fetch(`${VIKA_REST}?key=${key}`,{method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({contents:[{role:"user",parts:[{text:`Traduci in italiano questa parola russa (solo la traduzione, una parola o brevissima espressione, niente note): "${word}"`}]}],generationConfig:{maxOutputTokens:30,temperature:0.1}})});
          const dd=await rr.json();
          it=(dd.candidates?.[0]?.content?.parts?.[0]?.text||"").trim().replace(/^["']|["']$/g,"");
        }catch(e){}
        if(!it) it="(da tradurre)";
        addUserVoce(word, it, "", "vika");
        anchor.classList.add("saved");
        sv.textContent="✓ Salvata"; haptic(true);
      };
      row.appendChild(sv);
    }
    pop.appendChild(row);
    document.body.appendChild(pop);
    const r=anchor.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight;
    let left=Math.max(8,Math.min(r.left+window.scrollX+r.width/2-pw/2, window.innerWidth-pw-8));
    let top=(r.bottom+ph+12>window.innerHeight) ? r.top+window.scrollY-ph-6 : r.bottom+window.scrollY+6;
    pop.style.left=left+"px"; pop.style.top=top+"px";
    setTimeout(()=>{
      const close=ev=>{ if(!pop.contains(ev.target)){ pop.remove(); document.removeEventListener("pointerdown",close); } };
      document.addEventListener("pointerdown",close);
    },0);
  }

  // Scrive il testo nel fumetto rendendo tappabile ogni parola russa
  function appendClickableRu(el, text){
    for(const tok of text.split(/(\s+)/)){
      if(/[Ѐ-ӿ]/.test(tok)){
        const clean=tok.replace(/[^Ѐ-ӿ-]/g,"");
        const span=$(`<span class="vika-word"></span>`);
        span.textContent=tok;
        if(clean && isUserVoce(clean)) span.classList.add("saved");
        span.onclick=ev=>{ ev.stopPropagation(); openWordPopover(span, clean); };
        el.appendChild(span);
      } else if(tok){
        el.appendChild(document.createTextNode(tok));
      }
    }
  }

  function renderVikaBubble(bub, text){
    bub.textContent="";
    let body=text;
    const m=text.match(/^🗣️\s*([^\n]*)\n+([\s\S]*)$/);
    if(m){
      const note=$(`<div class="vika-note"></div>`);
      note.textContent=`🗣️ ${m[1]}`;
      bub.appendChild(note);
      body=m[2];
    }
    appendClickableRu(bub, body);
  }

  function addBubbleTools(bub, text){
    const key=localStorage.getItem(VIKA_KEY);
    const tools=$(`<div class="vika-tools"></div>`);
    const rep=$(`<button class="vika-tool" type="button">🔁 ripeti</button>`);
    rep.onclick=()=>speakBubble(text,0.88);
    const slow=$(`<button class="vika-tool" type="button">🐢 più lento</button>`);
    slow.onclick=()=>speakBubble(text,0.55);
    tools.appendChild(rep); tools.appendChild(slow);
    const ruTxt = text.replace(/^🗣️[^\n]*\n+/,'').split('\n').filter(r=>/[а-яё]/i.test(r)).join(' ').trim();
    if(ruTxt){ const sp = $(`<button class="vika-tool" type="button">🔍 spiega</button>`); sp.onclick = ()=>spiega(ruTxt, '', {tag:['vika']}); tools.appendChild(sp); }
    bub.appendChild(tools);
    if(!key) return;
    const itDiv=$(`<div class="vika-it" style="display:none"></div>`);
    const btn=$(`<button class="vika-tool" type="button">🇮🇹 traduci</button>`);
    const src=text.replace(/^🗣️[^\n]*\n+/,"").trim();
    let cached=null;
    btn.onclick=async()=>{
      if(cached!==null){
        itDiv.style.display=itDiv.style.display==="none"?"block":"none";
        btn.textContent=itDiv.style.display==="none"?"🇮🇹 traduci":"🇮🇹 nascondi";
        return;
      }
      btn.textContent="⏳"; btn.disabled=true;
      try{
        const r=await fetch(`${VIKA_REST}?key=${key}`,{method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            contents:[{role:"user",parts:[{text:`Traduci solo in italiano (solo la traduzione, senza note o spiegazioni): "${src}"`}]}],
            generationConfig:{maxOutputTokens:80,temperature:0.2}
          })});
        const d=await r.json();
        cached=(d.candidates?.[0]?.content?.parts?.[0]?.text||"").trim();
      }catch(e){cached="";}
      if(cached){itDiv.textContent=cached; itDiv.style.display="block"; btn.textContent="🇮🇹 nascondi";}
      else{cached=null; btn.textContent="🇮🇹 errore"; setTimeout(()=>{btn.textContent="🇮🇹 traduci"; btn.disabled=false;},2000); return;}
      btn.disabled=false;
    };
    tools.appendChild(btn); bub.appendChild(itDiv);
  }

  function onMsg({role,text,final}){
    if(role==="vika"){
      if(!vikaEl) vikaEl=addBubble("vika");
      vikaEl.textContent=text;
      if(final){
        const bub=vikaEl, t=text;
        vikaEl=null;
        renderVikaBubble(bub, t);
        addBubbleTools(bub, t);
      }
    } else {
      if(!userEl) userEl=addBubble("user");
      userEl.textContent=text;
      if(final) userEl=null;
    }
    chatEl.scrollTop=chatEl.scrollHeight;
  }

  const STATUS={
    connecting:"⏳ Connessione in corso…",
    connected:"✅ Connessa — inizia a parlare",
    listening:"🎤 In ascolto…",
    recording:"🎙️ Ti sento — parla pure",
    thinking:"🤔 Vika sta pensando…",
    speaking:"💬 Vika sta parlando…",
    error:"❌ Connessione fallita — controlla la API key",
    dropped:"⚠️ Connessione interrotta",
    disconnected:""
  };

  // Pulsante microfono
  const micWrap=$(`<div class="mic-wrap"></div>`);
  const micBtn=$(`<button class="mic-btn" type="button" aria-label="Parla con Vika">${ic('mic')}</button>`);
  const micLabel=$(`<div class="mic-label">Premi per parlare con Vika</div>`);
  micWrap.appendChild(micBtn); micWrap.appendChild(micLabel); stage.appendChild(micWrap);

  function onStatus(s){
    statusEl.textContent=STATUS[s]||"";
    const active=s==="connected"||s==="listening"||s==="speaking"||s==="recording"||s==="thinking";
    const busy=s==="connecting";
    micBtn.innerHTML = active ? ic('stop') : ic('mic');
    micBtn.classList.toggle('on', active);
    micBtn.classList.toggle('busy', busy);
    micBtn.setAttribute('aria-label', active ? 'Termina la conversazione' : 'Parla con Vika');
    micBtn.classList.toggle("mic-listening", s==="listening"||s==="recording");
    micLabel.textContent=active?"Premi per terminare":busy?"Connessione…":"Premi per parlare con Vika";
    if(s==="error"){
      const eb=addBubble("vika");
      eb.textContent="❌ Connessione a Gemini fallita. Verifica che la API key sia corretta e riprova.";
      session=null; vikaEl=null; userEl=null;
    }
    if(s==="dropped"){
      const eb=addBubble("vika");
      eb.textContent="⚠️ La connessione si è interrotta. Premi di nuovo il microfono per riprendere: Vika ricorda la conversazione.";
      session?.disconnect(); // chiude mic/audio e salva la memoria via stato disconnected
    }
    if(s==="disconnected"){
      if(session) vikaSaveMem(session.history);
      session=null; vikaEl=null; userEl=null;
    }
  }

  function newSession(key){
    const s=new VikaSession({
      apiKey:key, lang:currentLang, db:DB, onMsg, onStatus,
      practiceMode:currentPracticeMode,
      srsStats:vikaSrsStats(),
      lastSession:vikaLoadMem()
    });
    s.userInputLang=currentUserLang;
    return s;
  }

  // Input da tastiera: alternativa al microfono (utile in pubblico).
  // Avvia una sessione "solo testo" se non ce n'è una attiva, altrimenti
  // inserisce il messaggio nella conversazione in corso.
  const typeRow=$(`<div class="type-row"></div>`);
  const typeInp=$(`<input type="text" placeholder="…oppure scrivi qui" enterkeyhint="send" autocomplete="off">`);
  const sendBtn=$(`<button class="btn blue" type="button" aria-label="Invia">${ic('send')}</button>`);
  function sendTyped(){
    const t=typeInp.value.trim(); if(!t) return;
    const key=localStorage.getItem(VIKA_KEY);
    if(!key){ showKeyModal(); return; }
    typeInp.value="";
    if(session){ session.sendText(t); return; }
    session=newSession(key);
    session.textOnly=true;
    session.connect().then(()=>session && session.sendText(t)).catch(()=>onStatus("error"));
  }
  sendBtn.onclick=sendTyped;
  typeInp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); sendTyped(); } });
  typeRow.appendChild(typeInp); typeRow.appendChild(sendBtn); stage.appendChild(typeRow);

  micBtn.onclick=async()=>{
    if(session){ session.disconnect(); return; }
    const key=localStorage.getItem(VIKA_KEY);
    if(!key){ showKeyModal(); return; }
    session=newSession(key);
    session.connect().catch(()=>onStatus("error"));
  };

  // Link impostazione chiave
  const hasKey=!!localStorage.getItem(VIKA_KEY);
  const keyEl=$(`<button class="textbtn" type="button" style="align-self:center">${ic('key')} <span>${hasKey?"API key configurata · cambia":"Configura la API key di Gemini"}</span></button>`);
  keyEl.onclick=()=>showKeyModal();
  stage.appendChild(keyEl);

  function showKeyModal(){
    const ov=$(`<div class="modal-ov">
      <div class="modal" role="dialog" aria-modal="true" aria-label="API key Gemini">
        <h3>🔑 API key Gemini</h3>
        <p>Ottieni la chiave gratuita su <b>aistudio.google.com</b> → <b>Get API key</b>.<br>Resta salvata solo su questo dispositivo.</p>
        <input type="password" placeholder="Incolla la tua API key…" autocomplete="off">
        <div class="row">
          <button class="btn" type="button" data-a="x">Annulla</button>
          <button class="btn primary" type="button" data-a="ok">Salva</button>
        </div>
      </div>
    </div>`);
    document.body.appendChild(ov);
    const inp=ov.querySelector("input");
    inp.value=localStorage.getItem(VIKA_KEY)||"";
    const close=()=>{ ov.remove(); document.removeEventListener('keydown', onEsc); };
    const onEsc=e=>{ if(e.key==='Escape') close(); };
    document.addEventListener('keydown', onEsc);
    ov.onclick=e=>{ if(e.target===ov) close(); };
    ov.querySelector('[data-a="x"]').onclick=close;
    const save=()=>{
      const v=inp.value.trim();
      if(v){ localStorage.setItem(VIKA_KEY,v); keyEl.querySelector("span").textContent="API key configurata · cambia"; }
      close();
    };
    ov.querySelector('[data-a="ok"]').onclick=save;
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') save(); });
    setTimeout(()=>inp.focus(),50);
  }
}

// ================= IMPOSTAZIONI UTENTE =================
// Un'unica chiave in localStorage per tema, voce, dimensione del ripasso e
// tastiera cirillica. I valori mancanti ricadono sui predefiniti, così i dati
// salvati prima che un'opzione esistesse restano validi.
const SETTINGS_KEY = "russo_settings_v1";
const SETTINGS_DEFAULTS = { tema:"auto", ttsRate:0.9, dailySize:20, kbd:true };
function settings(){
  try{ return Object.assign({}, SETTINGS_DEFAULTS, JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}")); }
  catch(e){ return Object.assign({}, SETTINGS_DEFAULTS); }
}
function saveSettings(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }
function setSetting(k, v){ const s = settings(); s[k] = v; saveSettings(s); }
// "auto" segue il sistema; "chiaro"/"scuro" forzano il tema via data-theme,
// su cui sono agganciate le regole CSS del blocco scuro.
function applyTheme(){
  const t = settings().tema, r = document.documentElement;
  if(t === "chiaro")     r.setAttribute("data-theme","light");
  else if(t === "scuro") r.setAttribute("data-theme","dark");
  else                   r.removeAttribute("data-theme");
  syncThemeColor();
}

// ================= DIARIO DELL'ATTIVITÀ =================
// Una riga per giorno: quante risposte e quante giuste. Serve alla mappa dei
// progressi. Si conserva poco più di un anno, poi le righe vecchie si buttano.
const ACTIVITY_KEY = "russo_activity_v1";
function activityLog(){ try{ return JSON.parse(localStorage.getItem(ACTIVITY_KEY)||"{}"); }catch(e){ return {}; } }
function recordActivity(ok){
  xpTotale();                // la prima volta conta i punti delle risposte passate
  const log = activityLog(), t = todayStr();
  const d = log[t] || {r:0, ok:0};
  d.r++; if(ok) d.ok++;
  log[t] = d;
  const cut = dateStr(new Date(Date.now() - 370*DAY_MS));
  Object.keys(log).forEach(k=>{ if(k < cut) delete log[k]; });
  try{ localStorage.setItem(ACTIVITY_KEY, JSON.stringify(log)); }catch(e){}
  addXP(ok ? 10 : 2);
}

// Fotografia dello stato di studio: quante parole sono nuove, in apprendimento
// (box 1) o imparate (box 2+, cioè sopravvissute ad almeno una settimana).
function studyStats(){
  const voci = (DB && DB.voci) || [];
  let nuove = 0, corso = 0, note = 0;
  voci.forEach(v=>{
    const st = srs[v.id];
    if(!st || !st.seen) nuove++;
    else if((st.box||0) >= 2) note++;
    else corso++;
  });
  let seen = 0, correct = 0;
  Object.values(srs).forEach(st=>{ seen += st.seen||0; correct += st.correct||0; });
  const log = activityLog();
  let giorniAttivi = 0, risposteTot = 0;
  Object.values(log).forEach(d=>{ giorniAttivi++; risposteTot += d.r||0; });
  return {
    totale: voci.length, nuove, corso, note,
    seen, correct,
    precisione: seen ? Math.round(correct/seen*100) : 0,
    giorniAttivi, risposteTot,
    oggi: (log[todayStr()]||{r:0}).r
  };
}
// Le parole che tornano a farsi sbagliare: viste almeno 4 volte con meno del
// 60% di risposte giuste. Sono quelle su cui conviene tornare a mano.
function paroleDifficili(){
  const voci = (DB && DB.voci) || [];
  return voci
    .map(v=>{ const st = srs[v.id]; return st && st.seen >= 4 ? {v, r: st.correct/st.seen, st} : null; })
    .filter(x=>x && x.r < 0.6)
    .sort((a,b)=>a.r - b.r || b.st.seen - a.st.seen)
    .map(x=>x.v);
}
// Quante carte scadono in ognuno dei prossimi 7 giorni (oggi include gli arretrati).
function previsioneRipassi(){
  const voci = (DB && DB.voci) || [];
  const out = [];
  for(let i=0; i<7; i++){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+i);
    const from = d.getTime(), to = from + DAY_MS;
    let n = 0;
    voci.forEach(v=>{
      const st = srs[v.id];
      if(!st || !st.due) return;                                  // mai viste: contate a parte
      if(i===0 ? st.due < to : (st.due >= from && st.due < to)) n++;
    });
    out.push({data:d, n});
  }
  return out;
}
// Serie più lunga di giorni consecutivi con almeno una risposta.
function serieRecord(){
  const giorni = Object.keys(activityLog()).filter(k=>(activityLog()[k].r||0) > 0).sort();
  let best = 0, cur = 0, prev = null;
  giorni.forEach(g=>{
    if(prev){
      const dp = new Date(prev+"T00:00:00"), dg = new Date(g+"T00:00:00");
      cur = (dg - dp === DAY_MS) ? cur+1 : 1;
    } else cur = 1;
    prev = g; if(cur > best) best = cur;
  });
  return best;
}

    for(let gg = 0; gg < 7; gg++){
      const d = new Date(lunediCorrente);
      d.setDate(lunediCorrente.getDate() - wk*7 + gg);
      const key = dateStr(d), n = (log[key]||{}).r || 0;
      const lvl = d > oggi ? "future" : n===0 ? "" : n<5 ? "l1" : n<15 ? "l2" : n<30 ? "l3" : "l4";
      const today = d.getTime()===oggi.getTime() ? " today" : "";
      col.appendChild($(`<div class="hc ${lvl}${today}" title="${fmtData(key)}: ${plur(n,'risposta','risposte')}"></div>`));
    }
    hwrap.appendChild(col);
  }
  stage.appendChild(heat);
  requestAnimationFrame(()=>{ hwrap.scrollLeft = hwrap.scrollWidth; });   // oggi sempre in vista

  // --- Previsione dei ripassi ---
  const prev = previsioneRipassi();
  const maxN = Math.max(1, ...prev.map(p=>p.n));
  const fc = $(`<div class="pcard"><h3>${ic('clock')} Ripassi in arrivo</h3><div class="fcast"></div>
    <p class="muted" style="margin:12px 0 0;font-size:12.5px;line-height:1.5;text-align:left">Solo le carte già iniziate, giorno per giorno.

  stage.appendChild(hc);

  const imp = $(`<button class="linkbtn" type="button" style="align-self:center">${ic('gear')} Impostazioni e backup</button>`);

// ================= SCRITTURA (produzione attiva) =================
// L'unico esercizio in cui la parola russa va PRODOTTA, non riconosciuta.
// Due modi: dall'italiano o dall'ascolto (dettato). La tastiera cirillica a
// schermo evita di dover installare il layout russo sul telefono.
const KBD_ROWS = [
  ["й","ц","у","к","е","н","г","ш","щ","з","х","ъ"],
  ["ф","ы","в","а","п","р","о","л","д","ж","э"],
  ["я","ч","с","м","и","т","ь","б","ю","ё"],
];
// Confronto indulgente: niente maiuscole, accenti tonici, punteggiatura;
// ё ed е valgono uguale (le tastiere russe spesso non distinguono).
function normWrite(s){
  return (s||"").toLowerCase()
    .replace(/́/g,"")
    .replace(/ё/g,"е")
    .replace(/[^Ѐ-ӿ\s-]/g,"")
    .replace(/\s+/g," ")
    .trim();
}
// Diff carattere per carattere fra quello che hai scritto e la soluzione.
function diffHtml(typed, sol){
  const a = normWrite(typed), b = normWrite(sol);
  let out = "";
  for(let i=0; i<a.length; i++){
    const ok = a[i] === b[i];
    out += `<span class="ch ${ok?"good":"bad"}">${a[i]===" "?"&nbsp;":a[i]}</span>`;
  }
  return out || "&mdash;";
}

function runScrittura(pool, label, opts){
  opts = opts || {};
  let deck = (pool||[]).filter(c=>c.ru && c.it);
  if(!opts.ignoreDue) deck = deck.filter(c=>isDue(c.id));
  deck = deck.sort((a,b)=>dueScore(b.id)-dueScore(a.id));
  if(opts.ignoreDue) deck = shuffle(deck);
  if(opts.limit) deck = deck.slice(0, opts.limit);

  const stage = header(label ? `Scrittura · ${label}` : 'Scrittura', {narrow:true});
  if(!deck.length){
    emptyDone(stage, '✅', 'Tutto ripassato!', "Nessuna parola in scadenza qui. Torna quando l'intervallo sarà scaduto, oppure scegli un argomento.");
    return;
  }

  const total = deck.length;
  let queue = deck.slice(), mastered = 0, errori = 0, c = null, answered = false, usedHint = false;
  let cardSeq = 0;        // ogni carta ha il suo numero: l'avanzamento automatico non salta mai la carta dopo
  let modo = localStorage.getItem("scritturaModo") === "audio" ? "audio" : "it";

  // Modo: dall'italiano oppure dettato
  const top = $(`<div class="ex-top"></div>`);
  const seg = $(`<div class="seg sm center">
    <button type="button" data-m="it">🇮🇹 Dall'italiano</button>
    <button type="button" data-m="audio">🔊 Dettato</button></div>`);
  function paintSeg(){ seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.m===modo)); }
  seg.querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{ if(modo===b.dataset.m) return; modo=b.dataset.m; localStorage.setItem("scritturaModo",modo); paintSeg(); show(); };
  });
  paintSeg();
  top.appendChild(seg);
  stage.appendChild(top);
  const bar = progressBar(top);
  const wrap = $(`<div class="list" style="gap:12px"></div>`);
  stage.appendChild(wrap);

  function advance(){
    if(!queue.length) return finish(stage, `${total} / ${total + errori}`, opts.restart || (()=>runScrittura(pool, label, opts)), {
      titolo: errori ? 'Scrittura completata!' : 'Perfetto, tutte giuste!',
      testo: errori ? `${plur(total,'parola scritta','parole scritte')}, ${errori===1?'un errore':errori+' errori'} lungo la strada.` : `${plur(total,'parola scritta','parole scritte')} senza errori.`
    });
    c = queue.shift(); answered = false; usedHint = false; cardSeq++; show();
  }

  function show(){
    bar.style.width = (mastered/total*100)+"%"; bar.setNum(mastered, total);
    wrap.innerHTML = "";
    const useKbd = settings().kbd;
    const mySeq = cardSeq;

    const wbox = $(`<div class="wbox">
      ${modo==="audio"
        ? `<button class="speak" type="button" aria-label="Riascolta">${ic('vol')}</button>
           <div class="sub">Ascolta e scrivi quello che senti</div>`
        : `<div class="prompt"></div><div class="sub">Scrivi la parola in russo</div>`}
    </div>`);
    if(modo!=="audio") wbox.querySelector('.prompt').textContent = c.it;
    const inp = $(`<input class="winput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="ru"
        inputmode="${useKbd?"none":"text"}" placeholder="${useKbd?"usa la tastiera qui sotto":"scrivi in cirillico…"}">`);
    wbox.appendChild(inp);
    const sol = $(`<div class="wsol" style="display:none"></div>`);
    wbox.appendChild(sol);
    wrap.appendChild(wbox);

    if(modo==="audio"){
      wbox.querySelector(".speak").onclick = ()=>speak(c.ru);
      setTimeout(()=>{ if(mySeq===cardSeq) speak(c.ru); }, 250);
    }

    // --- Tastiera cirillica a schermo ---
    const kbd = useKbd ? makeCyrKeyboard(inp, ()=>paintInput(), ()=>answered) : null;
    if(kbd) wrap.appendChild(kbd);

    const row = $(`<div class="row"></div>`);
    const hint = $(`<button class="btn" type="button" style="flex:0 0 auto;padding:0 16px" title="Scopre la prossima lettera: la carta conta come sbagliata" aria-label="Suggerimento">${ic('bulb')}</button>`);
    const check = $(`<button class="btn primary" type="button" style="flex:1">Verifica</button>`);
    row.appendChild(hint); row.appendChild(check);
    wrap.appendChild(row);

    function paintInput(){
      inp.classList.remove("ok","ko");
    }
    hint.onclick = ()=>{
      if(answered) return;
      usedHint = true;
      const target = c.ru.replace(/́/g,"");
      // Tiene il prefisso già corretto e svela la lettera successiva
      let keep = 0;
      while(keep < inp.value.length && keep < target.length &&
            normWrite(inp.value[keep]) === normWrite(target[keep])) keep++;
      inp.value = target.slice(0, keep+1);
      paintInput();
      if(!settings().kbd) inp.focus();
    };
    const avanti = ()=>{ if(mySeq===cardSeq) advance(); };
    check.onclick = ()=>{
      if(answered){ avanti(); return; }
      const esatto = normWrite(inp.value) === normWrite(c.ru);
      const ok = esatto && !usedHint;
      if(!esatto && !inp.value.trim()) return;   // niente risposta: non si valuta
      answered = true;
      inp.readOnly = true;
      hint.style.display = "none";
      inp.classList.add(ok ? "ok" : "ko");
      grade(c.id, ok);
      haptic(ok);
      if(kbd) kbd.style.display = "none";
      sol.style.display = "";
      speak(c.ru);
      const acts = azioniTesto(c.ru, c.it, {translit:c.translit, tipo:c.tipo, tag:c.tag});
      wrap.insertBefore(acts, row);
      if(ok){
        mastered++;
        sol.innerHTML = `<span style="color:var(--good);font-weight:800">✓ Giusto!</span>`+
          `${c.translit?` &middot; <i>${esc(c.translit)}</i>`:""}${modo==="audio"?` &middot; ${esc(c.it)}`:""}`;
        check.textContent = "Avanti →";
        // si va avanti da soli, a meno che non si tocchi Spiega/Salva
        const auto = setTimeout(()=>{ if(answered) avanti(); }, 1600);
        acts.addEventListener('pointerdown', ()=>clearTimeout(auto), true);
      } else {
        errori++;
        queue.push(c);   // torna in coda: la rivedrai in questa sessione
        sol.innerHTML = `${esatto?"Giusto, ma col suggerimento &mdash; la rivedrai:":"Hai scritto"} <span class="typed">${diffHtml(inp.value, c.ru)}</span>
          <span class="sol">${esc(c.ru)}</span>
          <span style="font-size:13px">${c.translit ? esc(c.translit)+" &middot; " : ""}${esc(c.it)}</span>`;
        check.textContent = "Avanti →";
      }
    };

    // Tastiera fisica (desktop): Invio verifica / prosegue
    inp.onkeydown = e=>{ if(e.key === "Enter"){ e.preventDefault(); check.onclick(); } };
    inp.oninput = paintInput;
    setTimeout(()=>{ try{ inp.focus({preventScroll:true}); }catch(e){} }, 60);
  }
  advance();
}

// ================= IMPOSTAZIONI E BACKUP =================
// Il backup è la funzione più importante della schermata: tutti i progressi
// vivono in localStorage e sparirebbero svuotando i dati del browser o
// reinstallando la PWA.
const BACKUP_PREFIXES = ["russo_", "vika_"];
const BACKUP_ESCLUSI  = ["vika_gemini_key"];   // la chiave API non finisce in un file scaricato
function chiaviBackup(){
  const out = [];
  for(let i=0; i<localStorage.length; i++){
    const k = localStorage.key(i);
    if(!BACKUP_PREFIXES.some(p=>k.startsWith(p))) continue;
    if(BACKUP_ESCLUSI.includes(k)) continue;
    out.push(k);
  }
  return out;
}
function raccogliBackup(){
  const dati = {};
  chiaviBackup().forEach(k=>{ dati[k] = localStorage.getItem(k); });
  return {app:"russo", formato:1, esportato:new Date().toISOString(), dati};
}

  // --- Tema ---
  const rTema = $(`<div class="srow"><div class="lbl">Tema<small>Auto segue il tema del telefono</small></div><div class="ctl"></div></div>`);
  const segT = $(`<div class="seg sm"><button type="button" data-v="auto">Auto</button><button type="button" data-v="chiaro">Chiaro</button><button type="button" data-v="scuro">Scuro</button></div>`);
  function paintT(){ const v = settings().tema; segT.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v===v)); }
  segT.querySelectorAll("button").forEach(b=>{ b.onclick = ()=>{ setSetting("tema", b.dataset.v); applyTheme(); paintT(); }; });
  paintT(); rTema.querySelector(".ctl").appendChild(segT); card.appendChild(rTema);

  // --- Velocità della voce ---
  const rate = settings().ttsRate;
  const rVoce = $(`<div class="srow stack"><div class="lbl">Velocità della voce<small>Quanto lentamente legge il russo</small></div><div class="ctl"></div></div>`);
  const slider = $(`<input type="range" min="0.5" max="1.2" step="0.05" value="${rate}" aria-label="Velocità della voce">`);
  const prova = $(`<button class="linkbtn" type="button" style="margin-top:8px;width:100%;justify-content:center">${ic('vol')} Prova: <b>${rate.toFixed(2)}&times;</b></button>`);
  slider.oninput = ()=>{
    const v = parseFloat(slider.value);
    setSetting("ttsRate", v);
    prova.innerHTML = `${ic('vol')} Prova: <b>${v.toFixed(2)}&times;</b>`;
  };
  slider.onchange = ()=>speak("Здравствуйте, меня зовут Вика");
  prova.onclick = ()=>speak("Здравствуйте, меня зовут Вика");
  rVoce.querySelector(".ctl").appendChild(slider);
  rVoce.querySelector(".ctl").appendChild(prova);
  // senza una voce russa installata la pronuncia non funziona: lo diciamo chiaro
  if('speechSynthesis' in window){
    const warn = $(`<p class="muted" style="text-align:left;margin:8px 0 0;font-size:12.5px;display:none"></p>`);
    const chk = ()=>{
      const vs = speechSynthesis.getVoices();
      if(vs.length && !ruVoice){
        warn.innerHTML = `⚠️ Su questo dispositivo non trovo una <b>voce russa</b>: la pronuncia potrebbe mancare. Su iPhone: Impostazioni → Accessibilità → Contenuti letti → Voci → Russo.`;
        warn.style.display = '';
      }
    };
    setTimeout(chk, 600);
    rVoce.querySelector(".ctl").appendChild(warn);
  }
  card.appendChild(rVoce);

  // --- Carte del ripasso del giorno ---
  const rDaily = $(`<div class="srow"><div class="lbl">Carte del ripasso<small>Quante ne propone «Ripasso del giorno»</small></div><div class="ctl"></div></div>`);
  const segD = $(`<div class="seg sm">${[10,20,30,50].map(n=>`<button type="button" data-v="${n}">${n}</button>`).join("")}</div>`);
  function paintD(){ const v = String(settings().dailySize); segD.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v===v)); }
  segD.querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{
      setSetting("dailySize", +b.dataset.v);
      // il mazzo di oggi si ricompone con la nuova dimensione
      try{ const s = dailyState(); delete s.cards; localStorage.setItem(DAILY_KEY, JSON.stringify(s)); }catch(e){}
      paintD();
    };
  });
  paintD(); rDaily.querySelector(".ctl").appendChild(segD); card.appendChild(rDaily);

  // --- Tastiera cirillica ---
  const rKbd = $(`<div class="srow"><div class="lbl">Tastiera cirillica<small>In Scrittura e Coniugazione. Spenta: usi quella del telefono</small></div><div class="ctl"></div></div>`);
  const segK = $(`<div class="seg sm"><button type="button" data-v="1">Accesa</button><button type="button" data-v="0">Spenta</button></div>`);
  function paintK(){ const v = settings().kbd ? "1" : "0"; segK.querySelectorAll("button").forEach(b=>b.classList.toggle("on", b.dataset.v===v)); }
  segK.querySelectorAll("button").forEach(b=>{ b.onclick = ()=>{ setSetting("kbd", b.dataset.v==="1"); paintK(); }; });
  paintK(); rKbd.querySelector(".ctl").appendChild(segK); card.appendChild(rKbd);
  stage.appendChild(card);

  // --- Promemoria nel calendario ---
  const pm = $(`<div class="pcard"><h3>${ic('bell')} Promemoria giornaliero</h3>
    <p class="muted" style="margin:0 0 12px;font-size:13.5px;line-height:1.55;text-align:left">
      Aggiunge al calendario del telefono un appuntamento ogni giorno, con l'avviso e il link all'app:
      «🇷🇺 Russo: 10 minuti».</p>
    <div class="row" style="align-items:center"><input class="vocab-input plain pm-ora" type="time" value="${esc(settings().promemoria||'19:00')}" aria-label="Ora del promemoria">
    <button class="btn blue" type="button">${ic('cal')} Aggiungi</button></div></div>`);
  const pmOra = pm.querySelector('input');
  pm.querySelector('button').onclick = ()=>{ setSetting('promemoria', pmOra.value||'19:00'); scaricaPromemoria(pmOra.value); toast('📅 Apri il file per aggiungerlo al calendario'); };
  stage.appendChild(pm);

  // --- Backup ---
  const bk = $(`<div class="pcard"><h3>${ic('dl')} Backup dei progressi</h3>
    <p class="muted" style="margin:0 0 13px;font-size:13.5px;line-height:1.55;text-align:left">
      Progressi, parole salvate e serie vivono <b>solo su questo dispositivo</b>: svuotare i dati del
      browser o reinstallare l'app li cancella. Esporta ogni tanto un file di backup e tienilo al sicuro.
    </p></div>`);
  const brow = $(`<div class="row" style="flex-wrap:wrap"></div>`);
  const exp = $(`<button class="btn primary" type="button" style="flex:1 1 140px">${ic('dl')} Esporta</button>`);
  exp.onclick = ()=>{
    const blob = new Blob([JSON.stringify(raccogliBackup(), null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `russo-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  const impBtn = $(`<button class="btn" type="button" style="flex:1 1 140px">${ic('ul')} Importa</button>`);
  const file = $(`<input type="file" accept="application/json,.json" style="display:none">`);
  impBtn.onclick = ()=>file.click();
  file.onchange = ()=>{
    const f = file.files && file.files[0];
    if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      let obj = null;
      try{ obj = JSON.parse(rd.result); }catch(e){}
      if(!obj || obj.app !== "russo" || !obj.dati || typeof obj.dati !== "object"){ alert("Questo file non è un backup dell'app Russo."); file.value=""; return; }
      const n = Object.keys(obj.dati).length;
      if(!confirm(`Ripristino il backup del ${fmtData(String(obj.esportato).slice(0,10))} (${n} voci)?\n\nI progressi attuali su questo dispositivo vengono sostituiti.`)){ file.value=""; return; }
      // sostituisce davvero: via i dati attuali (tranne la chiave di Vika), poi quelli del file
      chiaviBackup().forEach(k=>localStorage.removeItem(k));
      Object.entries(obj.dati).forEach(([k,v])=>{
        if(!BACKUP_PREFIXES.some(p=>k.startsWith(p)) || BACKUP_ESCLUSI.includes(k)) return;
        try{ localStorage.setItem(k, v); }catch(e){}
      });
      alert("Backup ripristinato. L'app si ricarica.");
      location.reload();
    };
    rd.readAsText(f);
  };
  brow.appendChild(exp); brow.appendChild(impBtn); brow.appendChild(file);
  bk.appendChild(brow);
  stage.appendChild(bk);

  // --- App ---
  const appCard = $(`<div class="pcard"><h3>${ic('refresh')} App</h3>
    <p class="muted" style="margin:0 0 13px;font-size:13.5px;line-height:1.55;text-align:left">
      Contenuti v${esc(DB.meta.versione)} del ${fmtData(DB.meta.aggiornato)} &middot; ${(DB.voci||[]).length} parole,
      ${(DB.verbi||[]).length} verbi, ${(DB.frasi||[]).length + (DB.frasiGrammar||[]).length} frasi.
      Se qualcosa sembra vecchio, forza l'aggiornamento.</p></div>`);
  const upd = $(`<button class="btn block" type="button">${ic('refresh')} Aggiorna l'app</button>`);
  upd.onclick = ()=>forceUpdate(upd);
  appCard.appendChild(upd);
  stage.appendChild(appCard);

  // --- Azzera ---
  const rz = $(`<div class="pcard"><h3 style="color:var(--bad)">${ic('trash')} Azzera i progressi</h3>
    <p class="muted" style="margin:0 0 13px;font-size:13.5px;text-align:left">Cancella ripetizioni, serie e parole salvate negli esercizi. I contenuti dell'app e le impostazioni restano.</p></div>`);
  const rzBtn = $(`<button class="btn bad block" type="button">Azzera tutto</button>`);
  rzBtn.onclick = ()=>{
    if(!confirm("Sicuro? Si perdono tutti i progressi.\n\nConsiglio: esporta prima un backup.")) return;
    if(!confirm("Ultima conferma: azzero davvero tutto?")) return;
    [STORE_KEY, DAILY_KEY, ESERCIZI_KEY, ACTIVITY_KEY, USER_KEY, MEM_BEST_KEY].forEach(k=>localStorage.removeItem(k));
    srs = {};
    location.reload();
  };
  rz.appendChild(rzBtn);
  stage.appendChild(rz);

  stage.appendChild($(`<p class="muted" style="font-size:12px">Il backup non contiene la chiave di Vika, che resta solo su questo dispositivo.</p>`));
}

// ---------- theme-color dinamico (chiaro/scuro segue il sistema) ----------
const darkMq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
// Vero se l'app sta mostrando il tema scuro (scelta esplicita o, in "auto", il sistema).
function temaScuro(){
  const t = settings().tema;
  if(t === 'scuro')  return true;
  if(t === 'chiaro') return false;
  return !!(darkMq && darkMq.matches);
}
function syncThemeColor(){
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', temaScuro() ? '#0c1120' : '#ffffff');
}
applyTheme();
if(darkMq && darkMq.addEventListener) darkMq.addEventListener('change', syncThemeColor);

// ---------- skeleton mentre carica ----------
function renderSkeleton(){
  app.innerHTML =
    `<div class="stage" style="gap:12px">`+
    `<div class="sk" style="height:56px;border-radius:16px;width:70%"></div>`+
    `<div class="sk" style="height:150px;border-radius:24px"></div>`+
    `<div class="sk" style="height:78px"></div>`+
    `<div class="grid">${'<div class="tile sk"></div>'.repeat(4)}</div></div>`;
}

// ---------- splash ----------
// Sparisce appena i contenuti sono pronti (restando almeno un secondo, per non
// lampeggiare), oppure al tocco. In ogni caso entro 3 secondi.
const _splash = document.getElementById('splash');
const _splashT0 = Date.now();
function hideSplash(immediato){
  if(!_splash || _splash.classList.contains('fade-out')) return;
  const wait = immediato ? 0 : Math.max(0, 1000 - (Date.now()-_splashT0));
  setTimeout(()=>{
    _splash.classList.add('fade-out');
    setTimeout(()=>_splash.remove(), 450);
  }, wait);
}
if(_splash) _splash.addEventListener('click', ()=>hideSplash(true));
setTimeout(()=>hideSplash(true), 3000);

// ---------- boot ----------
renderSkeleton();
// no-cache = ricontrolla sempre col server, ma se il file non è cambiato non lo
// riscarica (risposta 304): avvio più rapido e meno traffico.
fetch("knowledge.json", {cache:"no-cache"})
  .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(db=>{
    const u = userStore();
    db.voci = [...(db.voci||[]), ...(u.voci||[])];
    DB=db; sincronizzaVerbiEsercizi(); renderHome(); hideSplash();
  })
  .catch(e=>{
    hideSplash(true);
    app.innerHTML=`<div class="errbox"><div class="big">⚠️</div><p>Impossibile caricare i contenuti.<br><span class="muted">Controlla la connessione e riprova.</span></p><button class="btn primary" type="button" onclick="location.reload()" style="max-width:220px">Riprova</button><small>${esc(e)}</small></div>`;
  });

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(()=>{});
}
</script>
</body>
