  .toast{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);max-width:420px;text-align:center;animation:rise .25s ease both;transition:opacity .4s,transform .4s}
  .toast.gold{background:linear-gradient(135deg,#ffd76a,#f0a92a);color:#3d2600}
  .toast.out{opacity:0;transform:translateY(8px)}

  /* livello in home */
  .lvl-chip{margin-top:9px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px 4px 4px;box-shadow:var(--shadow-sm);color:var(--text2);font-size:12.5px;max-width:100%}
  .lvl-chip .lv-n{width:24px;height:24px;border-radius:50%;background:var(--grad-prog);color:#fff;font-weight:800;font-size:12.5px;display:grid;place-items:center;flex:0 0 auto}
  .lvl-chip .lv-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lvl-chip .lv-t b{color:var(--text)}
  .lvl-chip .lv-bar{width:46px;height:5px;border-radius:9px;background:var(--card3);overflow:hidden;flex:0 0 auto}
  .lvl-chip .lv-bar i{display:block;height:100%;background:var(--grad-prog)}

  /* «Oggi per te»: schede che scorrono in orizzontale */
  .oggi-box{margin-top:18px}
  .oggi-box .sec-h{margin:0 2px 8px}
  .oggi-row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
  .oggi-row::-webkit-scrollbar{display:none}
  .oggi-row>*{flex:0 0 82%;scroll-snap-align:start;min-width:0}
  .og-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow-sm);cursor:pointer;display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden;transition:transform .16s}
  .og-card:active{transform:scale(.985)}
  .og-card .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:5px}
  .og-card .k .i{width:14px;height:14px}
  .og-card.prov .k{color:var(--gold)} .og-card.pil .k{color:var(--brick)}
  .og-card.prov::before,.og-card.pil::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .og-card.prov::before{background:linear-gradient(180deg,#ffd76a,#f0a92a)} .og-card.pil::before{background:linear-gradient(180deg,#f06a5a,#ae2f2f)}
  .og-ru{font-size:16px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .og-it{font-size:13px;color:var(--muted);line-height:1.4}
  .og-t{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;line-height:1.3}
  .og-t .e{font-size:26px}

  /* microfono «Pronuncia» */
  .mic-box{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
  .mic-btn.rec{animation:pulse 1.2s ease-in-out infinite}
  .mic-res{font-size:13px;color:var(--muted);text-align:center;line-height:1.45;min-height:0}
  .mic-res:empty{display:none}
  .mic-res b.ok{color:var(--good)} .mic-res b.mid{color:var(--warn)} .mic-res b.ko{color:var(--bad)}
  .mic-res .mr-no{color:var(--warn)}

  /* letture */
  .lt-text{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px 8px;box-shadow:var(--shadow-sm)}
  .lt-s{display:flex;gap:6px;align-items:flex-start;padding:6px 8px 6px 4px;border-radius:12px;transition:background .2s}
  .lt-s.playing{background:var(--accent2-soft)}
  .lt-play{flex:0 0 auto;width:28px;height:28px;border-radius:9px;border:0;background:none;color:var(--muted);display:grid;place-items:center;margin-top:1px}
  .lt-play .i{width:16px;height:16px}
  .lt-play:active{background:var(--card2)}
  .lt-body{flex:1;min-width:0}
  .lt-ru{font-size:18px;line-height:1.55;color:var(--text)}
  .lt-w{cursor:pointer;border-radius:4px;transition:background .15s,color .15s;border-bottom:1px dotted transparent}
  .lt-w:hover{border-bottom-color:var(--accent2)}
  .lt-w.on{background:var(--accent2-soft);color:var(--accent2)}
  .lt-it{display:none;font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:2px}
  .lt-text.show-it .lt-it{display:block}
  .lt-pop{min-width:min(290px,calc(100vw - 24px))}
  .lt-pop .pop-row{flex-wrap:wrap}
  .lt-pop .vika-it{font-size:13.5px}
  .lt-pop .pop-row button{white-space:nowrap}
  .lt-gloss summary{cursor:pointer;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;list-style:none}
  .lt-gloss summary::-webkit-details-marker{display:none}
  .lt-gloss summary .i{width:18px;height:18px;color:var(--muted)}
  .lt-gloss[open] summary{margin-bottom:8px}

  /* cultura, proverbi, parole trappola */
  .prov-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
  .prov-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#ffd76a,#f0a92a)}
  .prov-card .pv-ru{border:0;background:none;padding:0;text-align:left;font-size:19px;font-weight:800;line-height:1.35;color:var(--text);letter-spacing:-.2px}
  .prov-card.sm .pv-ru{font-size:16.5px}
  .prov-card .pv-lett{font-size:13px;color:var(--muted);font-style:italic;line-height:1.45}
  .prov-card .pv-it{font-size:14px;color:var(--text2);font-weight:600}
  .prov-card .pv-it:empty{display:none}
  .prov-card .row{margin-top:6px;flex-wrap:wrap;gap:8px}
  .prov-card.today{border-color:var(--gold)}
  .prov-card .pill{align-self:flex-start}
  .topic.letta{background:var(--good-soft);border-color:transparent}
  .pill-hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:6px 0 2px}
  .pill-hero .e{font-size:54px;line-height:1.1}
  .pill-hero h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px}
  .pill-testo p{font-size:15.5px;line-height:1.65;color:var(--text2)}
  .kw-add{display:flex;align-items:center;gap:8px}
  .kw-add .kw-t{flex:1;display:flex;align-items:baseline;gap:12px;border:0;background:none;text-align:left;color:var(--text);font:inherit;padding:0;min-width:0}
  .kw-add .kw-t b{font-size:15px;font-weight:700;flex:1 1 55%;min-width:0}
  .kw-add .kw-t span{font-size:13px;color:var(--muted);flex:1 1 45%;text-align:right;line-height:1.4}
  .ff-item{display:flex;flex-direction:column;align-items:flex-start;gap:3px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px 14px;box-shadow:var(--shadow-sm);text-align:left;color:var(--text);font:inherit}
  .ff-item b{font-size:17px;font-weight:800}
  .ff-item .ff-no,.ff-item .ff-si{display:flex;align-items:flex-start;gap:6px;font-size:13.5px;line-height:1.4}
  .ff-item .i{width:15px;height:15px;margin-top:2px;flex:0 0 auto}
  .ff-no{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
  .ff-no .i{text-decoration:none}
  .ff-si{color:var(--good);font-weight:600}
  .gm-ru{font-size:15px;font-weight:700;color:var(--text)}
  .num-row .gm-ru + b{font-size:13px;color:var(--muted);font-weight:600;min-width:0}

  /* palestra di grammatica */
  .caso-tag{font-size:12px;font-weight:800;letter-spacing:.02em;color:#fff;width:100%;height:100%;display:grid;place-items:center;border-radius:13px}
  .tile.wide .ico:has(.caso-tag){background:none}
  .c-pre{background:linear-gradient(135deg,#45bdf5,#2f7fe8)} .c-acc{background:linear-gradient(135deg,#f5727f,#d6334a)}
  .c-gen{background:linear-gradient(135deg,#9ad94a,#35a95c)} .c-dat{background:linear-gradient(135deg,#f9b93e,#ef7f17)}
  .c-str{background:linear-gradient(135deg,#a276f5,#6a4bdf)}
  .moto-reg{margin:0 0 12px;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.5;color:var(--text2)}
  .moto-tab{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mv{background:var(--card2);border-radius:13px;padding:10px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}
  .mv-inf{border:0;background:none;padding:0;text-align:left;font-size:17px;font-weight:800;color:var(--accent2)}
  .mv-it{font-size:11.5px;color:var(--muted);line-height:1.35}
  .mv-f{font-size:13px;font-weight:600;line-height:1.4;color:var(--text)}
  .mv-p{font-size:11.5px;color:var(--muted)}

  /* sfida lampo */
  .lampo-top{display:flex;align-items:center;gap:12px}
  .lampo-time{flex:1;height:12px;border-radius:99px;background:var(--card3);overflow:hidden}
  .lampo-time i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffd84d,#f29a12);border-radius:99px}
  .lampo-time i.poco{background:linear-gradient(90deg,#ff8a8a,var(--bad))}
  .lampo-score{font-size:14px;color:var(--muted);font-weight:600;white-space:nowrap}
  .lampo-score b{font-size:24px;color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
  .lampo-q{padding:26px 18px}
  .lampo-opts .opt{padding:13px 16px;font-size:16.5px}

  /* dettato di frasi */
  .slow-play{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-size:24px;display:grid;place-items:center;align-self:center}
  .dt-input{font-size:18px;font-weight:600}
  .dt-input.ok{border-color:var(--good);background:var(--good-soft)}
  .dt-input.ko{border-color:var(--bad);background:var(--bad-soft)}
  .dt-res{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;box-shadow:var(--shadow-sm)}
  .dt-cmp{font-size:18px;font-weight:700;line-height:1.5}
  .dt-cmp .ok{color:var(--good)} .dt-cmp .no{color:var(--bad);text-decoration:underline wavy;text-underline-offset:3px;text-decoration-thickness:1px}
  .dt-it{font-size:13.5px;color:var(--muted);margin-top:3px}
  .dt-tr{font-size:12.5px;color:var(--accent2);font-style:italic;margin-top:2px}
  .er-ru{font-size:22px;font-weight:800;color:var(--accent2);line-height:1.3;margin-top:4px}

  /* percorso A1 */
  .path{display:flex;flex-direction:column;gap:0;position:relative;padding-left:4px}
  .pnode{display:flex;gap:14px;align-items:flex-start;border:0;background:none;text-align:left;color:var(--text);font:inherit;padding:0 0 18px;position:relative}
  .pnode::before{content:"";position:absolute;left:23px;top:48px;bottom:-2px;width:3px;border-radius:3px;background:var(--line2)}
  .pnode:last-child::before{display:none}
  .pnode.p-done::before{background:var(--good)}
  .pn-dot{width:48px;height:48px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:22px;background:var(--card);border:2px solid var(--line2);box-shadow:var(--shadow-sm);position:relative;z-index:1}
  .pnode.p-done .pn-dot{background:var(--good);border-color:var(--good);color:#fff}
  .pnode.p-done .pn-dot .i{width:24px;height:24px;stroke-width:3}
  .pnode.p-cur .pn-dot{border-color:var(--accent2);box-shadow:0 0 0 5px var(--accent2-soft);animation:pulse2 2s ease-in-out infinite}
  .pnode.p-lock .pn-dot{background:var(--card2);color:var(--muted)}
  .pnode.p-lock .pn-dot .i{width:19px;height:19px}
  @keyframes pulse2{0%,100%{box-shadow:0 0 0 4px var(--accent2-soft)}50%{box-shadow:0 0 0 9px var(--accent2-soft)}}
  .pn-txt{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 13px;box-shadow:var(--shadow-sm);transition:transform .15s,border-color .15s}
  .pnode:active .pn-txt{transform:scale(.985)}
  .pnode.p-cur .pn-txt{border-color:var(--accent2)}
  .pnode.p-lock .pn-txt{opacity:.62;box-shadow:none}
  .pn-k{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .pn-k b{color:var(--accent2)}
  .pn-t{font-size:16px;font-weight:800;margin-top:1px}
  .pn-d{font-size:12.5px;color:var(--muted);margin-top:1px}
  .pn-bar{height:5px;border-radius:9px;background:var(--card3);overflow:hidden;margin-top:8px}
  .pn-bar i{display:block;height:100%;background:var(--good);border-radius:9px}
  .tile.passo.p-fatto{background:var(--good-soft);border-color:transparent}
  .tile.passo.p-next{border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent2-soft)}
  .passo-box{display:flex;flex-direction:column;gap:6px}
  .passo-box b{font-size:15px}
  .passo-box p{font-size:13.5px;color:var(--muted);line-height:1.5}
  .passo-box.ok{border-color:var(--good);background:linear-gradient(135deg,var(--card) 60%,var(--good-soft))}
  .passo-box.ko{border-color:var(--gold)}
  .passo-box .btn{margin-top:4px}

  /* progressi: livello e settimana */
  .lvl-head{display:flex;align-items:center;gap:12px}
  .lvl-badge{width:48px;height:48px;border-radius:15px;background:var(--grad-prog);color:#fff;font-size:22px;font-weight:800;display:grid;place-items:center;flex:0 0 auto;box-shadow:0 8px 18px -8px rgba(122,92,240,.7)}
  .lvl-name{font-size:17px}
  .sett{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .sett>div{background:var(--card2);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
  .sett b{font-size:19px;font-weight:800}
  .sett span{font-size:11px;color:var(--muted);font-weight:600;line-height:1.3}
  .sett .up{color:var(--good);white-space:nowrap} .sett .down{color:var(--bad);white-space:nowrap}
  .pm-ora{max-width:150px;font-size:17px;font-weight:700}

  /* Cremlino vivo: di sera stelle, luna e finestre accese; d'inverno la neve */
  .kremlin-sky,.kremlin-snow{display:none;position:absolute;inset:0;pointer-events:none;overflow:hidden}
  body.is-home.sera .kremlin-sky{display:block}
  body.is-home.inverno .kremlin-snow{display:block}
  body.sera{--kwin:#ffd463}
  body.inverno{--ksnow:#ffffff}
  .kremlin-sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:.8;animation:twinkle 3s ease-in-out infinite}
  .kremlin-sky i:nth-child(2){left:18%;top:10px} .kremlin-sky i:nth-child(3){left:31%;top:24px;animation-delay:.8s}
  .kremlin-sky i:nth-child(4){left:64%;top:8px;animation-delay:1.6s} .kremlin-sky i:nth-child(5){left:74%;top:26px;animation-delay:.4s}
  .kremlin-sky i:nth-child(6){left:87%;top:14px;animation-delay:2.2s} .kremlin-sky i:nth-child(7){left:8%;top:30px;animation-delay:1.2s}
  .kremlin-sky .moon{left:auto;right:12%;top:6px;width:15px;height:15px;background:none;border-radius:50%;box-shadow:4px -3px 0 0 var(--gold);opacity:.95;animation:none}
  @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.95;transform:scale(1.15)}}
  .kremlin-snow i{position:absolute;top:-6px;width:4px;height:4px;border-radius:50%;background:var(--snow,#b9c6db);opacity:.9;animation:snow 5s linear infinite}
  .kremlin-snow i:nth-child(1){left:5%} .kremlin-snow i:nth-child(2){left:15%;animation-delay:1.1s;animation-duration:6s}
  .kremlin-snow i:nth-child(3){left:26%;animation-delay:2.3s} .kremlin-snow i:nth-child(4){left:37%;animation-delay:.6s;animation-duration:7s}
  .kremlin-snow i:nth-child(5){left:48%;animation-delay:3.1s} .kremlin-snow i:nth-child(6){left:58%;animation-delay:1.7s;animation-duration:6.5s}
  .kremlin-snow i:nth-child(7){left:69%;animation-delay:.3s} .kremlin-snow i:nth-child(8){left:79%;animation-delay:2.7s;animation-duration:5.5s}
  .kremlin-snow i:nth-child(9){left:88%;animation-delay:1.4s} .kremlin-snow i:nth-child(10){left:96%;animation-delay:3.6s;animation-duration:6.2s}
  @keyframes snow{0%{transform:translate(0,0)}50%{transform:translate(6px,30px)}100%{transform:translate(-2px,62px);opacity:0}}

  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--snow:#e9eef9} }
  :root[data-theme="dark"]{--snow:#e9eef9}

  /* ============================ SPIEGA E SALVA ============================ */
  .tile[data-mode="frasi"]{--tc:#2f8de8}  .tile[data-mode="frasi"] .ico{background:linear-gradient(135deg,#45bdf5,#2f7fe8)}
  .tile[data-mode="giochi"]{--tc:#e89a0c} .tile[data-mode="giochi"] .ico{background:linear-gradient(135deg,#ffd84d,#f29a12)}
  /* barra «Spiega · Salva · Pronuncia» */
  .act-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
  .act-wrap.hidden{display:none}
  .act-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .act{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text2);border-radius:99px;padding:8px 14px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow-sm);transition:transform .12s,background .15s,color .15s;line-height:1.2}
  .act .i{width:16px;height:16px}
  .act:active{transform:scale(.96)}
  .act.act-spiega{color:var(--violet);border-color:rgba(122,92,240,.35)}
  @media (hover:hover){ .act:hover:not(:disabled){border-color:var(--accent2);color:var(--accent2)} .act.act-spiega:hover{border-color:var(--violet);color:var(--violet)} }
  .act.fatto{color:var(--good);background:var(--good-soft);border-color:transparent;box-shadow:none;cursor:default}
  .act.rec{animation:pulse 1.2s ease-in-out infinite;color:var(--accent2)}
  .mini-btn.lens{color:var(--violet);background:rgba(122,92,240,.11)}
  @media (hover:hover){ .mini-btn.lens:hover{background:rgba(122,92,240,.2)} }
  .bub .who{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:22px}
  .bub .who .mini-btn.lens{width:26px;height:26px;border-radius:8px;margin:-3px -6px -3px 0}
  .bub .who .mini-btn.lens .i{width:15px;height:15px}
  .lt-s .lt-lens{width:30px;height:30px;border-radius:9px;margin-top:1px}
  .lt-s .lt-lens .i{width:16px;height:16px}
  .pv-top{display:flex;align-items:flex-start;gap:8px}
  .pv-top .pv-ru{flex:1;min-width:0}
  .pv-acts{display:flex;gap:4px;flex:0 0 auto}
  .ese-item.sbagliata{box-shadow:inset 3px 0 0 var(--bad),var(--shadow-sm)}
  .num-conv .nc-row .mini-btn{align-self:center}
  .kw-add .mini-btn{width:32px;height:32px}

  /* pannello dal basso */
  @keyframes sheetUp{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .sheet-ov{position:fixed;inset:0;z-index:250;background:rgba(8,12,24,.52);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease both;transition:opacity .18s}
  .sheet-ov.out{opacity:0}
  .sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;max-height:88dvh;border-radius:26px 26px 0 0;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:sheetUp .3s cubic-bezier(.2,.8,.3,1) both;padding-bottom:env(safe-area-inset-bottom)}
  .sh-head{display:flex;align-items:center;gap:6px;padding:14px 10px 6px;position:relative;flex:0 0 auto}
  .sh-head::before{content:"";position:absolute;top:7px;left:50%;width:42px;height:5px;margin-left:-21px;border-radius:9px;background:var(--line2)}
  .sh-back,.sh-close{width:38px;height:38px;border-radius:12px;border:0;background:var(--card2);color:var(--text2);display:grid;place-items:center;flex:0 0 auto}
  .sh-back .i,.sh-close .i{width:19px;height:19px}
  .sh-title{flex:1;text-align:center;font-weight:800;font-size:15.5px;letter-spacing:-.1px}
  .sh-body{overflow-y:auto;padding:6px 16px 22px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .sh-page{display:flex;flex-direction:column;gap:12px;animation:rise .2s ease both}
  .sh-hero{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px 16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
  .sh-hero .ru{font-size:22px;font-weight:800;line-height:1.35;letter-spacing:-.3px;cursor:pointer;color:var(--text)}
  .sh-hero .tr{font-size:13.5px;color:var(--accent2);font-style:italic}
  .sh-hero .it{font-size:15px;color:var(--text2);font-weight:600;line-height:1.45}
  .sh-hero .an{font-size:13px;color:var(--muted);line-height:1.5;background:var(--card2);border-radius:10px;padding:6px 10px;margin-top:4px}
  .sh-hero .act-bar{justify-content:flex-start;margin-top:10px}
  .sh-hero .mic-res{align-self:stretch;text-align:left}
  .wbw{display:flex;flex-direction:column;gap:6px}
  .wbw-row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px 8px 10px 10px;cursor:pointer;transition:border-color .15s,transform .12s}
  .wbw-row:active{transform:scale(.99)}
  @media (hover:hover){ .wbw-row:hover{border-color:var(--violet)} }
  .wbw-ru{border:0;background:var(--accent2-soft);color:var(--accent2);font-size:16px;font-weight:800;border-radius:10px;padding:6px 10px;min-width:64px;max-width:42%;text-align:left;overflow-wrap:anywhere;line-height:1.25;flex:0 0 auto}
  .wbw-txt{flex:1;min-width:0;padding-top:2px}
  .wbw-it{font-size:14.5px;font-weight:700;color:var(--text);line-height:1.35}
  .wbw-nota{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:2px}
  .wbw-alt{font-size:11.5px;color:var(--muted);font-style:italic;margin-top:3px;line-height:1.4}
  .wbw-row.ignota .wbw-it{color:var(--muted);font-weight:600;font-style:italic}
  .wbw-row.ignota .wbw-ru{background:var(--card2);color:var(--text2)}
  .wbw-go{color:var(--muted);opacity:.55;flex:0 0 auto;align-self:center}
  .wbw-go .i{transform:rotate(180deg);width:17px;height:17px}
  .sh-note{font-size:12px;color:var(--muted);text-align:center;margin:0;line-height:1.5}
  .sh-alt{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--text2);line-height:1.45}
  .sh-alt b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .sh-forme{padding:12px}
  .sh-forme .decl-toggle{display:none}
  .sh-forme .decl-panel{display:block!important}
  .sh-es{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 8px 9px 12px;cursor:pointer}
  .sh-es .txt{flex:1;min-width:0}
  .sh-es .ru{font-size:15px;font-weight:700;line-height:1.35}
  .sh-es .it{font-size:12.5px;color:var(--muted);margin-top:1px}
  .sh-page .sg-tema{align-self:flex-start}

  /* ============================ DESKTOP ============================ */
  @media (min-width:760px){
    .appbar{padding:0 24px}
    main{max-width:900px;padding:26px 32px 40px}
    .grid{grid-template-columns:repeat(3,1fr);gap:16px}
    .tile{min-height:150px;padding:18px}
    .tile .ico{width:52px;height:52px}
    .tile .t{font-size:16.5px}
    .tile .d{font-size:13px}
    .tile.wide .ico{width:46px;height:46px}
    .topic-grid{grid-template-columns:repeat(3,1fr)}
    .alpha-grid{grid-template-columns:repeat(5,1fr);gap:12px}
    .alpha-letter{font-size:31px}
    /* esercizi: area centrata e comoda, la carta non si "stira" */
    .stage.narrow{max-width:620px;margin:0 auto;width:100%}
    .flash,.face{min-height:300px}
    .flash .ru{font-size:52px}
    .mem-grid{max-width:560px;margin:0 auto}
    .gram-card,.ref-sec{padding:24px}
    .home-top{display:grid;grid-template-columns:1.25fr 1fr;gap:16px!important;align-items:stretch}
    .home-top .tile.feat{height:100%;grid-column:auto}
    .ref-nav{margin:-8px -32px 0;padding:8px 32px}
    .grid.g4,.grid.g5{grid-template-columns:repeat(4,1fr)}
    .home-top .hero{grid-row:span 2}
    .oggi-row{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;margin:0;padding:0}
    .oggi-row>*{min-width:0}
    .moto-tab{grid-template-columns:repeat(4,1fr)}
    .badges{grid-template-columns:repeat(5,1fr)}
    .num-grid{grid-template-columns:repeat(3,1fr)}
    .clock{width:190px;height:190px}
  }
  @media (min-width:900px){
    .grid.g5{grid-template-columns:repeat(5,1fr)}
  }
  @media (min-width:1100px){
    main{max-width:980px;padding:30px 40px 44px}
    .alpha-grid{grid-template-columns:repeat(7,1fr)}
    .stage.narrow{max-width:640px}
    .ref-nav{margin:-8px -40px 0;padding:8px 40px}
  }
  @media (hover:hover) and (pointer:fine){
    .tile:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line2)}
    .alpha-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent2)}
    .hero:hover{transform:translateY(-2px)}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
    .confetti{display:none}
  }
</style>
</head>

// ---------- Vocaboli salvati dall'utente (dal Vocabolario) — compatibilità vecchi dati ----------
function userStore(){ try{ return JSON.parse(localStorage.getItem(USER_KEY)||'{"voci":[]}'); }catch(e){ return {voci:[]}; } }

// ---------- Esercizi: flashcard e verbi salvati manualmente ----------
const ESERCIZI_KEY = "russo_esercizi_v1";
// Lo store tiene tre liste: parole (flashcard), frasi intere e verbi.
// I campi mancanti si riempiono a vuoto: i dati salvati prima che esistessero
// le frasi restano validi.
function esesStore(){
  try{
    const s = JSON.parse(localStorage.getItem(ESERCIZI_KEY)||'{}') || {};
    return {voci:s.voci||[], frasi:s.frasi||[], verbi:s.verbi||[]};
  }catch(e){ return {voci:[],frasi:[],verbi:[]}; }
}
function saveEses(s){ localStorage.setItem(ESERCIZI_KEY, JSON.stringify(s)); }
function addEsesVoce(id, ru, it, translit, tipo, tag){
  const s = esesStore();
  const nuova = !s.voci.some(v=>v.id===id);
  if(nuova){
    s.voci.push({id, ru, it:it||'', translit:translit||'', tipo:tipo||'', tag:tag||[]});
    saveEses(s);
  }
  // Se la parola è un verbo (o una sua forma) di cui conosciamo la
  // coniugazione, negli esercizi entra anche il drill di coniugazione.
  autoAddVerboDaParola(ru, tipo);
  return nuova;
}
function removeEsesVoce(id){ const s=esesStore(); s.voci=s.voci.filter(v=>v.id!==id); saveEses(s); }

// ---------- Frasi intere salvate negli esercizi ----------
// Una frase di "Frasi & grammatica" si porta dietro traduzione, tema e il
// rimando alla regola, così negli Esercizi resta consultabile per intero.
function fraseEseId(f){ return 'fg' + f.id; }
function addEsesFrase(f){
  const s = esesStore();
  const id = fraseEseId(f);
  if(s.frasi.some(x=>x.id===id)) return false;
  s.frasi.push({id, ru:f.ru||'', it:f.it||'', translit:f.translit||'', tema:f.tema||'', regola:f.regola||null});
  saveEses(s);
  return true;
}
function removeEsesFrase(id){ const s=esesStore(); s.frasi=s.frasi.filter(f=>f.id!==id); saveEses(s); }
function isEsesFrase(id){ return esesStore().frasi.some(f=>f.id===id); }
function addEsesVerbo(verbId){ const s=esesStore(); if(s.verbi.includes(verbId)) return false; s.verbi.push(verbId); saveEses(s); return true; }
function removeEsesVerbo(verbId){ const s=esesStore(); s.verbi=s.verbi.filter(v=>v!==verbId); saveEses(s); }
function isEsesVoce(id){ return esesStore().voci.some(v=>v.id===id); }
function isEsesVerbo(id){ return esesStore().verbi.includes(id); }

// ---------- Parola -> verbo: la coniugazione segue la parola ----------
// Ovunque si salvi una parola negli esercizi (Vocabolario, Frasi & grammatica,
// chat con Vika), se quella parola è un verbo di cui abbiamo la coniugazione
// finisce anche nella scheda "Verbi" degli esercizi, pronta da allenare in
// tutte le sue forme.
function normVerbKey(s){ return (s||'').toLowerCase().trim().replace(/ё/g,'е').replace(/\s+/g,' '); }

let _verbFormIdx = null;
// Indice: ogni forma coniugata -> verbo (живу -> жить). Le forme composte del
// futuro ("буду читать") si saltano: contengono già l'infinito.
function verbFormIndex(){
  if(_verbFormIdx) return _verbFormIdx;
  _verbFormIdx = new Map();
  (DB.verbi||[]).forEach(v=>{
    const add = f=>{
      const k = normVerbKey(f);
      if(!k || k.indexOf(' ')>=0) return;
      if(!_verbFormIdx.has(k)) _verbFormIdx.set(k, v);
    };
    add(v.inf);
    Object.values(v.coniugazioni||{}).forEach(forms=>(forms||[]).forEach(add));
  });
  return _verbFormIdx;
}

// Verbo del dizionario che corrisponde a una parola. Prima l'infinito, poi
// una qualsiasi forma coniugata. Una parola che il dizionario registra come
// NON verbo non viene mai scambiata per una forma verbale (мой ≠ мыть).
function findVerboForWord(ru, tipo){
  const key = normVerbKey(ru);
  if(!key) return null;
  const byInf = (DB.verbi||[]).find(v=>normVerbKey(v.inf)===key);
  if(byInf) return byInf;
  // "буду читать" e simili: conta l'infinito che segue l'ausiliare.
  const m = key.match(/^буд(?:у|ешь|ет|ем|ете|ут)\s+(\S+)$/);
  if(m) return findVerboForWord(m[1], 'verbo');
  const t = (tipo||'').toLowerCase().trim();
  if(t && t!=='verbo') return null;
  if(!t){
    const voce = (DB.voci||[]).find(v=>normVerbKey(v.ru)===key);
    if(voce && (voce.tipo||'').toLowerCase()!=='verbo') return null;
  }
  return verbFormIndex().get(key) || null;
}

// Aggiunge agli esercizi la coniugazione del verbo dietro a una parola.
// Restituisce il verbo (anche se era già salvato) o null.
function autoAddVerboDaParola(ru, tipo){
  const v = findVerboForWord(ru, tipo);
  if(!v) return null;
  addEsesVerbo(v.id);
  return v;
}

// All'avvio: anche le parole salvate in passato si portano dietro la loro
// coniugazione, senza doverle riaggiungere a mano.
function sincronizzaVerbiEsercizi(){
  try{
    (esesStore().voci||[]).forEach(w=>autoAddVerboDaParola(w.ru, w.tipo));
  }catch(e){}
}

// Compatibilità: Vika usa queste per salvare parole dalla chat
function isUserVoce(ru){ return esesStore().voci.some(v=>v.ru===ru); }
function addUserVoce(ru, it, translit, tag){
  const id = 'vika_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
  addEsesVoce(id, ru, it||'', translit||'', '', tag ? [tag] : []);
  return true;
}

const DAILY_KEY = "russo_daily_v1";
// Quante carte propone il ripasso del giorno: si cambia dalle Impostazioni.
function dailySize(){ const n = settings().dailySize; return [10,20,30,50].includes(n) ? n : 20; }
function dateStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return dateStr(new Date()); }
function yesterdayStr(){ const d=new Date(); d.setDate(d.getDate()-1); return dateStr(d); }
function dailyState(){ try{ return JSON.parse(localStorage.getItem(DAILY_KEY)||"{}"); }catch(e){ return {}; } }
function dailyStreak(){
  const s=dailyState();
  if(!s.last) return 0;
  return (s.last===todayStr()||s.last===yesterdayStr()) ? (s.streak||0) : 0;
}
function recordDailyDone(){
  const s=dailyState(), t=todayStr();
  s.streak = (s.last===yesterdayStr()) ? (s.streak||0)+1 : (s.last===t ? (s.streak||1) : 1);
  const primaOggi = s.last !== t;
  s.last=t; s.completed=true;
  localStorage.setItem(DAILY_KEY, JSON.stringify(s));
  if(primaOggi) addXP(50);
}
// Restituisce le stesse 20 carte per tutto il giorno.
// Si rinnova solo a mezzanotte o dopo aver completato il mazzo.
function getDailyCards(){
  const allVoci = DB ? (DB.voci||[]) : [];
  if(!allVoci.length) return [];
  const s = dailyState(), t = todayStr();
  const validIds = new Set(allVoci.map(v=>v.id));
  // Stesso giorno e non ancora completato → riusa le carte salvate
  if(s.date===t && !s.completed && s.cards && s.cards.length){
    const still = s.cards.filter(id=>validIds.has(id));
    if(still.length) return allVoci.filter(v=>still.includes(v.id));
  }
  // Nuovo giorno oppure mazzo completato → seleziona nuove 20 carte
  const due = allVoci.filter(v=>isDue(v.id)).sort((a,b)=>dueScore(b.id)-dueScore(a.id));
  const notDue = shuffle(allVoci.filter(v=>!isDue(v.id)));
  const pool = [...due, ...notDue].slice(0, dailySize());
  const saved = dailyState();
  saved.date=t; saved.cards=pool.map(v=>v.id); saved.completed=false;
  localStorage.setItem(DAILY_KEY, JSON.stringify(saved));
  return pool;
}
function dailyPool(){ return getDailyCards(); }

// ---------- Navigation stack ----------
// Ogni schermata (diversa dalla home) viene spinta nello stack.
// Premendo Indietro si torna alla schermata precedente, non sempre alla home.
// Lo stack ricorda anche fin dove si era scorso: tornando a una lista lunga
// (frasi, verbi, argomenti…) si riparte dallo stesso punto, non dall'inizio.
const _navStack = [];
const _scrollAt = [];            // posizione di scorrimento per livello (0 = home)
if('scrollRestoration' in history) history.scrollRestoration = 'manual';
function navigateTo(fn){
  _scrollAt[_navStack.length] = window.scrollY;
  _navStack.push(fn);
  history.pushState({depth:_navStack.length},"");
  fn();
}
function goBack(){ history.back(); }
backBtn.onclick = goBack;
window.addEventListener("popstate", e=>{
  if(!DB) return;
  // la profondità arriva dallo stato: così anche history.go(-n) torna al livello giusto
  const depth = Math.max(0, (e.state && e.state.depth) || 0);
  _navStack.length = Math.min(_navStack.length, depth);
  if(_navStack.length > 0) _navStack[_navStack.length-1]();
  else renderHome();
  const y = _scrollAt[_navStack.length] || 0;
  _scrollAt.length = _navStack.length;
  requestAnimationFrame(()=>window.scrollTo(0, y));
});

// Chi apre risorse "vive" (il microfono di Vika, un timer…) registra qui come
// chiuderle: si chiudono da sole appena si cambia schermata.

function leaveScreen(){
  const fns = _onLeave; _onLeave = [];

  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}

}

const shuffle = a => a.map(x=>[Math.random(),x]).sort((m,n)=>m[0]-n[0]).map(p=>p[1]);
const sample = (a,n)=>shuffle(a).slice(0,n);
// Icona SVG dallo sprite in cima alla pagina (colore = testo circostante)

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Swipe orizzontale per cambiare scheda. Scatta solo se il gesto è davvero
// orizzontale: scorrendo la pagina in verticale non si cambia scheda per sbaglio.
function onSwipe(el, cb){
  let x0=null, y0=null;
  el.addEventListener('touchstart', e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if(x0===null) return;
    const t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    x0=y0=null;
    if(Math.abs(dx) < 20 || Math.abs(dx) < Math.abs(dy)*1.2) return;
    cb(dx < 0 ? 'left' : 'right');
  }, {passive:true});
}
// Coriandoli per i risultati migliori (niente se l'utente preferisce meno animazioni)
function confetti(host){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div');
  box.className = 'confetti';
  const cols = ['#e0364b','#2f66e8','#f0bf55','#16a34a','#9d86ff','#ff8a5b'];
  for(let k=0;k<28;k++){
    const p = document.createElement('i');
    const a = Math.random()*Math.PI*2, d = 70 + Math.random()*110;
    p.style.background = cols[k % cols.length];
    p.style.setProperty('--dx', Math.round(Math.cos(a)*d)+'px');
    p.style.setProperty('--dy', Math.round(Math.sin(a)*d*0.8 + 60)+'px');
    p.style.setProperty('--rot', Math.round(Math.random()*720-360)+'deg');
    p.style.animationDelay = (Math.random()*0.12)+'s';
    box.appendChild(p);
  }
  host.appendChild(box);
  setTimeout(()=>box.remove(), 1500);
}
// Dimensione del carattere in base alla lunghezza: le parole lunghe non escono dalla carta
function fitSize(text, max, min){
  const n = (text||'').length;
  if(n <= 8) return max;
  return Math.max(min, Math.round(max - (n-8)*1.6));
}

// ---------- SRS — ripetizione dilazionata a intervalli crescenti (tempo reale) ----------
// Quando dici di sapere una carta ("La sapevo"), sparisce per un giorno. Se il
// giorno dopo torna e la sai ancora, sparisce per tre giorni, poi una settimana,
// poi sempre più a lungo. Se sbagli ("Da ripassare") riparte da zero.
// Stesso meccanismo in TUTTE le sezioni.
// Il secondo intervallo è 3 giorni e non 7: saltare dritti a una settimana dopo
// una sola risposta giusta è il modo più rapido per dimenticare una parola nuova.
const DAY_MS = 86400000;
const SRS_INTERVALS = [1, 3, 7, 16, 35, 75, 160]; // giorni di attesa per box 1,2,3,…
function box(id){ return (srs[id] && srs[id].box) || 0; }
// Una carta è "in scadenza" (da ripassare ora) se mai vista o se l'intervallo è scaduto.
function isDue(id){ const s = srs[id]; return !s || !s.due || Date.now() >= s.due; }
// Quanto è in ritardo (più alto = più urgente). Le mai viste hanno priorità massima.
function dueScore(id){
  const s = srs[id];
  if(!s || !s.due) return Number.MAX_SAFE_INTEGER;
  return Date.now() - s.due;
}
function grade(id, ok){
  const s = srs[id] || {box:0, seen:0, correct:0};
  if(ok){
    s.box = (s.box||0) + 1;
    const days = SRS_INTERVALS[Math.min(s.box-1, SRS_INTERVALS.length-1)];
    s.due = Date.now() + days*DAY_MS;
  } else {
    s.box = 0;
    s.due = Date.now();           // torna subito in coda nella sessione
  }
  s.seen++; if(ok) s.correct++;
  s.last = Date.now();
  srs[id]=s; saveSrs();
  recordActivity(ok);        // alimenta la mappa dei progressi
  // sbagliata: finisce tra gli errori; giusta: se c'era, ne esce
  const x = voceDaId(id);
  if(x){ if(ok) togliErrore(x.ru); else logErrore(x.ru, x.it, x.fonte); }
}

async function forceUpdate(btnEl){
  if(btnEl){btnEl.innerHTML=`${ic('refresh')} Aggiornamento…`;btnEl.disabled=true;}
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();

}

// Avanzamento del ripasso di oggi. "Fatte" = carte del mazzo già sapute oggi,
// "restano" = carte del mazzo ancora in scadenza. Le carte del mazzo che non
// erano da ripassare (e che oggi non sono state toccate) non contano.
function dailyProgress(){
  const deck = getDailyCards();
  const t0 = new Date(); t0.setHours(0,0,0,0);
  let fatte = 0, restano = 0;
  deck.forEach(v=>{
    if(isDue(v.id)) restano++;
    else if(((srs[v.id]||{}).last||0) >= t0.getTime()) fatte++;
  });
  return {fatte, restano, totale: fatte+restano, completatoOggi: dailyState().last === todayStr()};
}

// Anello di avanzamento SVG (usato dalla card del ripasso)
function ringSVG(frac){
  const R = 31, C = 2*Math.PI*R, off = C*(1-Math.max(0,Math.min(1,frac)));
  return `<svg viewBox="0 0 76 76"><circle class="trk" cx="38" cy="38" r="${R}"/>`+
         `<circle class="val" cx="38" cy="38" r="${R}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-off="${off.toFixed(1)}"/></svg>`;
}

function makeDailyHero(){
  const p = dailyProgress(), streak = dailyStreak();

    // mazzo di oggi finito: ne è già pronto un altro, se si vuole continuare

    title = "Fatto per oggi!";
    sub = p.restano ? "Ottimo lavoro. Se vuoi, allenati con altre carte." : "Ottimo lavoro, torna domani.";

    sub = "Nessuna carta da ripassare adesso: torna più tardi.";
    cta = `${ic('check')} In pari`;
  } else {

    lab = `<b>${p.fatte}</b><small>di ${p.totale}</small>`;

// ---------- DECLINAZIONE AUTOMATICA DEI SOSTANTIVI (regolare) ----------
// Genera i 6 casi (singolare + plurale) per i nomi regolari, in base a
// genere e desinenza. È un'approssimazione: i nomi irregolari e alcune forme
// (soprattutto il genitivo plurale e l'accento mobile) possono differire.
const CASE_ROWS = [
  ['Nominativo','кто? что?','nom'],
  ['Genitivo','кого? чего?','gen'],
  ['Dativo','кому? чему?','dat'],
  ['Accusativo','кого? что?','acc'],
  ['Strumentale','кем? чем?','ins'],
  ['Prepositivo','о ком? о чём?','pre'],
];
const GENDER_INFO = { m:['m.','maschile'], f:['f.','femminile'], n:['n.','neutro'] };

// Nomi indeclinabili (prestiti stranieri): hanno un genere ma non si declinano.
const INDECL_NOUNS = new Set(['кофе','метро','видео','кафе','пальто','такси','радио','кино','меню','шоссе','пианино','какао']);

// Restituisce 'm' | 'f' | 'n' per un sostantivo, oppure null se non è un nome
// (o se il genere è ambiguo). Usato per la scritta M/F/N sulle flashcard.
function genderOf(word, tipo, tags){
  if(!word) return null;
  const lw = word.trim().toLowerCase();
  const ex = NOUN_EXC_NORM[lw.replace(/ё/g,'е')];   // nomi irregolari noti (anche se taggati 'vocabolo')
  if(ex) return ex.g;
  const tip = (tipo||'').toLowerCase();
  if(!/sostantiv/.test(tip)) return null;
  if(/pl\.\)/.test(tip)) return null;               // plurale tantum: niente genere singolare
  if(/\(m/.test(tip)) return 'm';
  if(/\(f/.test(tip)) return 'f';
  if(/\(n/.test(tip)) return 'n';
  // tipo 'sostantivo' senza genere → indovina dalla desinenza
  const e1=lw.slice(-1), e2=lw.slice(-2);
  if(e2==='мя'||e1==='о'||e1==='е'||e1==='ё') return 'n';
  if(e1==='а'||e1==='я') return 'f';
  if(e1==='ь') return null;                          // ambiguo: meglio non indovinare
  return 'm';
}
// HTML del badge M/F/N (vuoto se non è un nome).
function genderBadgeHTML(word, tipo, tags){
  const g = genderOf(word, tipo, tags);
  if(!g) return '';
  const L = {m:'M', f:'F', n:'N'}[g];
  return `<span class="gtag g${g}" title="${GENDER_INFO[g][1]}">${L}</span>`;
}

function _isVowelRu(c){ return 'аеёиоуыэюя'.includes(c); }
function _ap(stem, end){
  if(end===undefined||end===null||end==='') return stem;
  let e=end; const last=stem.slice(-1);
  if(e[0]==='ы' && 'гкхжчшщ'.includes(last)) e='и'+e.slice(1);        // никогда -ы dopo г,к,х,sibilanti
  if(e[0]==='о' && 'жчшщц'.includes(last)) e='е'+e.slice(1);          // -о atono → -е dopo sibilanti/ц
  return stem+e;
}
// desinenze morbide: dopo ж,ч,ш,щ la я→а e la ю→у (es. ночь → ноча́м, non ночям)
function _soft(stem, end){
  if('жчшщ'.includes(stem.slice(-1))){
    if(end[0]==='я') end='а'+end.slice(1);
    else if(end[0]==='ю') end='у'+end.slice(1);
  }
  return stem+end;
}
function _fleetingGenPl(stem){
  const a=stem.slice(-1), b=stem.slice(-2,-1);
  if(!a||!b||_isVowelRu(a)||_isVowelRu(b)) return stem;               // niente cluster finale
  if(b==='й') return stem;                                            // войн- (la й è una semivocale): войн, non воен
  if(b==='ь') return stem.slice(0,-2)+'е'+a;                          // письм- → писем
  const v=('жчшщ'.includes(b)||'жчшщ'.includes(a))?'е':'о';          // vocale mobile е/о
  return stem.slice(0,-1)+v+a;
}
function _genPlFemSoft(stem){
  const a=stem.slice(-1);
  if('жчшщ'.includes(a)) return stem+'ей';
  const fl=_fleetingGenPl(stem);
  if(fl!==stem) return fl;                                            // песн- → песен
  return stem+'ь';                                                    // недел- → недель
}

const NOUN_EXC_NORM = {};
for(const k in NOUN_EXCEPTIONS){ NOUN_EXC_NORM[k.replace(/ё/g,'е')] = NOUN_EXCEPTIONS[k]; }
function _rowObj(arr){
  if(!arr) return {nom:'—',gen:'—',dat:'—',acc:'—',ins:'—',pre:'—'};
  return {nom:arr[0],gen:arr[1],dat:arr[2],acc:arr[3],ins:arr[4],pre:arr[5]};
}

function declineNoun(word, tipo, tags){
  if(!word) return null;
  word=word.trim();
  if(/[\s\-]/.test(word)) return null;                  // niente parole composte / locuzioni
  if(!/^[а-яё]+$/i.test(word)) return null;             // solo una parola cirillica
  const lw=word.toLowerCase();
  // eccezioni irregolari (anche per voci taggate 'vocabolo', purché siano nomi noti)
  const ex = NOUN_EXC_NORM[lw.replace(/ё/g,'е')];
  if(ex) return { gender:ex.g, cls:'irregolare', irr:true, sg:_rowObj(ex.sg), pl:_rowObj(ex.pl) };
  if(INDECL_NOUNS.has(lw)) return null;                 // nomi indeclinabili (кофе, метро…): nessuna declinazione
  const tip=(tipo||'').toLowerCase();
  if(!/sostantiv/.test(tip)) return null;               // declina solo i nomi
  if(/pl\.\)/.test(tip)) return null;                   // i nomi già plurali non si declinano qui
  const animate=(tags||[]).some(t=>['animali','persone','famiglia','professioni'].includes(t));

  let g;
  if(/\(m/.test(tip)) g='m';
  else if(/\(f/.test(tip)) g='f';
  else if(/\(n/.test(tip)) g='n';
  else { const e=lw.slice(-1);                          // tipo 'sostantivo' senza genere → indovina
    if(e==='а'||e==='я') g='f';
    else if(e==='о'||e==='е'||e==='ё') g='n';
    else if(e==='ь') g='f'; else g='m'; }

  const e1=lw.slice(-1), e2=lw.slice(-2);
  let stem, cls;
  if(g==='m'){
    if(e1==='й'){ stem=lw.slice(0,-1); cls='m-j'; }
    else if(e1==='ь'){ stem=lw.slice(0,-1); cls='m-soft'; }
    else if(e1==='а'){ stem=lw.slice(0,-1); cls='f-hard'; }   // папа: si declina come femminile
    else if(e1==='я'){ stem=lw.slice(0,-1); cls='f-soft'; }   // дядя
    else { stem=lw; cls='m-hard'; }
  } else if(g==='n'){
    if(e2==='ие'||e2==='ье'){ stem=lw.slice(0,-1); cls='n-ije'; }
    else if(e1==='е'||e1==='ё'){ stem=lw.slice(0,-1); cls='n-soft'; }
    else if(e1==='о'){ stem=lw.slice(0,-1); cls='n-hard'; }
    else return null;
  } else {
    if(e2==='ия'){ stem=lw.slice(0,-1); cls='f-ija'; }
    else if(e1==='я'){ stem=lw.slice(0,-1); cls='f-soft'; }
    else if(e1==='а'){ stem=lw.slice(0,-1); cls='f-hard'; }
    else if(e1==='ь'){ stem=lw.slice(0,-1); cls='f-sign'; }
    else return null;
  }

  const sg={}, pl={};
  function build(nSg,gSg,dSg,iSg,pSg, nPl,gPl,dPl,iPl,pPl, accSgMode){
    sg.nom=nSg; sg.gen=gSg; sg.dat=dSg; sg.ins=iSg; sg.pre=pSg;
    pl.nom=nPl; pl.gen=gPl; pl.dat=dPl; pl.ins=iPl; pl.pre=pPl;
    sg.acc = accSgMode==='nom' ? nSg : accSgMode==='gen' ? (animate?gSg:nSg) : accSgMode;
    pl.acc = animate ? gPl : nPl;                       // acc. plurale = gen. se animato, nom. altrimenti
  }
  if(cls==='m-hard'){
    const last=stem.slice(-1);
    const gpl='жчшщ'.includes(last)?stem+'ей':(last==='ц'?stem+'ев':stem+'ов');
    build(lw,_ap(stem,'а'),_ap(stem,'у'),_ap(stem,'ом'),_ap(stem,'е'),
          _ap(stem,'ы'),gpl,_ap(stem,'ам'),_ap(stem,'ами'),_ap(stem,'ах'),'gen');
  } else if(cls==='m-soft'){
    build(lw,_soft(stem,'я'),_soft(stem,'ю'),stem+'ем',stem+'е',
          stem+'и',stem+'ей',_soft(stem,'ям'),_soft(stem,'ями'),_soft(stem,'ях'),'gen');
  } else if(cls==='m-j'){
    build(lw,_soft(stem,'я'),_soft(stem,'ю'),stem+'ем',stem+'е',
          stem+'и',stem+'ев',_soft(stem,'ям'),_soft(stem,'ями'),_soft(stem,'ях'),'gen');
  } else if(cls==='n-hard'){
    build(lw,_ap(stem,'а'),_ap(stem,'у'),_ap(stem,'ом'),_ap(stem,'е'),
          _ap(stem,'а'),_fleetingGenPl(stem),_ap(stem,'ам'),_ap(stem,'ами'),_ap(stem,'ах'),'nom');
  } else if(cls==='n-soft'){
    build(lw,_soft(stem,'я'),_soft(stem,'ю'),stem+'ем',stem+'е',
          _soft(stem,'я'),stem+'ей',_soft(stem,'ям'),_soft(stem,'ями'),_soft(stem,'ях'),'nom');
  } else if(cls==='n-ije'){
    build(lw,_soft(stem,'я'),_soft(stem,'ю'),stem+'ем',stem+'и',
          _soft(stem,'я'),stem+'й',_soft(stem,'ям'),_soft(stem,'ями'),_soft(stem,'ях'),'nom');
  } else if(cls==='f-hard'){
    build(lw,_ap(stem,'ы'),_ap(stem,'е'),_ap(stem,'ой'),_ap(stem,'е'),
          _ap(stem,'ы'),_fleetingGenPl(stem),_ap(stem,'ам'),_ap(stem,'ами'),_ap(stem,'ах'),_ap(stem,'у'));
  } else if(cls==='f-soft'){
    build(lw,stem+'и',stem+'е',stem+'ей',stem+'е',
          stem+'и',_genPlFemSoft(stem),_soft(stem,'ям'),_soft(stem,'ями'),_soft(stem,'ях'),_soft(stem,'ю'));
  } else if(cls==='f-ija'){
    build(lw,stem+'и',stem+'и',stem+'ей',stem+'и',
          stem+'и',stem+'й',_soft(stem,'ям'),_soft(stem,'ями'),_soft(stem,'ях'),_soft(stem,'ю'));
  } else if(cls==='f-sign'){
    build(lw,stem+'и',stem+'и',stem+'ью',stem+'и',
          stem+'и',stem+'ей',_soft(stem,'ям'),_soft(stem,'ями'),_soft(stem,'ях'),'nom');
  } else return null;
  // nomi propri (Китай, Америка…): ripristina la maiuscola iniziale nelle forme
  if(/^[А-ЯЁ]/.test(word)){
    for(const o of [sg,pl]) for(const k in o) o[k]=o[k].charAt(0).toUpperCase()+o[k].slice(1);
  }
  return { gender:g, cls, sg, pl };
}

// ---------- DECLINAZIONE DEGLI AGGETTIVI QUALIFICATIVI (e simili: который) ----------
// Un aggettivo russo ha 4 colonne (maschile/femminile/neutro/plurale, non genere separato
// dal numero come i nomi) per ciascuno dei 6 casi. Qui generiamo le forme regolari a
// partire dal nominativo maschile (-ый/-ой/-ий), applicando le due regole ortografiche
// classiche: quella delle "7 lettere" (mai ы dopo г,к,х,ж,ч,ш,щ → и) e quella delle
// "5 lettere" (о atono dopo ж,ч,ш,щ → е). La classe "morbida" (-ний: синий, древний…) usa
// invece я/ю/е ovunque, come i nomi in -ь.
function declineAdj(lemma){
  if(!lemma) return null;
  lemma = lemma.trim();
  if(!/^[а-яё]+$/i.test(lemma)) return null;
  const lw = lemma.toLowerCase();
  let stem, endingType;
  if(lw.endsWith('ой')){ stem = lw.slice(0,-2); endingType='oj'; }
  else if(lw.endsWith('ый')){ stem = lw.slice(0,-2); endingType='yj'; }
  else if(lw.endsWith('ий')){ stem = lw.slice(0,-2); endingType='ij'; }
  else return null;

  const last = stem.slice(-1);
  const VELAR = 'гкх', HUSH = 'жчшщ';
  const isSoft  = /ний$/.test(lw);              // синий, древний, крайний…
  const isVelar = VELAR.includes(last);
  const isHush  = HUSH.includes(last);
  const useI = isVelar || isHush;               // regola delle 7 lettere: mai ы dopo questi → и
  const oE   = isHush && endingType!=='oj';     // sibilante atona: о → е (regola delle 5 lettere)

  const oSuf = (suf)=> oE ? 'е'+suf.slice(1) : suf;         // 'ого'→'его', 'ой'→'ей', 'ом'→'ем', 'ому'→'ему'
  const ySuf = (suf)=> useI ? suf.replace(/ы/g,'и') : suf;
  const oEnd = (sufHard, sufSoft)=> stem + (isSoft ? sufSoft : oSuf(sufHard));
  const yEnd = (sufHard, sufSoft)=> stem + (isSoft ? sufSoft : ySuf(sufHard));

  const m={}, f={}, n={}, pl={};
  m.nom = lemma;
  f.nom  = isSoft ? stem+'яя' : stem+'ая';
  n.nom  = oEnd('ое','ее');
  pl.nom = yEnd('ые','ие');

  m.gen = n.gen = oEnd('ого','его');
  f.gen  = oEnd('ой','ей');
  pl.gen = yEnd('ых','их');

  m.dat = n.dat = oEnd('ому','ему');
  f.dat  = oEnd('ой','ей');
  pl.dat = yEnd('ым','им');

  f.acc = isSoft ? stem+'юю' : stem+'ую';
  n.acc = n.nom;
  m.acc_inan = m.nom; m.acc_anim = m.gen;
  pl.acc_inan = pl.nom; pl.acc_anim = pl.gen;

  m.ins = n.ins = yEnd('ым','им');
  f.ins  = oEnd('ой','ей');
  pl.ins = yEnd('ыми','ими');

  m.pre = n.pre = oEnd('ом','ем');
  f.pre  = oEnd('ой','ей');
  pl.pre = yEnd('ых','их');

  return {m,f,n,pl};
}

// который si declina come un normale aggettivo hard: nessuna voce in ADJLIKE_PRON,
// passa direttamente da declineAdj.
function resolveAdjForms(lemma){
  if(!lemma) return null;
  const key = lemma.trim().toLowerCase();
  return ADJLIKE_PRON[key] || declineAdj(lemma);
}

const PREP_INFO = {

  'на':     {caso:'accusativo / prepositivo', nota:'moto a luogo su una superficie o per lavoro/eventi (+ accusativo): <i>идти на работу</i> — oppure stato in luogo su una superficie (+ prepositivo): <i>книга на столе</i>. Anche per i mezzi di trasporto: <i>на поезде</i>.'},

  'через':  {caso:'accusativo', nota:"moto 'attraverso' un luogo (<i>через лес</i>) oppure 'tra/fra' un intervallo di tempo (<i>через неделю</i>)."},

  'с':      {caso:'strumentale / genitivo', nota:"'con' (compagnia/mezzo, + strumentale): <i>идти с другом</i> — oppure 'da' (provenienza, + genitivo): <i>с девяти</i> (a partire dalle nove)."},

// Pulsante "Declinazioni" + pannello a scomparsa (comune a nomi, aggettivi, pronomi).
// Il pannello resta chiuso finché non lo si apre: sulle flashcard non svela la risposta.
function declToggle(label, panelHtml, extraBtnHtml){
  const wrap = document.createElement('div');
  wrap.className = 'decl-block';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'decl-toggle';
  btn.innerHTML = `${ic('table')} ${label}${extraBtnHtml||''} ${ic('down')}`;
  const panel = document.createElement('div');
  panel.className = 'decl-panel';
  panel.style.display = 'none';
  panel.innerHTML = panelHtml;
  panel.querySelectorAll('[data-w]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); speak(el.dataset.w); };
  });
  btn.onclick = (e)=>{
    e.stopPropagation();
    const open = panel.style.display!=='none';
    panel.style.display = open ? 'none' : 'block';
    btn.classList.toggle('open', !open);
  };
  wrap.appendChild(btn);
  wrap.appendChild(panel);
  return wrap;
}
// Apre subito il pannello (schermate dedicate, dove non c'è nulla da "svelare")
function openDecl(block){
  if(!block) return block;
  block.querySelector('.decl-panel').style.display = 'block';
  block.querySelector('.decl-toggle').classList.add('open');
  return block;
}
const _declCell = (v)=> (!v || v==='—') ? `<td class="ru none">—</td>` : `<td class="ru" data-w="${esc(v)}">${esc(v)}</td>`;

// Costruisce il blocco UI (pulsante + tabella) per le declinazioni, oppure null.
function makeDeclensionBlock(word, tipo, tags){
  const d = declineNoun(word, tipo, tags);
  if(!d) return null;
  const [abbr, full] = GENDER_INFO[d.gender];
  const rows = CASE_ROWS.map(([it, ru, k]) =>
    `<tr><td class="cs">${it}<small>${ru}</small></td>`+
    _declCell(d.sg[k])+_declCell(d.pl[k])+`</tr>`).join('');
  const note = d.irr
    ? 'Nome irregolare: forme verificate a mano. Tocca una forma per ascoltarla.'
    : 'Forme generate automaticamente (declinazione regolare). I nomi irregolari e alcune forme — soprattutto il genitivo plurale — possono differire. Tocca una forma per ascoltarla.';
  const panel =
    `<div class="decl-head"><span class="decl-gender"><b>${abbr.toUpperCase()}</b> ${full}</span>`+
    (d.irr?`<span class="decl-badge">irregolare</span>`:``)+`</div>`+
    `<table class="decl"><thead><tr><th>Caso</th><th>Singolare</th><th>Plurale</th></tr></thead>`+
    `<tbody>${rows}</tbody></table>`+
    `<div class="decl-note">${note}</div>`;
  // mostra il genere M/F/N già sul pulsante (visibile senza aprire le declinazioni)
  return declToggle('Declinazioni', panel, ` <span class="gpill g${d.gender}" title="${full}">${abbr.charAt(0).toUpperCase()}</span>`);
}

// Blocco UI per la declinazione di un aggettivo (o di чей/этот/тот/мой/твой/наш/ваш/свой,
// che si declinano allo stesso modo): 4 colonne (M/F/N/Plurale) × 6 casi.
function makeAdjDeclensionBlock(lemma){
  const d = resolveAdjForms(lemma);
  if(!d) return null;
  const accCell = (obj)=> obj.acc_inan===obj.acc_anim
    ? _declCell(obj.acc_inan)
    : `<td class="ru multi"><span data-w="${esc(obj.acc_inan)}">${esc(obj.acc_inan)}</span><small>animato: <span data-w="${esc(obj.acc_anim)}">${esc(obj.acc_anim)}</span></small></td>`;
  const rows = CASE_ROWS.map(([it, ru, k])=>{
    const accRow = k==='acc';
    return `<tr><td class="cs">${it}<small>${ru}</small></td>`+
      (accRow ? accCell(d.m) : _declCell(d.m[k])) + _declCell(d.f[k]) + _declCell(d.n[k]) +
      (accRow ? accCell(d.pl) : _declCell(d.pl[k])) + `</tr>`;
  }).join('');
  const panel =
    `<div class="tbl-wrap" style="margin:0"><table class="decl adj" style="border:0;border-radius:0"><thead><tr><th>Caso</th><th>M.</th><th>F.</th><th>N.</th><th>Pl.</th></tr></thead>`+

    `<div class="decl-note">L'aggettivo concorda in genere, numero e caso col nome che descrive. Per gli animati l'accusativo (maschile e plurale) è uguale al genitivo. Tocca una forma per ascoltarla.</div>`;
  return declToggle('Declinazioni', panel);
}

// Blocco riutilizzabile: tasti dei tempi + tabella coniugazione di un verbo.
// compact=true → versione ridotta per le liste (Esercizi). Usato anche come
// "reveal" dopo aver risposto a un esercizio di coniugazione (initialTense).
function makeVerbConjBlock(v, compact, initialTense){
  const coniugazioni = (v && v.coniugazioni) || {};
  const tenses = CONJ_TENSES_RU.filter(t=>coniugazioni[t.key] && coniugazioni[t.key].length);
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:10px';
  if(!tenses.length) return wrap;
  // si apre sul tempo richiesto (es. quello appena chiesto nell'esercizio)
  let activeTense = tenses.some(t=>t.key===initialTense) ? initialTense : tenses[0].key;

  const seg = $(`<div class="seg sm"></div>`);
  const tBtns = {};
  for(const t of tenses){
    const b = $(`<button type="button">${t.label}</button>`);
    b.onclick = (e)=>{ e.stopPropagation(); activeTense=t.key; Object.entries(tBtns).forEach(([k,x])=>x.classList.toggle('on',k===activeTense)); render(); };
    seg.appendChild(b); tBtns[t.key]=b;
  }
  tBtns[activeTense].classList.add('on');
  wrap.appendChild(seg);

  const box = document.createElement('div');
  wrap.appendChild(box);
  function render(){
    box.innerHTML='';
    const forms = coniugazioni[activeTense]||[];
    const pronouns = CONJ_PRONOUNS_RU[activeTense]||[];
    const tbl = document.createElement('table');
    tbl.className = 'conj-t' + (compact ? ' compact' : '');
    forms.forEach((form,i)=>{
      const tr=document.createElement('tr');
      const tdP=document.createElement('td');
      tdP.textContent=pronouns[i]||'';
      const tdF=document.createElement('td');
      tdF.className='rf';
      tdF.textContent=form;
      tdF.onclick=(e)=>{ e.stopPropagation(); speak(form); };
      tr.appendChild(tdP); tr.appendChild(tdF); tbl.appendChild(tr);
    });
    box.appendChild(tbl);
  }
  render();
  return wrap;
}

// ---------- VOCABOLARIO (dizionario locale + ricerca online) ----------
// Normalizza per la ricerca: minuscole, ё=е, niente accenti sulle lettere
// latine (privét = privet). Le lettere cirilliche restano intatte (й ≠ и).
function normSearch(s){
  return String(s||'').toLowerCase().replace(/ё/g,'е')
    .normalize('NFD').replace(/([a-z])[̀-ͯ]+/g,'$1').normalize('NFC').trim();
}
// Cerca nel dizionario: prima le corrispondenze esatte, poi le parole che
// iniziano col testo cercato, poi quelle che lo contengono.
function searchVoci(words, q){
  const nq = normSearch(q);
  if(!nq) return words.slice();
  const scored = [];
  words.forEach((w,i)=>{
    const ru = normSearch(w.ru), it = normSearch(w.it), tr = normSearch(w.translit);
    let sc = -1;
    if(ru===nq || it===nq || it.split(/\s*[\/,;(]\s*/).includes(nq)) sc = 0;
    else if(ru.startsWith(nq) || it.startsWith(nq) || tr.startsWith(nq)) sc = 1;
    else if(ru.includes(nq) || it.includes(nq) || tr.includes(nq)) sc = 2;
    if(sc>=0) scored.push([sc, i, w]);
  });
  return scored.sort((a,b)=>a[0]-b[0] || a[1]-b[1]).map(x=>x[2]);
}
// Argomenti con almeno `min` parole, nell'ordine di TOPIC_LABELS: [tag, etichetta, parole]
function topicList(words, min){
  const out = [];
  for(const [tag, label] of Object.entries(TOPIC_LABELS)){
    const ws = words.filter(w=>w.tag && w.tag.includes(tag));
    if(ws.length >= (min||1)) out.push([tag, label, ws]);
  }
  return out;
}

// ---- Scheda di una parola (dizionario, argomenti, ricerca online) ----
function makeVocabCard(ruWord, itTrans, {translit=null, online=false, tipo=null, tags=null, id=null}={}){
  const card = $(`<div class="vocab-card${online?' online':''}"></div>`);
  const gv = genderOf(ruWord, tipo, tags);   // scritta M/F/N per i sostantivi
  const top = $(`<div class="vocab-top">
      <div>
        <div class="vocab-ru"><span></span>${gv?`<span class="gpill g${gv}" title="${GENDER_INFO[gv][1]}">${{m:'M',f:'F',n:'N'}[gv]}</span>`:''}</div>
        ${translit?`<div class="vocab-translit"></div>`:''}
        <div class="vocab-it"></div>
        ${online?`<span class="online-tag">${ic('globe')} traduzione online</span>`:''}
      </div>
      <button class="vocab-speak" type="button" title="Ascolta" aria-label="Ascolta">${ic('vol')}</button>
    </div>`);
  top.querySelector('.vocab-ru span').textContent = ruWord;
  if(translit) top.querySelector('.vocab-translit').textContent = translit;
  top.querySelector('.vocab-it').textContent = itTrans;
  top.querySelector('.vocab-speak').onclick = ()=>speak(ruWord);
  card.appendChild(top);

  // Aggiungi agli Esercizi (le parole online si riconoscono dal testo russo)
  const actions = $(`<div class="vc-actions"></div>`);
  const addBtn = $(`<button class="add-flash-btn" type="button"></button>`);
  const alreadySaved = id ? isEsesVoce(id) : esesStore().voci.some(v=>v.ru===ruWord);
  // Se la parola è un verbo (o una sua forma) con coniugazione nota, salvarla
  // porta negli esercizi anche il drill di coniugazione.
  const verboDiParola = findVerboForWord(ruWord, tipo);
  function setAdded(){ addBtn.innerHTML=`${ic('check')} Negli esercizi`; addBtn.disabled=true; addBtn.classList.add('added'); }
  function setAdd(){ addBtn.innerHTML=`${ic('plus')} Esercizi`; addBtn.title='Aggiungi agli esercizi'; addBtn.disabled=false; addBtn.classList.remove('added'); }
  function notaConj(){
    if(!verboDiParola || card.querySelector('.conj-ese-note')) return;
    card.appendChild(makeConjEseNote(verboDiParola));
  }
  if(alreadySaved) setAdded(); else setAdd();
  addBtn.onclick = ()=>{
    const eid = id || ('online_'+Date.now());
    addEsesVoce(eid, ruWord, itTrans, translit, tipo, tags ? (Array.isArray(tags) ? tags : [tags]) : []);
    setAdded(); notaConj(); haptic(true);
  };
  actions.appendChild(addBtn);
  const spBtn = $(`<button class="add-flash-btn" type="button">${ic('textsearch')} Spiega</button>`);
  spBtn.onclick = e=>{ e.stopPropagation(); spiega(ruWord, itTrans, {translit, tipo, tag:tags}); };
  actions.appendChild(spBtn);
  // Declinazioni (solo per i sostantivi con genere noto)
  const decl = makeDeclensionBlock(ruWord, tipo, tags);
  if(decl) actions.appendChild(decl);
  card.appendChild(actions);
  if(alreadySaved && verboDiParola && isEsesVerbo(verboDiParola.id)) notaConj();
  return card;
}

// Lista di schede parola a pagine (50 alla volta): anche "tutte le 1600
// parole" si apre all'istante.
const VOCAB_PAGE = 50;
function renderWordList(host, list, hdrHtml){
  host.innerHTML = '';
  host.appendChild($(`<div class="results-hdr">${hdrHtml}</div>`));
  let shown = 0;
  const more = $(`<button class="btn sm more-btn" type="button"></button>`);
  function page(){
    list.slice(shown, shown+VOCAB_PAGE).forEach(w=>host.insertBefore(makeVocabCard(w.ru, w.it, {translit:w.translit, tipo:w.tipo, tags:w.tag, id:w.id}), more));
    shown = Math.min(list.length, shown+VOCAB_PAGE);
    const rest = list.length - shown;
    more.innerHTML = `${ic('down')} Mostra altre ${Math.min(rest, VOCAB_PAGE)} <span style="opacity:.6;font-weight:600">&middot; ne restano ${rest}</span>`;
    more.style.display = rest>0 ? '' : 'none';
  }
  more.onclick = page;
  host.appendChild(more);
  page();
}

// opts.tag: 'all' = tutte le parole, oppure un argomento. Senza tag: pagina
// principale con ricerca, argomenti e ricerca online.
function runVocabolario(opts){
  opts = opts || {};
  const all = DB.voci || [];
  const tag = opts.tag || null;
  const base = !tag || tag==='all' ? all : all.filter(w=>w.tag && w.tag.includes(tag));
  const titolo = !tag ? 'Vocabolario' : tag==='all' ? 'Tutte le parole' : (TOPIC_LABELS[tag]||tag);
  const stage = header(titolo);

  const sWrap = $(`<div class="search sticky">${ic('search')}<input class="vocab-input" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>`);
  const inp = sWrap.querySelector('input');
  inp.placeholder = tag ? `Cerca tra ${plur(base.length,'parola','parole')}…` : 'Cerca in italiano o in russo…';
  stage.appendChild(sWrap);

  const browseView = $(`<div class="list" style="gap:12px"></div>`);
  const resultsView = $(`<div class="list" style="display:none"></div>`);
  const localSection = $(`<div class="list"></div>`);
  const onlineSection = $(`<div class="list"></div>`);
  resultsView.append(localSection, onlineSection);
  stage.append(browseView, resultsView);

  function buildBrowse(){
    browseView.innerHTML = '';
    if(tag){
      // pagina di un argomento (o di tutte le parole): la lista, subito
      renderWordList(browseView, base, `${ic('book')} ${plur(base.length,'parola','parole')}`);
      return;
    }
    const allBtn = $(`<button class="tile wide" type="button"><div class="ico">📚</div>
      <div class="txt"><div class="t">Tutte le parole</div><div class="d">${all.length} parole, ${Object.keys(TOPIC_LABELS).length} argomenti</div></div></button>`);
    allBtn.onclick = ()=>navigateTo(()=>runVocabolario({tag:'all'}));
    browseView.appendChild(allBtn);
    browseView.appendChild($(`<div class="sec-h">Per argomento</div>`));
    const grid = $(`<div class="topic-grid"></div>`);
    topicList(all).forEach(([tg, label, ws])=>{
      const b = $(`<button class="topic" type="button"><span class="e">${TOPIC_ICONS[tg]||'📖'}</span>
        <span class="tt"><b>${label}</b><small>${plur(ws.length,'parola','parole')}</small></span></button>`);
      b.onclick = ()=>navigateTo(()=>runVocabolario({tag:tg}));
      grid.appendChild(b);
    });
    browseView.appendChild(grid);
    browseView.appendChild($(`<p class="muted" style="margin:6px 0 0">${ic('globe')} Se una parola non c'è nel dizionario, mentre scrivi la cerco anche online (italiano ⇄ russo).</p>`));
  }

  // ---- Risultati ricerca locale ----
  function renderLocal(q){
    const found = searchVoci(base, q);
    if(!found.length){
      localSection.innerHTML = '';
      localSection.appendChild($(`<div class="results-hdr">${ic('book')} Nel dizionario &middot; nessuna parola</div>`));
      return;
    }
    renderWordList(localSection, found, `${ic('book')} Nel dizionario &middot; ${plur(found.length,'parola','parole')}`);
  }

  // ---- Ricerca online (MyMemory): la direzione si capisce dall'alfabeto ----
  async function doOnline(q){
    if(!q || q.length<2){ onlineSection.innerHTML=''; return; }
    const langpair = /[а-яё]/i.test(q) ? 'ru|it' : 'it|ru';
    onlineSection.innerHTML='';
    onlineSection.appendChild($(`<div class="results-hdr">${ic('globe')} Online &middot; ricerca in corso…</div>`));
    try{
      const r = await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(q)+"&langpair="+encodeURIComponent(langpair));
      const d = await r.json();
      if(inp.value.trim() !== q) return;
      onlineSection.innerHTML = '';
      if(d.responseStatus===200 && d.responseData?.translatedText){
        const main = d.responseData.translatedText;
        const ruWord = langpair==='it|ru' ? main : q;
        const itTrans = langpair==='it|ru' ? q : main;
        const extras = (d.matches||[])
          .filter(m=>m.translation && m.translation!==main && parseFloat(m.quality||0)>50)
          .slice(0,4);
        const total = 1 + extras.length;
        onlineSection.appendChild($(`<div class="results-hdr">${ic('globe')} Online &middot; ${plur(total,'risultato','risultati')}</div>`));
        onlineSection.appendChild(makeVocabCard(ruWord, itTrans, {online:true}));
        extras.forEach(m=>{
          const ruW = langpair==='it|ru' ? m.translation : (m.segment||q);
          const itT = langpair==='it|ru' ? (m.segment||q) : m.translation;
          onlineSection.appendChild(makeVocabCard(ruW, itT, {online:true}));
        });
      } else {
        onlineSection.appendChild($(`<div class="results-hdr">${ic('globe')} Online &middot; nessun risultato</div>`));
      }
    }catch(e){
      if(inp.value.trim() !== q) return;
      onlineSection.innerHTML = '';
      onlineSection.appendChild($(`<div class="results-hdr">${ic('globe')} Online &middot; connessione non disponibile</div>`));
    }
  }

  // ---- Input: cambia vista e lancia la ricerca ----
  let tOnline = null, tLocal = null;
  function triggerSearch(q){
    clearTimeout(tOnline);
    if(!q){ resultsView.style.display='none'; browseView.style.display=''; onlineSection.innerHTML=''; return; }
    browseView.style.display='none'; resultsView.style.display='';
    renderLocal(q);
    // negli argomenti si filtra solo il dizionario; nella pagina principale anche online
    if(!tag && q.length>=2) tOnline = setTimeout(()=>doOnline(q), 500);
    else onlineSection.innerHTML='';
  }
  inp.addEventListener('input', ()=>{
    clearTimeout(tLocal);
    const q = inp.value.trim();
    tLocal = setTimeout(()=>triggerSearch(q), 60);
  });
  inp.addEventListener('keydown', e=>{
    if(e.key==='Escape'){ inp.value=''; triggerSearch(''); inp.blur(); }
    if(e.key==='Enter') inp.blur();          // chiude la tastiera del telefono
  });
  onLeave(()=>{ clearTimeout(tOnline); clearTimeout(tLocal); });

  buildBrowse();
}

// ---------- VERBI ----------
const VERB_CAT_LABELS = {
  fondamentali:'⭐ Fondamentali', comunicazione:'💬 Comunicazione',
  sensi:'👁️ Sensi e percezione', mente:'🧠 Mente e pensiero',
  quotidiano:'🏠 Vita quotidiana', movimento:'🚶 Movimento',
  svago:'🎮 Svago e studio', azioni:'✋ Azioni', sentimenti:'❤️ Sentimenti'
};
const gruppoLabel = g => g==='irr' ? 'Irregolare' : g ? `${g}ª coniugazione` : '';

// Riga di un verbo in una lista (categoria o ricerca)
function verbRow(v){
  const saved = isEsesVerbo(v.id);
  const btn = $(`<button class="tile wide" type="button">
    <div class="txt"><div class="t">${esc(v.inf)}</div><div class="d">${esc(v.en||'')}</div></div>
    ${saved ? `<span class="right pill green">${ic('check')} salvato</span>` : ''}
  </button>`);
  btn.onclick = ()=>navigateTo(()=>runVerboDetail(v));
  return btn;
}

function runVerbi(){
  const stage = header('Verbi');
  const verbi = DB.verbi || [];
  if(!verbi.length){ stage.appendChild($(`<div class="empty">Nessun verbo disponibile.</div>`)); return; }

  // Ricerca: per infinito russo o significato italiano
  const sWrap = $(`<div class="search sticky">${ic('search')}<input class="vocab-input" type="search" enterkeyhint="search" placeholder="Cerca un verbo (russo o italiano)…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>`);
  const inp = sWrap.querySelector('input');
  stage.appendChild(sWrap);
  const catList = $(`<div class="list"></div>`);
  const results = $(`<div class="list" style="display:none"></div>`);
  stage.append(catList, results);

  // Raggruppa per categoria
  const cats = {};
  for(const v of verbi){
    const c = v.categoria || 'azioni';
    (cats[c] = cats[c] || []).push(v);
  }
  catList.appendChild($(`<div class="sec-h" style="margin-top:0">${verbi.length} verbi per categoria</div>`));
  for(const [cat, label] of Object.entries(VERB_CAT_LABELS)){
    const group = cats[cat];
    if(!group || !group.length) continue;
    const nome = label.replace(/^\S+\s*/,'');
    const btn = $(`<button class="tile wide" type="button">
      <div class="ico">${label.split(' ')[0]}</div>
      <div class="txt"><div class="t">${nome}</div><div class="d">${plur(group.length,'verbo','verbi')}</div></div>
    </button>`);
    btn.onclick = ()=>navigateTo(()=>runVerbiCategoria(cat, group, nome));
    catList.appendChild(btn);
  }

  inp.addEventListener('input', ()=>{
    const q = normSearch(inp.value);
    if(!q){ results.style.display='none'; catList.style.display=''; return; }
    catList.style.display='none'; results.style.display='';
    const found = verbi.filter(v=>normSearch(v.inf).includes(q) || normSearch(v.en).includes(q) || normSearch(v.translit_inf).includes(q))
      .sort((a,b)=>(normSearch(b.inf).startsWith(q)||normSearch(b.en).startsWith(q)) - (normSearch(a.inf).startsWith(q)||normSearch(a.en).startsWith(q)));
    results.innerHTML = '';
    results.appendChild($(`<div class="results-hdr">${plur(found.length,'verbo trovato','verbi trovati')}</div>`));
    found.slice(0,80).forEach(v=>results.appendChild(verbRow(v)));
  });
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') inp.blur(); });
}

function runVerbiCategoria(cat, verbi, catLabel){
  const stage = header(catLabel);
  stage.appendChild($(`<div class="sec-h" style="margin-top:0">${plur(verbi.length,'verbo','verbi')} &middot; tocca per la coniugazione</div>`));
  const list = $(`<div class="list"></div>`);
  verbi.forEach(v=>list.appendChild(verbRow(v)));
  stage.appendChild(list);
}

function runVerboDetail(v){

  // Salva in Esercizi + allenamento mirato su questo verbo
  const row = $(`<div class="list"></div>`);
  const saveBtn = $(`<button class="save-ese-btn" type="button"></button>`);
  function paintSaveBtn(){
    const saved = isEsesVerbo(v.id);
    saveBtn.innerHTML = saved ? `${ic('check')} Salvato negli esercizi` : `${ic('plus')} Aggiungi agli esercizi`;
    saveBtn.classList.toggle('saved', saved);
    saveBtn.disabled = saved;
  }
  paintSaveBtn();
  saveBtn.onclick = ()=>{ addEsesVerbo(v.id); paintSaveBtn(); haptic(true); };
  const train = $(`<button class="btn blue" type="button">${ic('zap')} Allenati su questo verbo</button>`);
  train.onclick = ()=>navigateTo(()=>runConjugation(CONJ_TENSES_RU.map(t=>t.key), [v]));
  row.append(train, saveBtn);
  stage.appendChild(row);
}

function runEsercizi(){
  const stage = header('I miei esercizi');

  // ---- Scheda Parole ----

    const s = esesStore();

    const study = $(`<button class="btn primary" type="button">${ic('cards')} Flashcard</button>`);

    const write = $(`<button class="btn" type="button">${ic('pen')} Scrivile</button>`);
    const openWrite = ()=>runScrittura(voci, 'I miei esercizi', {ignoreDue:true, limit:15, restart:openWrite});
    write.onclick = ()=>navigateTo(openWrite);
    btns.append(study, write);
    body.appendChild(btns);
    body.appendChild($(`<div class="sec-h">${plur(s.voci.length,'parola','parole')} &middot; ${due} da ripassare</div>`));
    const list = $(`<div class="list" style="gap:6px"></div>`);
    s.voci.slice().reverse().forEach(w=>{
      const row = $(`<div class="ese-item"><div class="txt"><div class="ru"></div><div class="it"></div></div></div>`);
      row.querySelector('.ru').textContent = w.ru;
      row.querySelector('.it').textContent = w.it;
      row.prepend(spkBtn(w.ru));
      row.append(lensBtn(w.ru, w.it), delBtn(()=>removeEsesVoce(w.id)));
      list.appendChild(row);
    });
    body.appendChild(list);
  }

  // ---- Scheda Frasi ----
  function buildFrasi(body){
    const s = esesStore();
    if(!s.frasi.length){
      body.appendChild($(`<div class="empty"><div class="big">💬</div>Nessuna frase salvata.<small>Nel <b>Frasario</b>, nei <b>Dialoghi</b> o in <b>Frasi &amp; grammatica</b> tocca <b>＋</b>:<br>la frase la allenerai intera, non solo parola per parola.</small></div>`));

    const comp = $(`<button class="btn" type="button">${ic('blocks')} Componi</button>`);

  // ---- Scheda Errori: le risposte sbagliate di tutti gli esercizi ----
  function buildErrori(body){
    const er = erroriStore();
    if(!er.length){
      body.appendChild($(`<div class="empty"><div class="big">🎯</div>Nessun errore da rivedere.<small>Ogni risposta sbagliata, in qualsiasi esercizio, finisce qui:<br>la riallenerai finché non la sai.</small></div>`));
      return;
    }
    const go = $(`<button class="btn primary block" type="button">${ic('refresh')} Ripassa gli errori (${er.length})</button>`);

    body.appendChild(go);
    body.appendChild($(`<div class="sec-h">I più recenti</div>`));
    const list = $(`<div class="list" style="gap:6px"></div>`);
    er.slice().reverse().forEach(e=>{
      const row = $(`<div class="ese-item" style="align-items:flex-start"><div class="txt"><div class="ru"></div><div class="it wrap"></div><span class="sg-tema"></span></div></div>`);
